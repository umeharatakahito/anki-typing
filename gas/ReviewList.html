<style>
  /* 終わったあとのふりかえり（全モード共通）。1 問ずつ ○×、答え、読み、解説、まちがえた回数、☆ マーク、🔊 発音、⚑ 報告 */
  .st-review{ margin:16px auto 6px; max-width:760px; text-align:left; }
  .st-review-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin:0 0 8px; }
  .st-review-head h3{ margin:0; font-size:1rem; }
  .st-review-filters{ display:flex; flex-wrap:wrap; gap:12px; }
  .st-review-filters label{ font-size:13px; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .st-review-help{ font-size:12px; color:var(--muted, #6b7a8c); margin:0 0 8px; }
  .st-review ul{ list-style:none; margin:0; padding:0; max-height:52vh; overflow:auto;
    border:1px solid var(--line, rgba(120,130,150,.35)); border-radius:10px; background:var(--card, #fff); }
  .st-review li{ display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-bottom:1px solid var(--line, rgba(120,130,150,.25)); }
  .st-review li:last-child{ border-bottom:0; }
  .st-review.only-ng li.ok{ display:none; }
  .st-review.only-mark li:not(.marked){ display:none; }
  .st-review .mk{ flex:0 0 1.4em; font-weight:800; font-size:1.05rem; text-align:center; }
  .st-review li.ok .mk{ color:var(--ok, #1a8f3c); } .st-review li.mid .mk{ color:#d68a00; } .st-review li.ng .mk{ color:var(--ng, #c0392b); }
  .st-review .bd{ flex:1 1 auto; min-width:0; }
  .st-review .bd b{ font-size:1.05rem; }
  .st-review .bd small{ margin-left:.5em; color:var(--muted, #6b7a8c); }
  .st-review .bd .sub{ font-size:13px; color:var(--muted, #6b7a8c); margin-top:2px; overflow-wrap:anywhere; }
  .st-review .bd .nt{ font-size:13px; margin-top:4px; white-space:pre-wrap; }
  .st-review .bd .cnt{ display:inline-block; margin-top:4px; font-size:12px; padding:1px 8px; border-radius:999px;
    background:rgba(192,57,43,.1); color:var(--ng, #c0392b); }
  .st-review .bd .cnt.zero{ background:rgba(26,143,60,.1); color:var(--ok, #1a8f3c); }
  .st-review .act{ flex:0 0 auto; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; max-width:15em; }
  .st-review .act button{ font:inherit; font-size:13px; padding:5px 9px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line, rgba(120,130,150,.45)); background:transparent; color:inherit; white-space:nowrap; }
  .st-review .act button:hover{ border-color:var(--accent, #1ba3c6); }
  .st-review .act .rp:hover{ border-color:#e5484d; color:#e5484d; }
  .st-review .act .mkb.on{ background:#fff4cc; border-color:#e0b400; color:#8a6d00; }
  .st-review .act .mkb.learned{ background:rgba(26,143,60,.12); border-color:var(--ok, #1a8f3c); color:var(--ok, #1a8f3c); }
  html[data-theme="dark"] .st-review .act .mkb.on{ background:#3a3212; color:#f5d565; }
</style>
<script>
// ===============================================================
// ReviewList.html
// ゲームが終わったあとの「ふりかえり」。どの画面からも同じ形で出す。
//   stReview.render(container, items, opts)
//     items: [{ mark:'ok'|'mid'|'ng', head, reading?, sub?, note?, say?, report?, key, kbn?, pid? }]
//       say    … 🔊 で読み上げる文字（英語なら英語の声、それ以外は日本語の声）
//       report … ⚑ で送る報告の中身（ReportProblem.html の stReport に渡す）
//       key    … マーク・まちがえた回数を覚えておくための問題の名前（kind ごとに一意）
//     opts: { title, kind: 'typing'|'juken', count: 写経・対戦でなければ true（まちがえた回数・連続正解を数える） }
// ☆ マーク：付けた問題は出やすくなり、5 回続けて正解すると「覚えた」に変わる（そうなったら出やすさは元に戻る）。
// ログインしていればサーバー（marks 表）に、していなければこの端末（localStorage）に残す。
// ===============================================================
(function (window, document) {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MARK = { ok: '○', mid: '△', ng: '×' };
  const LEARN = 5;
  const loggedIn = () => !!window.ST_VIEWER;   // ログインしているときだけ入る（chrome.js）

  function speak(text) {
    // 市高の英単語画面は自然な声を選ぶ仕組みを持っているので、あればそれを使う
    if (window.juken && window.juken.speak && /^[\x20-\x7e]+$/.test(text)) { window.juken.speak(text); return; }
    if (!window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = /^[\x20-\x7e]+$/.test(text) ? 'en-US' : 'ja-JP';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---- ログインしていないとき：この端末に残す（サーバーと同じ決まり） ----
  const LS = 'st-marks-v1';
  function localAll() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } }
  function localSave(all) { try { localStorage.setItem(LS, JSON.stringify(all)); } catch (e) {} }
  function localSync(kind, entries, count) {
    const all = localAll(), out = {};
    entries.forEach(e => {
      const id = kind + ':' + e.key;
      const s = all[id] || { mark: 0, streak: 0, misses: 0 };
      if (count) {
        const ok = e.result === 'ok';
        if (s.mark === 1 && ok && s.streak + 1 >= LEARN) s.mark = 2;
        s.streak = ok ? s.streak + 1 : 0;
        if (!ok) s.misses++;
      }
      all[id] = s; out[e.key] = s;
    });
    localSave(all);
    return out;
  }
  function localSetMark(kind, key, mark) {
    const all = localAll(), id = kind + ':' + key;
    const s = all[id] || { mark: 0, streak: 0, misses: 0 };
    s.mark = mark; if (mark === 1) s.streak = 0;
    all[id] = s; localSave(all);
    return s;
  }

  function run(fn, arg) {
    return new Promise(res => google.script.run.withSuccessHandler(res).withFailureHandler(() => res(null))[fn](arg));
  }

  function markLabel(s) {
    if (!s || !s.mark) return { cls: '', text: '☆ マーク' };
    if (s.mark === 2) return { cls: 'learned', text: '✓ 覚えた' };
    return { cls: 'on', text: `★ マーク中 ${Math.min(s.streak, LEARN)}/${LEARN}` };
  }

  function render(box, items, opts) {
    if (!box) return;
    opts = opts || {};
    const kind = opts.kind === 'juken' ? 'juken' : 'typing';
    const count = !!opts.count;
    const ng = items.filter(i => i.mark !== 'ok').length;
    if (!items.length) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="st-review">
      <div class="st-review-head"><h3>${esc(opts.title || 'ふりかえり')}（${items.length}問・まちがい ${ng}）</h3>
        <div class="st-review-filters">
          ${ng && ng < items.length ? '<label><input type="checkbox" class="st-only-ng"> まちがえた問題だけ</label>' : ''}
          <label><input type="checkbox" class="st-only-mark"> マークした問題だけ</label>
        </div></div>
      <p class="st-review-help">☆ マークした問題は出やすくなります。${LEARN} 回続けて正解すると「覚えた」に変わります。${count ? '' : '（この遊び方の結果は、まちがえた回数・連続正解に数えません）'}${loggedIn() ? '' : '（ログインしていないので、この端末にだけ残ります。出やすくなるのはログインしているときです）'}</p>
      <ul>${items.map((it, i) => `<li class="${it.mark}" data-i="${i}">
        <span class="mk" aria-label="${it.mark === 'ok' ? '正解' : it.mark === 'mid' ? 'ミスあり' : 'まちがい'}">${MARK[it.mark] || ''}</span>
        <div class="bd"><b>${esc(it.head)}</b>${it.reading ? `<small>${esc(it.reading)}</small>` : ''}
          ${it.sub ? `<div class="sub">${esc(it.sub)}</div>` : ''}
          ${it.note ? `<div class="nt">${esc(it.note)}</div>` : ''}
          ${it.key ? '<span class="cnt" hidden></span>' : ''}</div>
        <div class="act">${it.key ? '<button type="button" class="mkb" title="マークすると出やすくなります">☆ マーク</button>' : ''}${it.say ? '<button type="button" class="sp" title="発音を聞く">🔊</button>' : ''}${it.report && window.stReport ? '<button type="button" class="rp" title="この問題を報告">⚑ 報告</button>' : ''}</div>
      </li>`).join('')}</ul></div>`;
    const root = box.querySelector('.st-review');
    const cb = box.querySelector('.st-only-ng'), cm = box.querySelector('.st-only-mark');
    if (cb) cb.onchange = () => root.classList.toggle('only-ng', cb.checked);
    if (cm) cm.onchange = () => root.classList.toggle('only-mark', cm.checked);

    const state = {};
    const lis = Array.from(box.querySelectorAll('li'));
    function paint(li) {
      const it = items[Number(li.dataset.i)];
      if (!it.key) return;
      const s = state[it.key];
      const b = li.querySelector('.mkb'), c = li.querySelector('.cnt');
      const m = markLabel(s);
      b.className = 'mkb' + (m.cls ? ' ' + m.cls : ''); b.textContent = m.text;
      li.classList.toggle('marked', !!(s && s.mark));
      if (s) { c.hidden = false; c.className = 'cnt' + (s.misses ? '' : ' zero'); c.textContent = s.misses ? `まちがえた回数 ${s.misses} 回` : 'まだまちがえていない'; }
    }
    lis.forEach(li => {
      const it = items[Number(li.dataset.i)];
      const sp = li.querySelector('.sp'), rp = li.querySelector('.rp'), mb = li.querySelector('.mkb');
      if (sp) sp.onclick = e => { e.stopPropagation(); speak(it.say); };
      if (rp) rp.onclick = e => { e.stopPropagation(); window.stReport(it.report); };
      if (mb) mb.onclick = async e => {
        e.stopPropagation();
        const cur = state[it.key] || { mark: 0, streak: 0, misses: 0 };
        const next = cur.mark === 1 ? 0 : 1;   // 覚えた・なし → マーク中、マーク中 → なし
        if (loggedIn()) {
          mb.disabled = true;
          const r = await run('setMark', { kind, key: it.key, kbn: it.kbn || '', pid: it.pid || 0, mark: next });
          mb.disabled = false;
          if (r && r.state) state[it.key] = r.state;
        } else state[it.key] = localSetMark(kind, it.key, next);
        // 同じ問題が 2 回出ていたら両方そろえる
        lis.forEach(l => { if (items[Number(l.dataset.i)].key === it.key) paint(l); });
      };
    });

    // 今回の結果を記録して、まちがえた回数・マークを出す（同じ問題が 2 回出たら、どちらかでまちがえたらまちがい）
    const byKey = new Map();
    items.forEach(it => {
      if (!it.key) return;
      const prev = byKey.get(it.key);
      const result = prev && prev.result !== 'ok' ? prev.result : it.mark;
      byKey.set(it.key, { key: it.key, kbn: it.kbn || '', pid: it.pid || 0, result });
    });
    const entries = Array.from(byKey.values());
    if (!entries.length) return;
    const done = st => { Object.assign(state, st || {}); lis.forEach(paint); };
    if (loggedIn()) run('reviewSync', { kind, count, entries }).then(r => done(r && r.state));
    else done(localSync(kind, entries, count));
  }

  window.stReview = { render, speak };
}(window, document));
</script>
