<style>
/* =========================================================
   タイピング（HAMACHI-TYPE）の画面。
   見た目は大学受験モード（JukenCSS）にそろえる：
   ヒラギノ系の書体・落ち着いた地の色・白いカード・角丸の枠のボタン。
   色はすべて変数（--bg / --card / --line / --text / --muted / --accent / --ok / --ng）。
   水色系・黒系の値は ThemeCSS が html[data-theme] ごとに決める。ここの :root は念のための既定値。
   ========================================================= */
:root{
  --bg:#eaf8fc; --card:#ffffff; --line:#a9dcea; --text:#17394b; --muted:#5a7b8b;
  --accent:#1ba9cc; --ok:#12a150; --ng:#e04848;
}
:root{
  --accent-soft:color-mix(in srgb, var(--accent) 14%, transparent);
  --track:color-mix(in srgb, var(--line) 55%, var(--bg));
  --field:color-mix(in srgb, var(--bg) 55%, var(--card));
  --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
  --mono:"SF Mono","Consolas",ui-monospace,Menlo,monospace;
}

/* =========================================================
   Animations
   ========================================================= */
@keyframes loading { 33%{content:"Now Loading."} 66%{content:"Now Loading.."} 100%{content:"Now Loading..."} }
@keyframes grade-slide { from{right:0%;margin-right:0;opacity:1} to{right:100%;margin-right:-150px;opacity:0} }
@keyframes chain-increase { from{transform:scale(1);opacity:1} to{transform:scale(2);opacity:0} }
@keyframes score-increase { from{transform:scale(1);opacity:1} to{transform:scale(2);opacity:0} }

/* =========================================================
   Base
   ========================================================= */
* { box-sizing: border-box; }
html,body { margin:0; padding:0; }
html{ background:var(--bg); -webkit-text-size-adjust:100%; }
body{
  color:var(--text); background:var(--bg); font-size:16px; line-height:1.5;
  font-family:var(--font);
  min-height:100vh; overflow-x:hidden;
  transition:background-color .1s;
}
a{ color:var(--accent); text-decoration:none; outline:none; } a:hover,a:focus-visible{ text-decoration:underline; }
img{ max-width:100%; }
.left{text-align:left;} .right{text-align:right;} .center{text-align:center;}
.med-text{font-size:18px;} .big-text{font-size:24px;}

/* 読み込み中 */
.main-menu.loading:before{
  content:""; position:fixed; inset:0; background:var(--bg); z-index:100;
  opacity:1; transition:opacity 600ms;
}
.main-menu.loading:after{
  content:"Now Loading..."; position:fixed; left:0; right:0; top:50%;
  margin-top:-1em; text-align:center;
  color:var(--muted); font-size:1.1rem; letter-spacing:.12em; z-index:101;
  animation:loading 2s linear infinite;
}
#ja .main-menu.loading.fade-loader-out:after{content:"やるぜ！！"}
.main-menu.loading.fade-loader-out:before,
.main-menu.loading.fade-loader-out:after{ opacity:0; pointer-events:none; animation:none; }

/* Logo（使っていない） */
#logo{ display:none; }

/* 見出し（大学受験モードの .title / .subtitle と同じ） */
#big-title{
  margin:40px auto 28px; padding:0 16px;
  font-size:2rem; font-weight:700; line-height:1.3; letter-spacing:.08em;
  text-align:center; color:var(--text);
}

/* =========================================================
   Buttons（大学受験モードの .btn と同じ：カードの色・細い枠・角丸）
   ========================================================= */
.button, a.button{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  min-height:44px; padding:10px 20px;
  color:var(--text); background:var(--card);
  border:1px solid var(--line); border-radius:10px;
  font-family:inherit; font-size:1rem; font-weight:400; line-height:1.3; text-align:center; text-decoration:none;
  cursor:pointer; outline:none; user-select:none; -webkit-tap-highlight-color:transparent;
  transition:border-color .15s, background-color .15s, transform .08s;
}
.button:hover{ border-color:var(--accent); text-decoration:none; }
.button:active{ transform:translateY(1px); }
.button:focus-visible, .button.menu-opt:focus{
  border-color:var(--accent); outline:2px solid var(--accent); outline-offset:2px;
}
.button[disabled]{ color:var(--muted); background:var(--field); border-color:var(--line); opacity:.6; cursor:default; transform:none; }
.button.menu-opt{ display:flex; width:100%; max-width:none; margin:12px auto; min-height:56px; padding:14px 24px; font-size:1.15rem; }
.button.opt-danger{ color:var(--ng); }
.button.is-saved{ border-color:var(--ok); color:var(--ok); }

/* =========================================================
   Menus（見出し＋カードのボタンを縦に並べるだけ）
   ========================================================= */
.menu{ max-width:860px; margin:0 auto 48px; padding:0 16px; position:relative; background:none; border:0; }
.menu.no-footer{ padding-bottom:0; }
.menu-title{
  margin:0 0 18px; padding:0; background:none;
  color:var(--muted); font-size:.95rem; font-weight:400; letter-spacing:.12em; text-align:center;
}
.menu-content{ font-size:1rem; padding:0; }
.menu-footer{ position:static; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
.menu .menu-content .menu-opt + .menu-opt{ margin-top:12px; }

/* プレイ中に重ねて出す画面（一時停止・終了・やめる確認）はカードにする */
body.playing-game #menu-main, #game-end{
  padding:22px 22px 18px; background:var(--card); border:1px solid var(--line); border-radius:14px;
  box-shadow:0 16px 48px rgba(10, 30, 45, .28);
}
body.playing-game #menu-main .button, #game-end .button{ background:var(--field); }
body.playing-game #menu-main .button:hover, #game-end .button:hover{ background:var(--card); }
body.playing-game #menu-main .menu-title, #game-end .menu-title{ color:var(--text); font-size:1.4rem; font-weight:700; letter-spacing:.06em; }

/* Playメニューの黒点を消す */
#mode-list{ list-style:none; margin:0; padding:0; }
#mode-list li{ margin:12px 0; }

/* どのボタンにも付けられるショートカット・バッジ（大学受験モードの番号の丸と同じ） */
.button[data-key]{ position:relative; padding-left:48px; }
.button[data-key]::before{
  content:attr(data-key);
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:26px; height:26px; line-height:26px; text-align:center;
  font-size:.9rem; font-weight:700; border-radius:50%;
  background:var(--accent); color:#fff;
  pointer-events:none;
}

/* スコア（ランキング表） */
#menu-about select{
  padding:8px 12px; min-height:44px; font-family:inherit; font-size:16px;
  color:var(--text); background:var(--field); border:1px solid var(--line); border-radius:8px;
}
#menu-about .button{ min-height:44px; padding:8px 18px; }
.rank-wrap{ overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
.rank-table{ width:100%; border-collapse:collapse; font-size:.9rem; }
.rank-table th, .rank-table td{ padding:10px; border-bottom:1px solid var(--line); white-space:nowrap; }
.rank-table th{ color:var(--muted); font-weight:400; text-align:left; }
.rank-table tbody tr:last-child td{ border-bottom:0; }

/* =========================================================
   Game HUD（点数・体力・レベル）
   ========================================================= */
#game-stats{ max-width:900px; margin:0 auto; padding:10px 16px 0; }
#game-stats-inner{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }

#hamachi-score-box{ position:relative; margin:0; display:flex; align-items:baseline; gap:8px; }
#hamachi-score-title{ color:var(--muted); font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; }
#hamachi-score{ font-size:1.5rem; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums; }
[data-score-anime]:before{ content:attr(data-score-anime); position:absolute; color:var(--accent); animation:score-increase 300ms linear 1; }

/* HP & Level */
#hamachi-status{ display:flex; align-items:center; gap:10px; }
#hamachi-level-container{ font-weight:700; font-size:1rem; font-variant-numeric:tabular-nums; }
#hamachi-life{ width:100%; display:flex; justify-content:center; pointer-events:none; }
#hamachi-life-inner{ width:320px; height:10px; background:var(--track); border:0; border-radius:999px; overflow:hidden; }
#hamachi-life-bar{ height:100%; width:100%; border-radius:999px; transition:width 150ms linear; }
.hp-gain #hamachi-life-inner{ background:color-mix(in srgb, var(--ok) 35%, var(--track)); } .hp-gain #hamachi-life-bar{ transition:width 500ms; }

/* 残り時間（大学受験モードの細いバー） */
#hamachi-timer{ height:8px; margin-bottom:12px; background:var(--track); border:0; border-radius:4px; overflow:hidden; position:relative; }
#hamachi-time-bar{ height:100%; background:var(--accent); width:100%; border-radius:4px; }
#hamachi-time{ color:var(--text); font-size:11px; text-align:center; position:absolute; inset:0; line-height:8px; }

/* Chain（大学受験モードの連続正解の札） */
#hamachi-chain{ font-weight:700; display:none; padding:3px 12px; border-radius:999px;
  background:rgba(251, 191, 36, .16); color:#d99a06; }
html[data-theme="dark"] #hamachi-chain{ color:#fbbf24; }
#chain-count{ font-size:1.2rem; font-variant-numeric:tabular-nums; }
#chain-label{ font-size:.75rem; letter-spacing:.08em; margin-left:6px; }
[data-chain-anime]:before{ content:attr(data-chain-anime); position:absolute; animation:chain-increase 300ms linear 1; }

/* =========================================================
   Card area（問題カード）
   ========================================================= */
.content-block{ max-width:860px; margin:24px auto; padding:0 16px; }
#input-zone{ display:flex; flex-direction:column; align-items:center; gap:12px; }
#game-input{
  width:100%; min-height:56px; height:auto; padding:10px 14px; outline:none;
  color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px;
  font-family:var(--mono); font-size:24px; letter-spacing:.08em; text-align:center; word-break:break-all;
}
/* 打った文字（JS がオレンジの色を直接付けるので上書きする） */
#game-input span{ color:var(--ok) !important; }
#hamachi-card-container{ margin-top:20px; margin-bottom:0; user-select:none; pointer-events:none; }
#game-stats{ user-select:none; pointer-events:none; }
#hamachi-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 22px; min-height:0; }

/* 画像表示 */
.card-image-container{ height:400px; display:flex; justify-content:center; align-items:center; margin-bottom:12px; }
.card-image{
  width:100%; height:100%; object-fit:contain; display:block;
  background-color:#fff; padding:5px; border:1px solid var(--line); border-radius:8px;
}

/* 問題文/かな */
.word-zone{ text-align:center; margin:6px auto; }
.word-zone .words{ font-size:444px; font-weight:bold; letter-spacing:.01px; color:var(--text); }
.helper{
  font-size:clamp(22px, 3.2vw, 28px);
  font-weight:400; line-height:1.6; color:var(--text);
  word-break:break-word; overflow-wrap:anywhere;
}
/* 問題文に直接付いた色（青）を画面の色に合わせる */
#hamachi-card [style*="color: blue"], #answer-banner [style*="color: blue"]{ color:var(--accent) !important; }

/* カウントダウン */
#countdown{ font-size:88px; font-weight:700; color:var(--accent); text-align:center; font-variant-numeric:tabular-nums; }

/* 答えのかな（ヒント）を出す帯 */
#answer-banner{
  height:54px; background:none; border:0;
  display:flex; align-items:center; justify-content:center;
  font-size:28px; font-weight:700; letter-spacing:.12em; color:var(--accent);
}
/* JS が直接付ける色（青・正解の緑）を画面の色にそろえる */
#answer-banner[style*="rgb(25, 118, 210)"]{ color:var(--accent) !important; }
#answer-banner[style*="rgb(0, 170, 0)"]{ color:var(--ok) !important; }
#answer-banner .hint-next{ color:var(--muted); }

/* かな/漢字のヒント表示 */
.hint-fade{ opacity:0; transition:opacity .2s; }
.hint-visible{ color:var(--text) !important; opacity:1; }
.kanji{ font-size:28px; margin:6px 0 10px; line-height:1.4; }
.kanji:empty{ display:none; }
.kan-chunk.hint-visible{ opacity:1; }
ruby rt{ display:none; }  /* ふりがな帯に出すため、通常は隠す */

/* =========================================================
   Correct toast / grade ticker
   ========================================================= */
#correct-message{ color:var(--ok) !important; }
#hamachi-grade{ height:60px; max-width:800px; margin:0 auto; position:relative; overflow:hidden; pointer-events:none; }
.hamachi-grade-card{ position:absolute; width:150px; opacity:0; animation:grade-slide 5s linear 1; }
.hamachi-grade-text{ font-size:16px; font-weight:bold; }
.grade-great .hamachi-grade-text{ color:#e0a100; }
.grade-good  .hamachi-grade-text{ color:var(--ok); }
.grade-okay  .hamachi-grade-text{ color:var(--accent); }
.grade-miss  .hamachi-grade-text{ color:var(--ng); }

/* =========================================================
   Genki Modal（やめる確認）
   ========================================================= */
#genki-modal-overlay{ position:fixed; inset:0; background:#000; opacity:.45; z-index:9999; }
#genki-modal-body{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:99999;
  display:flex; flex-direction:column; width:min(92vw, 420px); max-height:80vh; padding:20px;
  color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:14px;
  box-shadow:0 16px 48px rgba(10, 30, 45, .3);
}
#genki-modal-header{ margin:0 0 8px; color:var(--text); background:none; text-align:center; font-size:1.2rem; font-weight:700; }
#genki-modal-content{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:6px; font-size:16px; }
#genki-modal-content .med-text{ margin:4px 0; font-size:1rem; }
#genki-modal-buttons{ display:flex; gap:10px; justify-content:center; margin-top:14px; }
#genki-modal-buttons .button{ flex:1 1 0; max-width:10em; margin:0; font-size:1rem; }

/* =========================================================
   Virtual Keyboard（旧版の画面キーボード）
   ========================================================= */
#virtual-keyboard{ display:flex; flex-wrap:wrap; gap:8px; width:616px; margin:0 auto; justify-content:flex-start; }
#virtual-keyboard > div{
  width:44px; height:44px; line-height:44px; text-align:center;
  color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px;
  font-family:var(--mono); font-weight:700;
  transition:transform .05s ease, background-color .1s ease;
}
#virtual-keyboard > div.active{
  background-color:var(--accent) !important; border-color:var(--accent) !important; color:#fff !important;
  transform:translateY(1px);
}
#virtual-keyboard .key_q { margin-left: 22px; }
#virtual-keyboard .key_a { margin-left: 44px; }
#virtual-keyboard .key_z { margin-left: 66px; }
#virtual-keyboard .key_space{ width:308px; margin-left:auto; margin-right:auto; }

/* Pause はキーボード直下に。大学受験モードの「やめる」と同じ小さめのボタン */
#pause-btn{
  display:inline-flex; width:auto; min-height:40px; margin:4px auto 0; padding:8px 18px;
  font-size:.9rem; color:var(--muted);
}

/* =========================================================
   Game End
   ========================================================= */
#game-end .menu-footer{
  position:static; border-top:1px solid var(--line); padding:12px 0 0; margin-top:8px;
  display:flex; flex-direction:column; align-items:stretch; gap:0;
}
#game-end .menu-footer .button.menu-opt{ margin:6px 0; min-height:48px; font-size:1rem; }
#game-end .menu-content{ padding:0 0 12px; text-align:center; }
#game-end-stats > p:first-child{ font-size:1.5rem; color:var(--accent); font-variant-numeric:tabular-nums; margin:4px 0 12px; }
.form-row{ display:flex; align-items:center; gap:12px; max-width:520px; margin:12px auto 8px; }
.form-row .label{ width:auto; min-width:auto; margin:0; text-align:left; color:var(--muted); font-size:.85rem; letter-spacing:.06em; }
#player-name{
  flex:1; max-width:320px; width:100%; min-height:44px;
  padding:9px 12px; font-family:inherit; font-size:16px;
  color:var(--text); background:var(--field); border:1px solid var(--line); border-radius:8px;
}
#player-name:focus{ outline:none; border-color:var(--accent); }

/* =========================================================
   Misc
   ========================================================= */
#answer-banner:empty{ display:block; } /* 空でも高さを保つ */
#card-hiragana{ display:none; }        /* かなは帯に出す方針 */
#pause-btn{ clear:both; }

/* =========================================
   ゲーム画面は横いっぱい・縦の余白は小さめ
   ========================================= */
.playing-game #game { width:100%; margin:0 auto; }
.playing-game .content-block{ max-width:900px; margin:14px auto; padding:0 16px; }
.playing-game #hamachi-life-inner{ width:clamp(140px, 30vw, 320px) !important; }
.playing-game #hamachi-card-container{ margin-top:10px; }
.playing-game .card-image-container{ height:200px; }
/* 雑学の地図（世界地図・日本地図）と写真は細かいので大きめに */
.playing-game .card-image-container:has(img[src*="/fig/zk/map-"], img[src*="/fig/zk/pref-"], img[src*="/fig/zk/photo/"]){ height:clamp(200px, 42vh, 340px); }
.playing-game #countdown{ font-size:64px; }

@media (max-width:700px){
  #big-title{ margin:18px auto 20px; font-size:1.5rem; }
  .menu{ padding:0 14px; }
  .button.menu-opt{ padding:14px 18px; font-size:1.05rem; min-height:52px; }
  #hamachi-card{ padding:12px 14px; }
}
</style>
