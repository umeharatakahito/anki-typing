<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <title>大学受験モード</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <?!= include('JukenCSS'); ?>
  </head>

  <body>
    <div id="app">

      <!-- ========== メニュー ========== -->
      <section id="screen-menu" class="screen">
        <h1 class="title">大学受験モード</h1>
        <p class="subtitle">TYPING FOR ENTRANCE EXAMS</p>

        <ul class="menu-list">
          <li>
            <button class="btn btn-main" onclick="juken.start();">
              <span class="num">1</span>英単語
            </button>
          </li>
          <li>
            <a class="btn btn-main btn-versus" href="versus">
              <span class="num">2</span>対戦モード
            </a>
          </li>
        </ul>

        <div class="settings">
          <div class="setting-row">
            <label for="no-from">見出し語番号</label>
            <input type="number" id="no-from" min="1" step="1" placeholder="最初">
            <span class="tilde">〜</span>
            <input type="number" id="no-to" min="1" step="1" placeholder="最後">
          </div>
          <div class="setting-row">
            <label for="round-size">出題数</label>
            <select id="round-size">
              <option value="10">10問</option>
              <option value="20" selected>20問</option>
              <option value="30">30問</option>
              <option value="50">50問</option>
            </select>
            <label for="order-mode" class="ml">順番</label>
            <select id="order-mode">
              <option value="no" selected>番号の若い順</option>
              <option value="shuffle">シャッフル</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="kind-mode">出題</label>
            <select id="kind-mode">
              <option value="all" selected>単語＋熟語</option>
              <option value="word">単語のみ</option>
              <option value="idiom">熟語のみ</option>
            </select>
          </div>
          <p class="hint" id="range-hint">読み込み中…</p>
        </div>

        <p class="note">日本語→英単語、そのあと例文で意味を確認します</p>
      </section>

      <!-- ========== ゲーム ========== -->
      <section id="screen-game" class="screen" hidden>
        <header class="hud">
          <div class="hud-item"><span class="hud-label">問題</span><span id="hud-progress">1 / 20</span></div>
          <div class="hud-item"><span class="hud-label">正解</span><span id="hud-correct">0</span></div>
          <div class="hud-item"><span class="hud-label">ミス</span><span id="hud-miss">0</span></div>
          <button class="btn btn-quit" onclick="juken.quit();">やめる</button>
        </header>

        <div class="timer"><div class="timer-bar" id="timer-bar"></div></div>

        <div class="stage">
          <div class="phase-tag" id="phase-tag">STEP 1</div>

          <div class="prompt" id="prompt"></div>
          <div class="sub-prompt" id="sub-prompt"></div>

          <div class="answer-line" id="answer-line"></div>
          <div class="guide" id="guide"></div>

          <div class="stage-actions">
            <button class="btn" id="speak-btn" onclick="juken.replay();" hidden>🔊 もう一度聞く</button>
            <button class="btn" id="hint-btn" onclick="juken.showHint();" hidden>ヒント</button>
          </div>
        </div>

        <div class="banner" id="banner"></div>
      </section>

      <!-- ========== 結果 ========== -->
      <section id="screen-result" class="screen" hidden>
        <h1 class="title">おつかれさま</h1>
        <p class="subtitle" id="result-subtitle"></p>

        <div class="result-stats" id="result-stats"></div>
        <div class="review" id="review" hidden>
          <h3>もう一度見直したい単語</h3>
          <ul id="review-list"></ul>
        </div>

        <div class="result-actions">
          <button class="btn btn-main" style="max-width:240px;" onclick="juken.start();">もう一度</button>
          <button class="btn" onclick="juken.toMenu();">メニューに戻る</button>
        </div>
      </section>

    </div>

    <?!= include('RomajiLib'); ?>
    <?!= include('JukenJS'); ?>
    <?!= include('JukenKeyboard'); ?>
  </body>
</html>
