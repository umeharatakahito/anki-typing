<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <title>英単語</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <?!= include('JukenCSS'); ?>
  </head>

  <body data-prefs="eigo">
    <div id="app">

      <!-- ========== メニュー ========== -->
      <section id="screen-menu" class="screen">
        <a class="back-link" href="<?= execUrl ?>?p=juken">← 科目をえらぶ</a>
        <h1 class="title">英単語</h1>
        <p class="subtitle">ENGLISH VOCABULARY</p>

        <ul class="menu-list">
          <li>
            <button class="btn btn-main" onclick="juken.start();">
              <span class="num">1</span>単独でやる
            </button>
          </li>
          <li>
            <a class="btn btn-main btn-link" href="<?= execUrl ?>?p=versus&amp;s=eigo">
              <span class="num">2</span>対戦でやる
            </a>
          </li>
          <li>
            <button class="btn btn-main" onclick="juken.showStats();">
              <span class="num">3</span>記録を見る
            </button>
          </li>
        </ul>

        <div class="settings">
          <div class="setting-row">
            <label for="no-from">見出し語番号</label>
            <input type="number" id="no-from" min="1" step="1" placeholder="最初">
            <span class="tilde">〜</span>
            <input type="number" id="no-to" min="1" step="1" placeholder="最後">
          </div>
          <div class="setting-row">
            <label for="round-size">出題数</label>
            <select id="round-size">
              <option value="10">10問</option>
              <option value="20" selected>20問</option>
              <option value="30">30問</option>
              <option value="50">50問</option>
            </select>
            <label for="order-mode" class="ml">順番</label>
            <select id="order-mode">
              <option value="no" selected>番号の若い順</option>
              <option value="shuffle">シャッフル</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="kind-mode">出題</label>
            <select id="kind-mode">
              <option value="all" selected>単語＋熟語</option>
              <option value="word">単語のみ</option>
              <option value="idiom">熟語のみ</option>
            </select>
            <label for="example-mode" class="ml">例文</label>
            <select id="example-mode">
              <option value="off" selected>なし（英語だけ）</option>
              <option value="on">あり（2段階）</option>
            </select>
          </div>
          <div class="setting-row">
            <label class="check" for="shakyo-mode">
              <input type="checkbox" id="shakyo-mode">写経モード（答えを最初から見せて、速さだけを競う）
            </label>
          </div>
          <div class="setting-row">
            <label for="source-mode">出題元</label>
            <select id="source-mode">
              <option value="all" selected>全体から</option>
              <option value="weak">苦手な語だけ</option>
            </select>
          </div>
          <div class="setting-row">
            <label class="check" for="ghost-mode">
              <input type="checkbox" id="ghost-mode">ゴーストと競走（同じ設定の自己ベストと同じ問題で走る）
            </label>
          </div>
          <p class="hint" id="range-hint">読み込み中…</p>
        </div>

        <p class="note">日本語を見て、英単語をタイプします</p>
      </section>

      <!-- ========== ゲーム ========== -->
      <section id="screen-game" class="screen" hidden>
        <header class="hud">
          <div class="hud-item"><span class="hud-label">問題</span><span id="hud-progress">1 / 20</span></div>
          <div class="hud-item score"><span class="hud-label">スコア</span><span id="hud-score">0</span></div>
          <div class="hud-item"><span class="hud-label">ミス</span><span id="hud-miss">0</span></div>
          <div class="hud-item chain" id="hud-chain-box" hidden>
            <span id="hud-chain">0</span><span class="chain-label">チェイン</span>
          </div>
          <div class="hud-item ghost" id="hud-ghost-box" hidden>
            <span class="hud-label">ゴースト</span><span id="hud-ghost">0 / 0</span><span id="hud-ghost-gap" class="gap"></span>
          </div>
          <button class="btn btn-quit" onclick="juken.quit();">やめる</button>
        </header>

        <div class="timer"><div class="timer-bar" id="timer-bar"></div></div>

        <div class="stage">
          <div class="phase-tag" id="phase-tag">STEP 1</div>

          <div class="prompt" id="prompt"></div>
          <div class="sub-prompt" id="sub-prompt"></div>

          <div class="answer-line" id="answer-line"></div>
          <div class="guide" id="guide"></div>

          <div class="judge" id="judge"></div>

          <div class="stage-actions">
            <button class="btn" id="speak-btn" onclick="juken.replay();" hidden>🔊 もう一度聞く</button>
            <button class="btn" id="hint-btn" onclick="juken.showHint();" hidden>ヒント</button>
            <button class="btn" id="retry-btn" onclick="juken.start();" hidden>もう一度読み込む</button>
          </div>
        </div>

        <div class="banner" id="banner"></div>
      </section>

      <!-- ========== 記録 ========== -->
      <section id="screen-stats" class="screen" hidden>
        <h1 class="title">記録</h1>
        <p class="subtitle">英単語</p>
        <div id="stats-body"></div>
        <div class="result-actions" style="margin-top:28px;">
          <button class="btn" onclick="juken.toMenu();">メニューに戻る</button>
        </div>
      </section>

      <!-- ========== 結果 ========== -->
      <section id="screen-result" class="screen" hidden>
        <h1 class="title">おつかれさま</h1>
        <p class="subtitle" id="result-subtitle"></p>

        <div class="result-stats" id="result-stats"></div>
        <div class="review" id="review" hidden>
          <h3>もう一度見直したい単語</h3>
          <ul id="review-list"></ul>
        </div>

        <div class="result-actions">
          <button class="btn btn-main" style="max-width:240px;" onclick="juken.start();">もう一度</button>
          <button class="btn" onclick="juken.toMenu();">メニューに戻る</button>
        </div>
      </section>

    </div>

    <?!= include('RomajiLib'); ?>
    <?!= include('JukenJS'); ?>
    <?!= include('JukenKeyboard'); ?>
    <?!= include('JukenPrefs'); ?>
  </body>
</html>
