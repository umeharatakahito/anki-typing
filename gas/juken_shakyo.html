<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <title>写経モード</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <?!= include('JukenCSS'); ?>
    <?!= include('ShakyoCSS'); ?>
  </head>

  <body data-subject="<?= subject ?>">
    <div id="app">

      <!-- ========== メニュー ========== -->
      <section id="screen-menu" class="screen">
        <a class="back-link" href="<?= execUrl ?>?p=<?= backRoute ?>">← もどる</a>
        <h1 class="title">写経モード</h1>
        <p class="subtitle"><?= subject == 'kobun' ? '古文単語' : '英単語' ?> ・ ひたすら速く打つ</p>

        <ul class="menu-list">
          <li>
            <button class="btn btn-main" onclick="shakyo.start();">
              <span class="num">1</span>はじめる
            </button>
          </li>
        </ul>

        <div class="settings">
          <div class="setting-row">
            <label for="no-from">見出し語番号</label>
            <input type="number" id="no-from" min="1" step="1" placeholder="最初">
            <span class="tilde">〜</span>
            <input type="number" id="no-to" min="1" step="1" placeholder="最後">
          </div>
          <div class="setting-row">
            <label for="round-size">語数</label>
            <select id="round-size">
              <option value="20">20語</option>
              <option value="50" selected>50語</option>
              <option value="100">100語</option>
              <option value="200">200語</option>
            </select>
            <label for="order-mode" class="ml">順番</label>
            <select id="order-mode">
              <option value="shuffle" selected>シャッフル</option>
              <option value="no">番号の若い順</option>
            </select>
          </div>
          <div class="setting-row">
            <? if (subject == 'kobun') { ?>
              <label for="pos-mode">品詞</label>
              <select id="pos-mode">
                <option value="all" selected>すべて</option>
                <option value="動">動詞</option>
                <option value="形">形容詞</option>
                <option value="形動">形容動詞</option>
                <option value="名">名詞</option>
                <option value="副">副詞</option>
                <option value="連語">連語・その他</option>
              </select>
            <? } else { ?>
              <label for="kind-mode">出題</label>
              <select id="kind-mode">
                <option value="all" selected>単語＋熟語</option>
                <option value="word">単語のみ</option>
                <option value="idiom">熟語のみ</option>
              </select>
            <? } ?>
            <label for="meaning-mode" class="ml">意味</label>
            <select id="meaning-mode">
              <option value="on" selected>出す</option>
              <option value="off">出さない</option>
            </select>
          </div>
          <p class="hint" id="range-hint">読み込み中…</p>
        </div>

        <p class="note">出てきた語をそのまま打つだけ。速さと正確さだけを競います</p>
      </section>

      <!-- ========== ゲーム ========== -->
      <section id="screen-game" class="screen" hidden>
        <header class="hud">
          <div class="hud-item"><span class="hud-label">語</span><span id="hud-progress">1 / 50</span></div>
          <div class="hud-item score"><span class="hud-label">打/分</span><span id="hud-kpm">0</span></div>
          <div class="hud-item"><span class="hud-label">正確</span><span id="hud-acc">100%</span></div>
          <div class="hud-item"><span class="hud-label">時間</span><span id="hud-time">0.0</span></div>
          <button class="btn btn-quit" onclick="shakyo.quit();">やめる</button>
        </header>

        <div class="stage sk-stage">
          <div class="phase-tag" id="phase-tag">写経</div>

          <div class="sk-target" id="sk-target"></div>
          <div class="sk-meaning" id="sk-meaning"></div>
          <div class="guide" id="guide"></div>

          <div class="sk-next" id="sk-next"></div>

          <div class="stage-actions">
            <button class="btn" id="retry-btn" onclick="shakyo.start();" hidden>もう一度読み込む</button>
          </div>
        </div>

        <div class="banner" id="banner"></div>
      </section>

      <!-- ========== 結果 ========== -->
      <section id="screen-result" class="screen" hidden>
        <h1 class="title">写経おわり</h1>
        <p class="subtitle" id="result-subtitle"></p>

        <div class="result-stats" id="result-stats"></div>
        <div class="review" id="review" hidden>
          <h3>つまずいた語</h3>
          <ul id="review-list"></ul>
        </div>

        <div class="result-actions">
          <button class="btn btn-main" style="max-width:240px;" onclick="shakyo.start();">もう一度</button>
          <button class="btn" onclick="shakyo.toMenu();">メニューに戻る</button>
        </div>
      </section>

    </div>

    <?!= include('RomajiLib'); ?>
    <?!= include('ShakyoJS'); ?>
    <?!= include('JukenKeyboard'); ?>
  </body>
</html>
