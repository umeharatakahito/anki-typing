<style>
/* ===============================================================
   ThemeCSS.html
   画面の色を 2 種類から選べるようにする。<html data-theme="…"> で切り替わる。
     blue … 水色系（HAMACHI-TYPE の色）
     dark … 黒系（大学受験モードの色）
   大学受験モードの画面（JukenCSS）は黒系で作ってあるので水色系の値を足し、
   タイピングの画面（CSS.html）は同じ変数を使うので、ここの値だけで両方の色になる。
   各画面の CSS より後に読み込むこと。
   =============================================================== */

/* 画面キーボードなど、大学受験モードの部品が使う色。タイピング画面でも使えるように両方の色で決めておく */
html[data-theme="dark"] {
  --bg: #0f1724;
  --card: #182236;
  --line: #2a3651;
  --text: #e8eef7;
  --muted: #93a3bd;
  --accent: #3bc9db;
  --ok: #34d399;
  --ng: #f87171;
}

/* ---------- 大学受験モード・トップの画面を水色系に ---------- */
html[data-theme="blue"] {
  --bg: #eaf8fc;
  --card: #ffffff;
  --line: #a9dcea;
  --text: #17394b;
  --muted: #5a7b8b;
  --accent: #1ba9cc;
  --ok: #12a150;
  --ng: #e04848;
  --me-soft: rgba(248, 113, 122, .16);
  --you-soft: rgba(96, 165, 250, .16);
}
html[data-theme="blue"] .settings input,
html[data-theme="blue"] .settings select { background: #f5fcfe; }
html[data-theme="blue"] .timer { background: #d4eef5; }
html[data-theme="blue"] .context-en,
html[data-theme="blue"] .rel-df { color: var(--muted); }
html[data-theme="blue"] .answer-line .rest { color: #9bb3bf; }
html[data-theme="blue"] .zu-wrap { box-shadow: 0 6px 20px rgba(23, 57, 75, .18); }
html[data-theme="blue"] #kb { background: #d9f1f8; box-shadow: 0 -8px 24px rgba(23, 57, 75, .15); }
html[data-theme="blue"] .kb-key { background: #ffffff; border-color: #a9dcea; }

/* ---------- タイピング（HAMACHI-TYPE）の画面 ----------
   CSS.html が上の変数だけで色を決めているので、ここで足すのは黒系で目立ちすぎる部分だけ */
html[data-theme="dark"] .card-image { background-color: #fff; }
html[data-theme="dark"] body.playing-game #menu-main,
html[data-theme="dark"] #game-end,
html[data-theme="dark"] #genki-modal-body { box-shadow: 0 16px 48px rgba(0, 0, 0, .55); }
</style>
