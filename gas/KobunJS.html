<script>
(function (window, document) {
  'use strict';

  const PHASE1_DELAY = 1300;  // 古語正解 → 例文へ
  const PHASE2_DELAY = 2000;  // 意味正解 → 次の語へ
  const TIME_LIMIT   = 20000; // 1問あたりの制限時間
  const REVEAL_DELAY = 2600;  // 時間切れで答えを見せる時間

  const BASE_POINTS  = 100;
  const COMBO_STEP   = 0.02;
  const COMBO_CAP    = 50;

  const $ = id => document.getElementById(id);

  const escapeHtml = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // 第2問は現代語訳のほうを空欄にする。データの exja は答えにあたる箇所を
  // 【】で囲んであるので、そこを空欄に差し替える。
  function blankJa(exja) {
    return escapeHtml(exja).replace(/【[^】]*】/, '<span class="blank">　　　　　</span>');
  }

  function revealJa(exja) {
    return escapeHtml(exja).replace(/【([^】]*)】/, '<span class="filled">$1</span>');
  }

  // 古文の例文のうち、出題語にあたる部分に印を付ける
  function markEx(ex) {
    return escapeHtml(ex).replace(/〔([^〕]*)〕/, '<span class="target">$1</span>');
  }

  // 見出し語の表示形。漢字表記があれば添える
  function headword(w) {
    return w.ko + (w.kanji ? '（' + w.kanji + '）' : '');
  }

  const kobun = {
    meta: null,
    words: [],
    matched: 0,
    index: 0,
    useExample: true,
    shakyo: false,     // 答えを最初から見せて、速さだけを競うモード
    revealCount: 0,
    score: 0,
    combo: 0,
    comboMax: 0,
    judges: { great: 0, good: 0, okay: 0 },
    timerStartedAt: 0,
    loadTimer: null,
    phase: 1,
    correct: 0,
    miss: 0,
    playing: false,
    locked: false,
    timerId: null,
    startedAt: 0,
    missedWords: [],
    missedThisWord: false,

    // 両ステップとも、かなをローマ字で打つ
    kanaTokens: [],
    wordR: null,
    pattern: [],
    idx1: 0,
    idx2: 0,
    temp: '',
    hintShown: false,

    // 画面キーボードの見出し
    kbLabel: function () {
      return this.phase === 2 ? 'ローマ字で意味を入力' : 'ローマ字で古語を入力';
    },

    // ---- 画面切替 ----
    showScreen: function (name) {
      ['menu', 'game', 'result'].forEach(s => {
        const el = $('screen-' + s);
        if (el) el.hidden = (s !== name);
      });
    },

    toMenu: function () {
      this.playing = false;
      this.stopTimer();
      this.showScreen('menu');
    },

    quit: function () {
      if (!this.playing) { this.toMenu(); return; }
      this.stopTimer();
      this.words = this.words.slice(0, this.index);
      this.finish();
    },

    // ---- 制限時間 ----
    startTimer: function () {
      this.stopTimer();
      const bar = $('timer-bar');
      const started = Date.now();

      bar.className = 'timer-bar';
      bar.style.width = '100%';
      this.revealCount = 0;
      this.timerStartedAt = started;

      this.timerId = setInterval(() => {
        const elapsed = Date.now() - started;
        const left = Math.max(0, TIME_LIMIT - elapsed);
        const pct = (left / TIME_LIMIT) * 100;
        bar.style.width = pct + '%';
        bar.className = 'timer-bar' + (pct < 20 ? ' danger' : pct < 50 ? ' warn' : '');

        // 半分を過ぎたら答えを頭から少しずつ見せる。
        // 写経はもともと全部見えているので、頭出しはしない。
        const half = TIME_LIMIT / 2;
        const len = this.kanaTokens.length;
        const want = (this.shakyo || elapsed <= half) ? 0
          : Math.min(len, Math.ceil(((elapsed - half) / half) * len));
        if (want !== this.revealCount) {
          this.revealCount = want;
          this.renderKana();
        }

        if (left <= 0) {
          this.stopTimer();
          this.onTimeout();
        }
      }, 100);
    },

    stopTimer: function () {
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
    },

    onTimeout: function () {
      if (!this.playing || this.locked) return;
      const w = this.words[this.index];
      this.locked = true;
      this.countMiss(w);
      this.hintShown = true;
      this.renderKana();

      if (this.phase === 1) {
        $('answer-line').innerHTML = '<span class="reveal">' + escapeHtml(headword(w)) + '</span>';
        $('banner').textContent = '時間切れ — 答えは「' + w.ko + '」';
        $('banner').className = 'banner ng';
        setTimeout(() => {
          if (!this.playing) return;
          if (this.useExample && w.ex) this.toPhase2(); else this.next();
        }, REVEAL_DELAY);
      } else {
        $('prompt').innerHTML = revealJa(w.exja);
        $('answer-line').innerHTML = '<span class="reveal">' + escapeHtml(w.kana) + '</span>';
        $('banner').textContent = '時間切れ';
        $('banner').className = 'banner ng';
        setTimeout(() => { if (this.playing) this.next(); }, REVEAL_DELAY);
      }
    },

    // ---- 収録範囲をメニューに表示 ----
    loadMeta: function () {
      google.script.run
        .withSuccessHandler(meta => {
          this.meta = meta;
          ['no-from', 'no-to'].forEach(id => {
            $(id).min = meta.minNo;
            $(id).max = meta.maxNo;
          });
          $('range-hint').textContent =
            '収録: 見出し語 ' + meta.total +
            '（見出し語番号 ' + meta.minNo + '〜' + meta.maxNo +
            '）　空欄なら全範囲から出題します';
        })
        .withFailureHandler(() => {
          $('range-hint').textContent = '収録範囲を取得できませんでした';
        })
        .getKobunMeta();
    },

    // ---- 開始 ----
    start: function () {
      const opts = {
        from: $('no-from').value,
        to: $('no-to').value,
        limit: $('round-size').value,
        shuffle: $('order-mode').value === 'shuffle',
        pos: $('pos-mode').value
      };
      // 写経は答えが見えている勝負なので、例文ステップは付けない
      this.shakyo = !!($('shakyo-mode') && $('shakyo-mode').checked);
      this.useExample = !this.shakyo && $('example-mode').value === 'on';

      this.showScreen('game');
      this.stopTimer();
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('prompt').textContent = '読み込み中…';
      $('sub-prompt').textContent = '';
      $('answer-line').textContent = '';
      $('guide').textContent = '';
      $('judge').textContent = '';
      $('timer-bar').style.width = '100%';
      ['hint-btn', 'retry-btn'].forEach(id => { $(id).hidden = true; });

      if (this.loadTimer) clearTimeout(this.loadTimer);
      this.loadTimer = setTimeout(() => {
        if (this.playing) return;
        $('prompt').textContent = '読み込みに時間がかかっています';
        $('sub-prompt').textContent = '通信状況を確認して、もう一度お試しください';
        $('retry-btn').hidden = false;
      }, 25000);

      const done = () => { if (this.loadTimer) { clearTimeout(this.loadTimer); this.loadTimer = null; } };

      google.script.run
        .withSuccessHandler(res => {
          done();
          if (!res || res.error || !res.words || !res.words.length) {
            $('prompt').textContent = '出題できる語がありません';
            $('sub-prompt').textContent = res && res.error ? res.error : '出題範囲を見直してください';
            $('retry-btn').hidden = false;
            return;
          }
          this.words = res.words;
          this.matched = res.matched;
          this.index = 0;
          this.correct = 0;
          this.miss = 0;
          this.score = 0;
          this.combo = 0;
          this.comboMax = 0;
          this.judges = { great: 0, good: 0, okay: 0 };
          this.missedWords = [];
          this.startedAt = Date.now();
          this.playing = true;
          this.showQuestion();
        })
        .withFailureHandler(err => {
          done();
          $('prompt').textContent = 'サーバーとの通信に失敗しました';
          $('sub-prompt').textContent = err && err.message ? err.message : '';
          $('retry-btn').hidden = false;
        })
        .getKobunWords(opts);
    },

    // ---- 打つ対象のかなをセットする ----
    setKanaTarget: function (kana) {
      const conv = kanaToRoman(kana);
      this.wordR = conv[0];
      this.kanaTokens = conv[1];
      this.pattern = new Array(this.wordR.length).fill(0);
      this.idx1 = 0;
      this.idx2 = 0;
      this.temp = '';
      this.hintShown = false;
      this.revealCount = 0;   // 前の問題の頭出しを持ち越さない
    },

    // ---- STEP1: 現代語訳 → 古語 ----
    showQuestion: function () {
      const w = this.words[this.index];
      this.phase = 1;
      this.locked = false;
      this.missedThisWord = false;
      this.setKanaTarget(w.ko);

      $('phase-tag').textContent = this.shakyo
        ? '写経 ・ 見たまま打つ'
        : (this.useExample && w.ex ? 'STEP 1 ・ ' : '') + '古語をタイプ';
      $('prompt').textContent = w.ja;
      // 語感や使い方の一言は、データにあるときだけ小さく添える
      $('sub-prompt').innerHTML = escapeHtml(
          (this.shakyo ? '見えている古語をそのまま打つ' : 'この意味の古語は？') +
          (w.pos ? '（' + w.pos + '）' : '') + '　見出し語 ' + w.no) +
        (w.nu ? '<span class="nuance">' + escapeHtml(w.nu) + '</span>' : '');
      $('guide').textContent = '';
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('hint-btn').hidden = this.shakyo;
      $('retry-btn').hidden = true;
      $('judge').textContent = '';
      $('judge').className = 'judge';

      this.renderKana();
      this.renderHud();
      this.startTimer();
    },

    onPhase1Clear: function () {
      const w = this.words[this.index];
      this.locked = true;
      this.stopTimer();
      $('answer-line').innerHTML = '<span class="done">' + escapeHtml(headword(w)) + '</span>';
      $('banner').textContent = '正解！';
      $('banner').className = 'banner ok';
      // 本が同じ見出し語番号にまとめている異形も見せておく
      if (w.alt && w.alt.length) {
        $('guide').textContent = '同じ番号: ' + w.alt.join('・');
      }

      if (!this.useExample || !w.ex) {
        this.correct++;
        this.award();
      }

      setTimeout(() => {
        if (!this.playing) return;
        if (this.useExample && w.ex) this.toPhase2(); else this.next();
      }, PHASE1_DELAY);
    },

    // ---- STEP2: 例文 → 訳の空欄を埋める ----
    toPhase2: function () {
      const w = this.words[this.index];
      this.phase = 2;
      this.locked = false;
      this.setKanaTarget(w.kana);

      $('phase-tag').textContent = 'STEP 2 ・ 意味をタイプ';
      $('prompt').innerHTML = blankJa(w.exja);
      $('sub-prompt').innerHTML =
        '<span class="context-en">' + markEx(w.ex) + '</span>空欄に入る言葉は？';
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('guide').textContent = '';
      $('hint-btn').hidden = false;

      this.renderKana();
      this.startTimer();
    },

    renderKana: function () {
      let html = '';
      for (let i = 0; i < this.kanaTokens.length; i++) {
        const tok = this.kanaTokens[i];
        if (i < this.idx1) {
          html += '<span class="done">' + escapeHtml(tok) + '</span>';
        } else if (this.shakyo) {
          // 写経は伏せない
          html += '<span class="rest">' + escapeHtml(tok) + '</span>';
        } else if (this.hintShown || i < this.revealCount) {
          html += '<span class="peek">' + escapeHtml(tok) + '</span>';
        } else {
          html += '<span class="rest">' + '○'.repeat(tok.length) + '</span>';
        }
      }
      $('answer-line').innerHTML = html;

      if (this.hintShown || this.shakyo) {
        let full = '', typed = 0;
        for (let i = 0; i < this.wordR.length; i++) full += this.wordR[i][this.pattern[i]];
        for (let i = 0; i < this.idx1; i++) typed += this.wordR[i][this.pattern[i]].length;
        typed += this.idx2;
        $('guide').innerHTML =
          '<span class="done">' + escapeHtml(full.slice(0, typed)) + '</span>' +
          escapeHtml(full.slice(typed));
      } else {
        $('guide').textContent = '';
      }
    },

    showHint: function () {
      this.hintShown = true;
      this.renderKana();
    },

    onPhase2Clear: function () {
      const w = this.words[this.index];
      this.locked = true;
      this.stopTimer();
      this.correct++;
      this.award();
      $('prompt').innerHTML = revealJa(w.exja);
      $('banner').textContent = '正解！';
      $('banner').className = 'banner ok';
      $('guide').textContent = '';
      this.renderHud();

      setTimeout(() => {
        if (!this.playing) return;
        this.next();
      }, PHASE2_DELAY);
    },

    next: function () {
      this.index++;
      if (this.index >= this.words.length) {
        this.finish();
        return;
      }
      this.showQuestion();
    },

    // ---- 得点 ----
    award: function () {
      const left = Math.max(0, TIME_LIMIT - (Date.now() - this.timerStartedAt));
      const ratio = left / TIME_LIMIT;
      const clean = !this.missedThisWord;

      let judge, mult;
      if (clean && ratio >= 2 / 3)      { judge = 'GREAT!'; mult = 2.0; this.judges.great++; }
      else if (clean && ratio >= 1 / 3) { judge = 'GOOD!';  mult = 1.5; this.judges.good++;  }
      else                              { judge = 'OK';     mult = 1.0; this.judges.okay++;  }

      this.combo++;
      if (this.combo > this.comboMax) this.comboMax = this.combo;
      const comboMult = 1 + Math.min(this.combo, COMBO_CAP) * COMBO_STEP;

      const gained = Math.round(BASE_POINTS * mult * comboMult);
      this.score += gained;

      const el = $('judge');
      el.className = 'judge ' + (mult === 2 ? 'great' : mult === 1.5 ? 'good' : 'okay');
      el.innerHTML = judge +
        '<span class="gain">+' + gained +
        (this.combo > 1 ? '　×' + comboMult.toFixed(2) : '') + '</span>';

      this.renderHud();
    },

    breakCombo: function () {
      this.combo = 0;
      this.renderHud();
    },

    countMiss: function (w) {
      this.miss++;
      this.breakCombo();
      if (!this.missedThisWord) {
        this.missedThisWord = true;
        if (!this.missedWords.some(x => x.ko === w.ko)) this.missedWords.push(w);
      }
      this.renderHud();
    },

    onMiss: function () {
      this.countMiss(this.words[this.index]);
      $('banner').textContent = '？';
      $('banner').className = 'banner ng';
    },

    renderHud: function () {
      $('hud-progress').textContent = (this.index + 1) + ' / ' + this.words.length;
      $('hud-score').textContent = this.score.toLocaleString();
      $('hud-miss').textContent = this.miss;
      $('hud-chain').textContent = this.combo;
      $('hud-chain-box').hidden = this.combo < 2;
    },

    // ---- 結果 ----
    finish: function () {
      this.playing = false;
      this.stopTimer();
      const sec = Math.round((Date.now() - this.startedAt) / 1000);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');

      $('result-subtitle').textContent = this.words.length + ' 問おわり';
      $('result-stats').innerHTML =
        '<div class="result-row total"><span>スコア</span><span>' + this.score.toLocaleString() + '</span></div>' +
        '<div class="result-row"><span>最大チェイン</span><span>' + this.comboMax + '</span></div>' +
        '<div class="result-row"><span>判定</span><span>GREAT ' + this.judges.great +
          '　GOOD ' + this.judges.good + '　OK ' + this.judges.okay + '</span></div>' +
        '<div class="result-row"><span>正解</span><span>' + this.correct + ' / ' + this.words.length + '</span></div>' +
        '<div class="result-row"><span>ミスタイプ</span><span>' + this.miss + '</span></div>' +
        '<div class="result-row"><span>かかった時間</span><span>' + mm + ':' + ss + '</span></div>';

      const review = $('review');
      if (this.missedWords.length) {
        $('review-list').innerHTML = this.missedWords
          .map(w => '<li><b>' + escapeHtml(headword(w)) +
                    '</b><span>' + escapeHtml(w.ja) + '</span></li>')
          .join('');
        review.hidden = false;
      } else {
        review.hidden = true;
      }

      this.showScreen('result');
    },

    // ---- 入力（両ステップともローマ字→かな）----
    handleKey: function (key) {
      if (!/^[a-z0-9\-,.\s]$/.test(key)) return;
      if (!this.wordR || this.idx1 >= this.wordR.length) return;

      this.temp += key;
      let ok = false;

      if (key === this.wordR[this.idx1][this.pattern[this.idx1]][this.idx2]) {
        ok = true;
      } else {
        // 別のローマ字表記（si / shi など）に切り替えられるか探す
        const re = new RegExp('^' + escapeRe(this.temp));
        for (let i = 0; i < this.wordR[this.idx1].length; i++) {
          if (re.test(this.wordR[this.idx1][i])) {
            this.pattern[this.idx1] = i;
            if (key === this.wordR[this.idx1][i][this.idx2]) ok = true;
            break;
          }
        }
      }

      if (!ok) {
        this.temp = this.temp.slice(0, -1);
        this.onMiss();
        return;
      }

      this.idx2++;
      if (this.idx2 === this.wordR[this.idx1][this.pattern[this.idx1]].length) {
        this.idx1++;
        this.idx2 = 0;
        this.temp = '';
      }
      this.renderKana();

      if (this.idx1 >= this.wordR.length) {
        if (this.phase === 1) this.onPhase1Clear(); else this.onPhase2Clear();
      }
    }
  };

  window.addEventListener('keydown', event => {
    if (event.isComposing || event.key === 'Process') return;
    if (!kobun.playing || kobun.locked) return;
    if (event.key.length !== 1) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    event.preventDefault();
    kobun.handleKey(event.key.toLowerCase());
  });

  window.kobun = kobun;
  window.addEventListener('load', () => { kobun.loadMeta(); });
}(window, document));
</script>
