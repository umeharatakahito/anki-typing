<style>
  /* 早押し：まだ見えていない問題文は場所だけ取っておく（文字が出ても行がずれない） */
  .hy-rest{ color:transparent; }
  /* 絵の問題：寄りから少しずつ引いていく。枠は絵とちょうど同じ大きさにして、はみ出しを切る */
  .hy-box{ position:relative; overflow:hidden; flex:none; background:#fff; border:1px solid var(--line); border-radius:8px; }
  .hy-box > img.card-image{ width:100%; height:100%; padding:0; border:0; border-radius:0; object-fit:fill; }
  /* 難読漢字：漢字を絵のように大きく */
  .hy-kanji{ display:flex; align-items:center; justify-content:center; width:100%; height:100%; color:#1d2b53; font-weight:700; line-height:1;
    white-space:nowrap; font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif; }
  html[data-theme="dark"] .hy-box{ border-color:transparent; }
</style>
<script>
// ===============================================================
// Hayaoshi.html
// 早押しの見せ方。アプリの mobile/www/js/hayaoshi.js と同じ決まり。
//   ・問題文は 1 文字ずつ出す（1 秒に HY_CPS 文字。長い文も持ち時間の 6 割までに出しきる）
//   ・絵で答える問題（国旗・地図・写真など。IT の図のような補いの絵は入れない）は、絵の一部を大きく見せたところから
//     少しずつ引いて、持ち時間の残り 4 割で全体が見えるようにする。地図は答え（オレンジ色）を真ん中にして寄る
//   ・難読漢字は漢字を絵のように大きく出す（寄らない。問題文からは漢字を外す）。これはいつも
// 対戦（先取・サバイバル）はいつも早押し＋拡大。1 人で遊ぶときはプレイ設定のチェック（localStorage 'st_hayaoshi'）で選ぶ。
// 対戦のタイムアタックは 1 人用と同じ時間の決まりなので、何もしない。
// 動画は作らず、CSS の transform を毎コマ書き換えるだけ（データは増えない）
// ===============================================================
(function (window, document) {
  const h = window.hamachi;
  const HY_PIC = /^(flag-country|map-|zk-|heritage$|castle$|constellation$)/;
  const HY_KANJI = /^nandoku/;
  const HY_FULL = 0.6;   // 持ち時間のこの割合で全部見える（残り 4 割）
  const HY_CPS = 8;      // 問題文は 1 秒にこの文字数（長い文は HY_FULL までに出しきる）
  let hy = null;         // 今の問題の動き
  // 最初に何倍に寄るか。思いきり寄って、何の絵か分からないところから始める
  const hyZoom = kbn => kbn === 'map-world-country' ? 6 : /^map-/.test(kbn) ? 10 : kbn === 'flag-country' ? 8 : 10;

  // 1 人のときの設定 { text: 早押し, zoom: 拡大 }
  const KEY = 'st_hayaoshi';
  function prefs() {
    try { return Object.assign({ text: false, zoom: false }, JSON.parse(localStorage.getItem(KEY) || '{}')); }
    catch (e) { return { text: false, zoom: false }; }
  }
  function setPrefs(p) { try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) { /* 残せなくても遊べる */ } }

  // 問題文の文字を、見えている分と、まだの分（透明）に分ける。戻り値の set(k) で k 文字まで見せる
  function textParts(el) {
    const parts = [], nodes = [], walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    while (walk.nextNode()) nodes.push(walk.currentNode);
    for (const n of nodes) {
      const chars = Array.from(n.data);
      if (!chars.length) continue;
      const rest = document.createElement('span');
      rest.className = 'hy-rest';
      n.parentNode.insertBefore(rest, n.nextSibling);
      parts.push({ n, rest, chars });
    }
    const total = parts.reduce((a, p) => a + p.chars.length, 0);
    let shown = -1;
    const set = k => {
      k = Math.max(0, Math.min(total, k));
      if (k === shown) return;
      shown = k;
      let left = k;
      for (const p of parts) {
        const v = Math.min(p.chars.length, left);
        left -= v;
        p.n.data = p.chars.slice(0, v).join('');
        p.rest.textContent = p.chars.slice(v).join('');
      }
    };
    return { total, set };
  }

  // 地図の答え（オレンジ #ff6b35）の場所。小さく描いて色を探す。見つからなければ null
  function orangeAt(img) {
    try {
      const W = 160, H = Math.max(1, Math.round(W * img.naturalHeight / img.naturalWidth)) || 120;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0, W, H);
      const d = x.getImageData(0, 0, W, H).data;
      let sx = 0, sy = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i] > 225 && d[i + 1] > 80 && d[i + 1] < 140 && d[i + 2] > 20 && d[i + 2] < 90) {
          const p = i / 4;
          sx += p % W; sy += Math.floor(p / W); n++;
        }
      }
      return n ? [sx / n / W, sy / n / H] : null;
    } catch (e) { return null; }   // 別のドメインの絵は読めない
  }

  function stop(full) {
    if (!hy) return;
    cancelAnimationFrame(hy.raf);
    if (hy.ro) hy.ro.disconnect();
    if (full && hy.text) hy.text.set(hy.text.total);
    if (full && hy.zoom && hy.z0 > 1) hy.zoom.style.transform = '';
    hy = null;
  }

  // cardEl は問題の枠、ms は 1 問の持ち時間。opt.text 早押し / opt.zoom 拡大
  function start(cardEl, card, ms, opt) {
    stop(true);
    const helper = cardEl.querySelector('.helper');
    const holder = cardEl.querySelector('.card-image-container');
    const kbn = String(card.kbn || h.kubun || '');
    const now0 = performance.now();
    const s = hy = { raf: 0, t0: now0, last: now0, full: Math.max(1500, (ms || 20000) * HY_FULL), text: null, zoom: null, ro: null,
      z0: 1 };

    // 難読漢字：問題文の「漢字」を絵にして、文からは外す
    let kanji = '';
    if (HY_KANJI.test(kbn) && helper && holder) {
      const m = String(card.que || '').match(/「([^」]+)」/);
      kanji = m ? m[1] : String(card.kan || '');
      if (m) helper.innerHTML = helper.innerHTML.replace(/「[^」]+」/, 'この漢字');
    }
    if (opt.text && helper) s.text = textParts(helper);

    const box = document.createElement('div');
    box.className = 'hy-box';
    const img = holder && holder.querySelector('img.card-image');
    const begin = () => {
      if (hy !== s) return;
      // 枠を絵の縦横比にして、入れ物いっぱいに
      const fit = () => {
        const cw = holder.clientWidth, ch = holder.clientHeight;
        if (!cw || !ch) return;
        if (kanji) {
          const n = Array.from(kanji).length;
          const size = Math.min(ch * 0.78, cw * 0.92 / n);
          box.style.width = Math.round(Math.min(cw, Math.max(ch * 1.2, size * n * 1.25))) + 'px';
          box.style.height = ch + 'px';
          s.zoom.style.fontSize = Math.round(size) + 'px';
          return;
        }
        const nw = img.naturalWidth || 4, nh = img.naturalHeight || 3;
        const k = Math.min(cw / nw, ch / nh);
        box.style.width = Math.round(nw * k) + 'px';
        box.style.height = Math.round(nh * k) + 'px';
      };
      fit();
      if (window.ResizeObserver) { s.ro = new ResizeObserver(fit); s.ro.observe(holder); }
      if (s.z0 <= 1) return;
      let focus = null;
      if (kbn === 'map-world-country') focus = [0.5, 0.5];   // 世界地図はいつも国が真ん中に描いてある
      else if (/^map-/.test(kbn)) focus = orangeAt(img);
      if (!focus) focus = /^map-/.test(kbn) ? [0.5, 0.5] : [0.15 + Math.random() * 0.7, 0.2 + Math.random() * 0.6];
      s.zoom.style.transformOrigin = (focus[0] * 100).toFixed(1) + '% ' + (focus[1] * 100).toFixed(1) + '%';
    };
    if (kanji) {
      s.zoom = document.createElement('div');
      s.zoom.className = 'hy-kanji';
      s.zoom.textContent = kanji;
      box.appendChild(s.zoom);
      holder.innerHTML = '';
      holder.appendChild(box);
      begin();
    } else if (opt.zoom && img && HY_PIC.test(kbn)) {
      s.zoom = img;
      s.z0 = hyZoom(kbn);
      holder.insertBefore(box, img);
      box.appendChild(img);
      img.style.transform = 'scale(' + s.z0 + ')';   // 絵が来るまでに全体が見えてしまわないよう
      if (img.complete && img.naturalWidth) begin(); else img.addEventListener('load', begin, { once: true });
    }

    const textMs = () => s.text ? Math.min(s.full, s.text.total / HY_CPS * 1000) : 0;
    const tick = now => {
      if (hy !== s) return;
      if (h.paused) s.t0 += now - s.last;   // 一時停止の間は進めない
      s.last = now;
      const t = now - s.t0;
      if (s.text) s.text.set(Math.ceil(s.text.total * Math.min(1, t / textMs())));
      if (s.zoom && s.z0 > 1) {
        const p = Math.min(1, t / s.full), e = p * p * (3 - 2 * p);
        s.zoom.style.transform = p >= 1 ? '' : 'scale(' + Math.pow(s.z0, 1 - e).toFixed(4) + ')';
      }
      if (t >= textMs() && (s.z0 <= 1 || t >= s.full)) return;   // 動きは終わり（大きさ合わせは次の問題まで）
      s.raf = requestAnimationFrame(tick);
    };
    s.raf = requestAnimationFrame(tick);
  }

  window.stHayaoshi = { start, stop, prefs, setPrefs };

  // 1 人用の nextCard のあとに、早押しの見せ方をかぶせる
  const baseNext = h.nextCard;
  h.nextCard = function () {
    const before = this.cache && this.cache.questionCard && this.cache.questionCard.firstChild;
    const ret = baseNext.apply(this, arguments);
    const el = this.cache && this.cache.questionCard;
    // 新しい問題が出たときだけ（終わり・待ちで何も出さなかったときは何もしない）
    if (!this.playing || !el || !el.firstChild || el.firstChild === before || !this.currentCard) return ret;
    if (this.vsTA) { stop(false); return ret; }
    if (this.versusMode && window.stSound) window.stSound.jajan();   // 対戦の出題は「ジャ・ジャーン」
    const opt = this.versusMode ? { text: true, zoom: true } : prefs();
    start(el, this.currentCard, this.kihon_time, opt);
    return ret;
  };

  // 打ち終えたら（時間切れも）、問題文も絵も全部見せる
  const baseAfter = h.afterCard;
  h.afterCard = function () {
    stop(true);
    if (baseAfter) return baseAfter.apply(this, arguments);
  };
  const baseReset = h.resetGame;
  h.resetGame = function () { stop(false); return baseReset.apply(this, arguments); };
}(window, document));
</script>
