<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <title>対戦モード</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <?!= include('JukenVersusCSS'); ?>
  </head>

  <body data-subject="<?= subject ?>" data-prefs="versus-<?= subject ?>">
    <div id="app">

      <!-- ========== メニュー ========== -->
      <section id="vs-menu" class="screen">
        <a class="back-link" href="<?= execUrl ?>?p=<?= backRoute ?>">← もどる</a>
        <h1 class="title">対戦モード</h1>
        <p class="subtitle"><?= subjectLabel ?> ・ TYPING BATTLE</p>

        <div class="card">
          <h2><span class="tag">つくる</span>対戦を用意する</h2>
          <div class="row">
            <label for="vs-host-name">なまえ</label>
            <input type="text" id="vs-host-name" class="w-name" maxlength="12" placeholder="あなた">
          </div>
          <div class="row">
            <label for="vs-win-mode">勝利条件</label>
            <select id="vs-win-mode">
              <option value="first5" selected>5問先取</option>
              <option value="first10">10問先取</option>
              <option value="count">問題数を決めてやり切る</option>
            </select>
            <input type="number" id="vs-count" class="w-num" min="3" max="60" value="10" hidden>
            <span id="vs-count-unit" class="tilde" hidden>問</span>
          </div>
          <div class="row">
            <label for="vs-from">見出し語番号</label>
            <input type="number" id="vs-from" class="w-num" min="1" step="1" placeholder="最初">
            <span class="tilde">〜</span>
            <input type="number" id="vs-to" class="w-num" min="1" step="1" placeholder="最後">
          </div>
          <div class="row">
            <label for="vs-example">例文</label>
            <select id="vs-example">
              <option value="off" selected>なし</option>
              <option value="on">あり（2段階）</option>
            </select>
          </div>
          <div class="row">
            <label class="check" for="vs-shakyo">
              <input type="checkbox" id="vs-shakyo">写経モード（答えを最初から見せて、早打ち勝負）
            </label>
          </div>
          <p class="hint" id="vs-range-hint">読み込み中…</p>
          <div class="row" style="margin-top:14px;">
            <button class="btn btn-main" id="vs-create-btn">対戦をつくる</button>
          </div>
        </div>

        <div class="card">
          <h2><span class="tag">さんか</span>合言葉で参加する</h2>
          <div class="row">
            <label for="vs-guest-name">なまえ</label>
            <input type="text" id="vs-guest-name" class="w-name" maxlength="12" placeholder="あいて">
          </div>
          <div class="row">
            <label for="vs-code">4桁の番号</label>
            <input type="tel" id="vs-code" class="code-input" maxlength="4" inputmode="numeric"
                   pattern="[0-9]*" placeholder="0000" autocomplete="off">
          </div>
          <div class="row" style="margin-top:10px;">
            <button class="btn btn-main" id="vs-join-btn">対戦に参加する</button>
          </div>
        </div>

        <p class="hint err" id="vs-menu-error"></p>
        <p class="note">同じ問題が同じ順番で出ます。先に正解したほうが得点です。<br>
          設定は対戦をつくった人のものが、そのまま相手にも出ます。</p>
      </section>

      <!-- ========== 待合室 ========== -->
      <section id="vs-lobby" class="screen" hidden>
        <h1 class="title">あいてを待っています</h1>
        <p class="subtitle">この番号を相手に伝えてください</p>

        <div class="code-box">
          <div class="code-label">あいことば</div>
          <div class="code-value" id="vs-lobby-code">----</div>
        </div>

        <p class="rule-summary" id="vs-lobby-rule"></p>

        <div class="lobby-players">
          <div class="lobby-player me" id="vs-lobby-me"><small>あなた</small><span>-</span></div>
          <div class="lobby-player you empty" id="vs-lobby-you"><small>あいて</small><span>まだ来ていません</span></div>
        </div>

        <div class="lobby-actions">
          <button class="btn btn-sub" id="vs-lobby-cancel">やめる</button>
        </div>
        <p class="hint err" id="vs-lobby-error" style="text-align:center;"></p>
      </section>

      <!-- ========== 対戦中 ========== -->
      <section id="vs-game" class="screen" hidden>
        <div class="boards">
          <div class="board me">
            <div class="board-head">
              <span class="board-side">YOU</span>
              <span class="board-name" id="vs-me-name">あなた</span>
              <span class="dot" id="vs-me-dot"></span>
            </div>
            <div class="board-score" id="vs-me-score">0</div>
            <div class="board-meta" id="vs-me-meta">1問目 ・ STEP 1</div>
            <div class="board-pips" id="vs-me-pips"></div>
          </div>
          <div class="board you">
            <div class="board-head">
              <span class="board-side">RIVAL</span>
              <span class="board-name" id="vs-you-name">あいて</span>
              <span class="dot" id="vs-you-dot"></span>
            </div>
            <div class="board-score" id="vs-you-score">0</div>
            <div class="board-meta" id="vs-you-meta">1問目 ・ STEP 1</div>
            <div class="board-pips" id="vs-you-pips"></div>
          </div>
        </div>

        <div class="round-head">
          <span id="vs-round-label">第 1 問</span>
          <span id="vs-rule-label"></span>
          <button class="btn btn-quit" id="vs-quit-btn">やめる</button>
        </div>

        <div class="timer"><div class="timer-bar" id="vs-timer-bar"></div></div>

        <div class="stage">
          <div class="phase-tag" id="vs-phase-tag">STEP 1</div>
          <div class="prompt" id="vs-prompt"></div>
          <div class="sub-prompt" id="vs-sub-prompt"></div>
          <div class="answer-line" id="vs-answer-line"></div>
          <div class="guide" id="vs-guide"></div>
          <div class="stage-actions">
            <button class="btn btn-sub" id="vs-speak-btn" hidden>🔊 もう一度聞く</button>
            <button class="btn btn-sub" id="vs-hint-btn" hidden>ヒント</button>
          </div>
        </div>

        <div class="banner" id="vs-banner"></div>
      </section>

      <!-- ========== 結果 ========== -->
      <section id="vs-result" class="screen" hidden>
        <div class="verdict" id="vs-verdict">-</div>
        <p class="subtitle" id="vs-result-note"></p>

        <div class="final-score">
          <span class="me" id="vs-final-me">0</span>
          <span class="sep">-</span>
          <span class="you" id="vs-final-you">0</span>
        </div>
        <div class="final-names">
          <span id="vs-final-me-name">あなた</span>
          <span>vs</span>
          <span id="vs-final-you-name">あいて</span>
        </div>

        <div class="review" id="vs-review" hidden>
          <h3>取り逃した単語</h3>
          <ul id="vs-review-list"></ul>
        </div>

        <div class="result-actions">
          <button class="btn btn-main" style="max-width:260px;" id="vs-again-btn">メニューに戻る</button>
        </div>
      </section>

      <div class="countdown" id="vs-countdown" hidden>3</div>
    </div>

    <?!= include('RomajiLib'); ?>
    <?!= include('JukenVersusJS'); ?>
    <?!= include('JukenKeyboard'); ?>
    <?!= include('JukenPrefs'); ?>
  </body>
</html>
