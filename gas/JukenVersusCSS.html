<style>
  :root {
    --bg: #0f1724;
    --card: #182236;
    --line: #2a3651;
    --text: #e8eef7;
    --muted: #93a3bd;
    --accent: #3bc9db;
    --ok: #34d399;
    --ng: #f87171;
    --me: #f8717a;          /* 自分＝赤 */
    --me-soft: rgba(248, 113, 122, .14);
    --you: #60a5fa;         /* 相手＝青 */
    --you-soft: rgba(96, 165, 250, .14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    min-height: 100%;
  }

  #app {
    max-width: 920px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  /* .btn 等のクラス指定に負けないよう hidden は強く効かせる */
  [hidden] { display: none !important; }

  .title {
    margin: 26px 0 4px;
    font-size: 2rem;
    letter-spacing: .08em;
    text-align: center;
  }
  .subtitle {
    margin: 0 0 26px;
    text-align: center;
    color: var(--muted);
    font-size: .95rem;
    letter-spacing: .12em;
  }

  /* ---- ボタン ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px 22px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
    transition: border-color .15s, transform .08s, opacity .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn-main {
    width: 100%;
    padding: 17px 22px;
    font-size: 1.1rem;
    border-color: var(--accent);
    background: rgba(59, 201, 219, .12);
  }
  .btn-sub { padding: 9px 16px; font-size: .88rem; }
  .btn-quit { margin-left: auto; padding: 7px 14px; font-size: .82rem; }

  /* ---- カード ---- */
  .card {
    margin-top: 16px;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 1.05rem;
    letter-spacing: .06em;
  }
  .card h2 .tag {
    display: inline-block;
    margin-right: 10px;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(59, 201, 219, .14);
    color: var(--accent);
    font-size: .72rem;
    letter-spacing: .1em;
    vertical-align: 2px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .row:last-child { margin-bottom: 0; }
  .row label {
    color: var(--muted);
    font-size: .85rem;
    letter-spacing: .06em;
    min-width: 6.5em;
  }
  .row .tilde { color: var(--muted); }

  input, select {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #101a2b;
    color: var(--text);
    font-family: inherit;
    font-size: .95rem;
    min-width: 0;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .w-num { width: 6.2em; }
  .w-name { flex: 1 1 8em; }

  .code-input {
    flex: 1 1 6em;
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 1.7rem;
    letter-spacing: .35em;
    text-align: center;
    padding: 10px 6px;
  }

  .hint { margin: 10px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.6; }
  .hint.err { color: var(--ng); }
  .note { margin-top: 22px; text-align: center; color: var(--muted); font-size: .85rem; }

  /* ---- 待合室 ---- */
  .code-box {
    margin: 10px auto 6px;
    padding: 22px 16px;
    max-width: 380px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 14px;
  }
  .code-box .code-label { color: var(--muted); font-size: .8rem; letter-spacing: .14em; }
  .code-box .code-value {
    margin: 8px 0 4px;
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 3.4rem;
    letter-spacing: .28em;
    color: var(--accent);
    text-indent: .28em;
  }

  .lobby-players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 480px;
    margin: 18px auto 0;
  }
  .lobby-player {
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: .95rem;
  }
  .lobby-player.me { border-color: var(--me); background: var(--me-soft); }
  .lobby-player.you { border-color: var(--you); background: var(--you-soft); }
  .lobby-player.empty { color: var(--muted); border-style: dashed; }
  .lobby-player small { display: block; margin-bottom: 6px; color: var(--muted); font-size: .72rem; letter-spacing: .12em; }

  .rule-summary { margin: 16px 0 0; text-align: center; color: var(--muted); font-size: .88rem; }

  .lobby-actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ---- 対戦中：スコアボード（左=赤/自分, 右=青/相手）---- */
  .boards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .board {
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    min-width: 0;
  }
  .board.me  { border-color: var(--me);  background: linear-gradient(180deg, var(--me-soft), transparent 70%); }
  .board.you { border-color: var(--you); background: linear-gradient(180deg, var(--you-soft), transparent 70%); }

  .board-head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .board-side { font-size: .68rem; letter-spacing: .14em; padding: 2px 7px; border-radius: 999px; }
  .board.me  .board-side { color: var(--me);  background: var(--me-soft); }
  .board.you .board-side { color: var(--you); background: var(--you-soft); }
  .board-name {
    font-size: .92rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dot {
    margin-left: auto;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ok);
    flex: none;
  }
  .dot.off { background: #4b5870; }

  .board-score {
    font-size: 2.6rem;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .board.me  .board-score { color: var(--me); }
  .board.you .board-score { color: var(--you); }
  .board-meta { margin-top: 4px; color: var(--muted); font-size: .76rem; letter-spacing: .04em; }
  .board-pips { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .pip { width: 12px; height: 6px; border-radius: 3px; background: #223049; }
  .board.me  .pip.on { background: var(--me); }
  .board.you .pip.on { background: var(--you); }

  /* ---- 対戦中：出題 ---- */
  .round-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 2px 10px;
    border-bottom: 1px solid var(--line);
    font-size: .85rem;
    color: var(--muted);
    letter-spacing: .08em;
  }

  .timer { height: 6px; margin-top: 12px; border-radius: 3px; background: #1d2942; overflow: hidden; }
  .timer-bar { height: 100%; width: 100%; background: var(--accent); transition: width .1s linear, background-color .3s; }
  .timer-bar.warn { background: #fbbf24; }
  .timer-bar.danger { background: var(--ng); }

  .stage { padding: 26px 0 16px; text-align: center; }

  .phase-tag {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 999px;
    background: rgba(59, 201, 219, .12);
    color: var(--accent);
    font-size: .78rem;
    letter-spacing: .12em;
  }

  .prompt { margin: 22px 0 8px; font-size: 1.85rem; line-height: 1.5; word-break: break-word; }
  .prompt .blank { color: var(--accent); border-bottom: 3px solid var(--accent); padding: 0 .4em; }
  .prompt .filled { color: var(--ok); border-bottom: 3px solid var(--ok); padding: 0 .2em; }

  /* 第2問で文脈として添える英文 */
  .context-en {
    display: block;
    margin-bottom: 6px;
    color: #7f8fab;
    font-size: 1rem;
  }

  .sub-prompt { color: var(--muted); font-size: .95rem; min-height: 1.4em; }

  .answer-line {
    margin: 26px 0 10px;
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 2rem;
    letter-spacing: .12em;
    word-break: break-all;
    min-height: 1.3em;
  }
  .answer-line .done { color: var(--ok); }
  .answer-line .rest { color: #46536e; }
  .answer-line .reveal { color: var(--ng); }

  .guide {
    color: var(--muted);
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 1.02rem;
    letter-spacing: .08em;
    min-height: 1.5em;
    word-break: break-all;
  }
  .guide .done { color: var(--accent); }

  .stage-actions { margin-top: 22px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .banner { margin-top: 14px; text-align: center; font-size: 1.12rem; min-height: 2.6em; line-height: 1.5; }
  .banner.ok   { color: var(--ok); }
  .banner.ng   { color: var(--ng); }
  .banner.win  { color: var(--me); font-weight: 700; }
  .banner.lose { color: var(--you); }
  .banner.wait { color: var(--muted); }

  .countdown {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(15, 23, 36, .92);
    font-size: 5rem;
    letter-spacing: .1em;
    color: var(--accent);
    z-index: 50;
  }
  .countdown[hidden] { display: none; }

  /* ---- 結果 ---- */
  .verdict { text-align: center; font-size: 2.6rem; letter-spacing: .12em; margin: 26px 0 6px; }
  .verdict.win  { color: var(--me); }
  .verdict.lose { color: var(--you); }
  .verdict.draw { color: var(--accent); }

  .final-score {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 18px 0 8px;
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 3rem;
    font-variant-numeric: tabular-nums;
  }
  .final-score .me  { color: var(--me); }
  .final-score .you { color: var(--you); }
  .final-score .sep { color: var(--muted); font-size: 1.6rem; }
  .final-names { display: flex; justify-content: center; gap: 18px; color: var(--muted); font-size: .85rem; }

  .review { max-width: 560px; margin: 26px auto; text-align: left; }
  .review h3 { font-size: .9rem; color: var(--muted); letter-spacing: .1em; margin: 0 0 10px; }
  .review ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .review li {
    display: flex;
    gap: 12px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: .92rem;
  }
  .review li b { color: var(--accent); font-weight: 600; min-width: 8.5em; }
  .review li .who { margin-left: auto; font-size: .76rem; color: var(--muted); }

  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  @media (max-width: 620px) {
    #app { padding: 14px 12px 40px; }
    .title { font-size: 1.55rem; }
    .prompt { font-size: 1.35rem; }
    .answer-line { font-size: 1.45rem; }
    .code-box .code-value { font-size: 2.6rem; }
    .board { padding: 9px 10px; border-radius: 10px; }
    .board-score { font-size: 1.9rem; }
    .board-name { font-size: .82rem; }
    .board-meta { font-size: .68rem; }
    .board-side { font-size: .6rem; padding: 2px 5px; }
    .pip { width: 9px; }
    .row label { min-width: 5.2em; font-size: .8rem; }
    .verdict { font-size: 2rem; }
    .final-score { font-size: 2.3rem; }
    .stage { padding: 18px 0 10px; }
  }

  /* 画面の左上に置く戻り導線 */
  .back-link {
    display: inline-block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: .85rem;
    text-decoration: none;
  }
  .back-link:hover { color: var(--accent); }
</style>
