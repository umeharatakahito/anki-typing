<script>
(function (window, document) {
  'use strict';

  const PHASE1_DELAY = 1300;  // 英単語正解 → 例文へ
  const PHASE2_DELAY = 2000;  // 意味正解 → 次の単語へ
  const TIME_LIMIT   = 20000; // 1問あたりの制限時間
  const REVEAL_DELAY = 2600;  // 時間切れで答えを見せる時間

  const $ = id => document.getElementById(id);

  const escapeHtml = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // 第2問は和訳側を空欄にする。データの exja は答えにあたる箇所を【】で
  // 囲んであるので、そこを空欄に差し替える。
  function blankJa(exja) {
    return escapeHtml(exja).replace(/【[^】]*】/, '<span class="blank">　　　　　</span>');
  }

  function revealJa(exja) {
    return escapeHtml(exja).replace(/【([^】]*)】/, '<span class="filled">$1</span>');
  }

  const juken = {
    meta: null,
    words: [],
    matched: 0,
    index: 0,
    phase: 1,
    correct: 0,
    miss: 0,
    playing: false,
    locked: false,
    timerId: null,
    startedAt: 0,
    missedWords: [],
    missedThisWord: false,

    // STEP1: 英字直接入力
    enTarget: '',
    enPos: 0,

    // STEP2: かな（ローマ字入力）
    kanaTokens: [],
    wordR: null,
    pattern: [],
    idx1: 0,
    idx2: 0,
    temp: '',
    hintShown: false,

    // ---- 画面切替 ----
    showScreen: function (name) {
      ['menu', 'game', 'result'].forEach(s => {
        const el = $('screen-' + s);
        if (el) el.hidden = (s !== name);
      });
    },

    toMenu: function () {
      this.playing = false;
      this.showScreen('menu');
    },

    quit: function () {
      this.playing = false;
      this.stopTimer();
      window.speechSynthesis && window.speechSynthesis.cancel();
      this.toMenu();
    },

    // ---- 音声合成 ----
    // 端末の既定voiceは機械的で聞き取りづらいものが当たることがあるため、
    // 自然な英語voiceを優先して選ぶ。voice一覧は非同期に埋まるので都度取り直す。
    voice: null,

    pickVoice: function () {
      if (!window.speechSynthesis) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;

      const preferred = [
        'Google US English', 'Samantha', 'Ava', 'Allison', 'Microsoft Aria',
        'Microsoft Jenny', 'Microsoft Zira', 'Karen', 'Moira', 'Daniel'
      ];
      for (const name of preferred) {
        const v = voices.find(x => x.name.indexOf(name) === 0 && /^en/i.test(x.lang));
        if (v) return v;
      }
      // 名前で見つからなければ en-US の非ローカル（クラウド合成＝高品質）を優先
      return voices.find(v => v.lang === 'en-US' && !v.localService)
          || voices.find(v => v.lang === 'en-US')
          || voices.find(v => /^en/i.test(v.lang))
          || null;
    },

    speak: function (text, rate) {
      if (!window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        if (!this.voice) this.voice = this.pickVoice();
        const u = new SpeechSynthesisUtterance(text);
        if (this.voice) u.voice = this.voice;
        u.lang = (this.voice && this.voice.lang) || 'en-US';
        u.rate = rate || 1.0;
        u.pitch = 1.05;
        u.volume = 1;
        window.speechSynthesis.speak(u);
      } catch (e) {
        // 音声非対応の環境では読み上げなしで続行する
      }
    },

    replay: function () {
      const w = this.words[this.index];
      if (!w) return;
      this.speak(this.phase === 1 ? w.en : w.ex);
    },

    // ---- 制限時間 ----
    // 答えが出ないまま固まらないよう、時間切れで答えを見せて次に進む。
    startTimer: function () {
      this.stopTimer();
      const bar = $('timer-bar');
      const started = Date.now();

      bar.className = 'timer-bar';
      bar.style.width = '100%';

      this.timerId = setInterval(() => {
        const left = Math.max(0, TIME_LIMIT - (Date.now() - started));
        const pct = (left / TIME_LIMIT) * 100;
        bar.style.width = pct + '%';
        bar.className = 'timer-bar' + (pct < 20 ? ' danger' : pct < 50 ? ' warn' : '');
        if (left <= 0) {
          this.stopTimer();
          this.onTimeout();
        }
      }, 100);
    },

    stopTimer: function () {
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
    },

    onTimeout: function () {
      if (!this.playing || this.locked) return;
      const w = this.words[this.index];
      this.locked = true;
      this.countMiss(w);

      if (this.phase === 1) {
        $('answer-line').innerHTML = '<span class="reveal">' + escapeHtml(w.en) + '</span>';
        $('banner').textContent = '時間切れ — 答えは「' + w.en + '」';
        $('banner').className = 'banner ng';
        this.speak(w.en);
        setTimeout(() => { if (this.playing) this.toPhase2(); }, REVEAL_DELAY);
      } else {
        this.hintShown = true;
        this.renderKana();
        $('prompt').innerHTML = revealJa(w.exja);
        $('answer-line').innerHTML = '<span class="reveal">' + escapeHtml(w.kana) + '</span>';
        $('banner').textContent = '時間切れ';
        $('banner').className = 'banner ng';
        setTimeout(() => { if (this.playing) this.next(); }, REVEAL_DELAY);
      }
    },

    // ---- 収録範囲をメニューに表示 ----
    loadMeta: function () {
      google.script.run
        .withSuccessHandler(meta => {
          this.meta = meta;
          ['no-from', 'no-to'].forEach(id => {
            $(id).min = meta.minNo;
            $(id).max = meta.maxNo;
          });
          $('range-hint').textContent =
            '収録: 単語' + meta.words + ' ＋ 熟語' + meta.idioms +
            '（見出し語番号 ' + meta.minNo + '〜' + meta.maxNo +
            '）　空欄なら全範囲から出題します';
        })
        .withFailureHandler(() => {
          $('range-hint').textContent = '収録範囲を取得できませんでした';
        })
        .getJukenMeta();
    },

    // ---- 開始 ----
    start: function () {
      const opts = {
        from: $('no-from').value,
        to: $('no-to').value,
        limit: $('round-size').value,
        shuffle: $('order-mode').value === 'shuffle',
        kind: $('kind-mode').value
      };

      this.showScreen('game');
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('prompt').textContent = '読み込み中…';
      $('sub-prompt').textContent = '';
      $('answer-line').textContent = '';
      $('guide').textContent = '';

      google.script.run
        .withSuccessHandler(res => {
          if (!res || res.error || !res.words || !res.words.length) {
            $('prompt').textContent = '出題できる単語がありません';
            $('sub-prompt').textContent = res && res.error ? res.error : 'ページ範囲を見直してください';
            return;
          }
          this.words = res.words;
          this.matched = res.matched;
          this.index = 0;
          this.correct = 0;
          this.miss = 0;
          this.missedWords = [];
          this.startedAt = Date.now();
          this.playing = true;
          this.showQuestion();
        })
        .withFailureHandler(err => {
          $('prompt').textContent = 'サーバーとの通信に失敗しました';
          $('sub-prompt').textContent = err && err.message ? err.message : '';
        })
        .getJukenWords(opts);
    },

    // ---- STEP1: 日本語 → 英単語 ----
    showQuestion: function () {
      const w = this.words[this.index];
      this.phase = 1;
      this.locked = false;
      this.missedThisWord = false;
      this.enTarget = w.en.toLowerCase();
      this.enPos = 0;

      const isIdiom = w.type === 'idiom';
      $('phase-tag').textContent = 'STEP 1 ・ ' + (isIdiom ? '熟語' : '英単語') + 'をタイプ';
      $('prompt').textContent = w.ja;
      $('sub-prompt').textContent = 'この意味の' + (isIdiom ? '熟語' : '英単語') + 'は？';
      $('guide').textContent = '';
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('speak-btn').hidden = true;
      $('hint-btn').hidden = true;

      this.renderEn();
      this.renderHud();
      this.startTimer();
    },

    renderEn: function () {
      const done = this.enTarget.slice(0, this.enPos);
      const rest = this.enTarget.slice(this.enPos).replace(/[a-z0-9']/g, '_');
      $('answer-line').innerHTML =
        '<span class="done">' + escapeHtml(done) + '</span>' +
        '<span class="rest">' + escapeHtml(rest) + '</span>';
    },

    onPhase1Clear: function () {
      const w = this.words[this.index];
      this.locked = true;
      this.stopTimer();
      this.speak(w.en);
      $('answer-line').innerHTML = '<span class="done">' + escapeHtml(w.en) + '</span>';
      $('banner').textContent = '正解！';
      $('banner').className = 'banner ok';

      setTimeout(() => {
        if (!this.playing) return;
        this.toPhase2();
      }, PHASE1_DELAY);
    },

    // ---- STEP2: 例文の空欄 → 意味をタイプ ----
    toPhase2: function () {
      const w = this.words[this.index];
      this.phase = 2;
      this.locked = false;
      this.hintShown = false;

      const conv = kanaToRoman(w.kana);
      this.wordR = conv[0];
      this.kanaTokens = conv[1];
      this.pattern = new Array(this.wordR.length).fill(0);
      this.idx1 = 0;
      this.idx2 = 0;
      this.temp = '';

      $('phase-tag').textContent = 'STEP 2 ・ 意味をタイプ';
      $('prompt').innerHTML = blankJa(w.exja);
      $('sub-prompt').innerHTML =
        '<span class="context-en">' + escapeHtml(w.ex) + '</span>空欄に入る日本語は？';
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('guide').textContent = '';
      $('speak-btn').hidden = false;
      $('hint-btn').hidden = false;

      this.speak(w.ex, 0.95);
      this.renderKana();
      this.startTimer();
    },

    renderKana: function () {
      let html = '';
      for (let i = 0; i < this.kanaTokens.length; i++) {
        const tok = this.kanaTokens[i];
        if (i < this.idx1) {
          html += '<span class="done">' + escapeHtml(tok) + '</span>';
        } else if (this.hintShown) {
          html += '<span class="rest">' + escapeHtml(tok) + '</span>';
        } else {
          html += '<span class="rest">' + '○'.repeat(tok.length) + '</span>';
        }
      }
      $('answer-line').innerHTML = html;

      if (this.hintShown) {
        let full = '', typed = 0;
        for (let i = 0; i < this.wordR.length; i++) full += this.wordR[i][this.pattern[i]];
        for (let i = 0; i < this.idx1; i++) typed += this.wordR[i][this.pattern[i]].length;
        typed += this.idx2;
        $('guide').innerHTML =
          '<span class="done">' + escapeHtml(full.slice(0, typed)) + '</span>' +
          escapeHtml(full.slice(typed));
      }
    },

    showHint: function () {
      if (this.phase !== 2) return;
      this.hintShown = true;
      this.renderKana();
    },

    onPhase2Clear: function () {
      const w = this.words[this.index];
      this.locked = true;
      this.stopTimer();
      this.correct++;
      $('prompt').innerHTML = revealJa(w.exja);
      $('banner').textContent = '正解！';
      $('banner').className = 'banner ok';
      $('guide').textContent = '';
      this.renderHud();

      setTimeout(() => {
        if (!this.playing) return;
        this.next();
      }, PHASE2_DELAY);
    },

    next: function () {
      this.index++;
      if (this.index >= this.words.length) {
        this.finish();
        return;
      }
      this.showQuestion();
    },

    // ---- ミス ----
    countMiss: function (w) {
      this.miss++;
      if (!this.missedThisWord) {
        this.missedThisWord = true;
        if (!this.missedWords.some(x => x.en === w.en)) this.missedWords.push(w);
      }
      this.renderHud();
    },

    onMiss: function () {
      this.countMiss(this.words[this.index]);
      $('banner').textContent = '？';
      $('banner').className = 'banner ng';
    },

    renderHud: function () {
      $('hud-progress').textContent = (this.index + 1) + ' / ' + this.words.length;
      $('hud-correct').textContent = this.correct;
      $('hud-miss').textContent = this.miss;
    },

    // ---- 結果 ----
    finish: function () {
      this.playing = false;
      this.stopTimer();
      const sec = Math.round((Date.now() - this.startedAt) / 1000);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');

      $('result-subtitle').textContent = this.words.length + ' 問おわり';
      $('result-stats').innerHTML =
        '<div class="result-row"><span>正解した単語</span><span>' + this.correct + ' / ' + this.words.length + '</span></div>' +
        '<div class="result-row"><span>ミスタイプ</span><span>' + this.miss + '</span></div>' +
        '<div class="result-row"><span>かかった時間</span><span>' + mm + ':' + ss + '</span></div>';

      const review = $('review');
      if (this.missedWords.length) {
        $('review-list').innerHTML = this.missedWords
          .map(w => '<li><b>' + escapeHtml(w.en) + '</b><span>' + escapeHtml(w.ja) + '</span></li>')
          .join('');
        review.hidden = false;
      } else {
        review.hidden = true;
      }

      this.showScreen('result');
    },

    // ---- 入力 ----
    handleKey: function (key) {
      if (this.phase === 1) {
        if (!/^[a-z' -]$/.test(key)) return;
        if (key === this.enTarget[this.enPos]) {
          this.enPos++;
          this.renderEn();
          if (this.enPos >= this.enTarget.length) this.onPhase1Clear();
        } else {
          this.onMiss();
        }
        return;
      }

      if (!/^[a-z0-9\-,.\s]$/.test(key)) return;
      if (!this.wordR || this.idx1 >= this.wordR.length) return;

      this.temp += key;
      let ok = false;

      if (key === this.wordR[this.idx1][this.pattern[this.idx1]][this.idx2]) {
        ok = true;
      } else {
        // 別のローマ字表記（si / shi など）に切り替えられるか探す
        const re = new RegExp('^' + escapeRe(this.temp));
        for (let i = 0; i < this.wordR[this.idx1].length; i++) {
          if (re.test(this.wordR[this.idx1][i])) {
            this.pattern[this.idx1] = i;
            if (key === this.wordR[this.idx1][i][this.idx2]) ok = true;
            break;
          }
        }
      }

      if (!ok) {
        this.temp = this.temp.slice(0, -1);
        this.onMiss();
        return;
      }

      this.idx2++;
      if (this.idx2 === this.wordR[this.idx1][this.pattern[this.idx1]].length) {
        this.idx1++;
        this.idx2 = 0;
        this.temp = '';
      }
      this.renderKana();

      if (this.idx1 >= this.wordR.length) this.onPhase2Clear();
    }
  };

  window.addEventListener('keydown', event => {
    if (event.isComposing || event.key === 'Process') return;
    if (!juken.playing || juken.locked) return;
    if (event.key.length !== 1) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    event.preventDefault();
    juken.handleKey(event.key.toLowerCase());
  });

  window.juken = juken;
  window.addEventListener('load', () => {
    juken.loadMeta();
    // voice一覧は非同期に埋まるので、揃った時点で選び直す
    if (window.speechSynthesis) {
      juken.voice = juken.pickVoice();
      window.speechSynthesis.onvoiceschanged = () => { juken.voice = juken.pickVoice(); };
    }
  });
}(window, document));
</script>
