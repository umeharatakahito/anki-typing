<script>
(function (window, document) {
  'use strict';

  const PHASE1_DELAY = 1300;  // 英単語正解 → 例文へ
  const PHASE2_DELAY = 2000;  // 意味正解 → 次の単語へ
  const TIME_LIMIT   = 20000; // 1問あたりの制限時間
  const REVEAL_DELAY = 2600;  // 時間切れで答えを見せる時間

  const BASE_POINTS  = 100;
  const COMBO_STEP   = 0.02;  // チェイン1つにつき倍率 +2%
  const COMBO_CAP    = 50;    // 倍率は50チェイン（=2.0倍）で頭打ち

  const $ = id => document.getElementById(id);

  const escapeHtml = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // 第2問は和訳側を空欄にする。データの exja は答えにあたる箇所を【】で
  // 囲んであるので、そこを空欄に差し替える。
  function blankJa(exja) {
    return escapeHtml(exja).replace(/【[^】]*】/, '<span class="blank">　　　　　</span>');
  }

  function revealJa(exja) {
    return escapeHtml(exja).replace(/【([^】]*)】/, '<span class="filled">$1</span>');
  }

  const juken = {
    meta: null,
    words: [],
    matched: 0,
    index: 0,
    useExample: true,
    shakyo: false,     // 答えを最初から見せて、速さだけを競うモード
    ghost: null,       // 同じ設定の自己ベスト。あれば並走する
    times: [],         // 今回、各問を解き終えた時刻（開始からのミリ秒）
    revealCount: 0,   // 制限時間の後半で頭から見せていく文字数
    score: 0,
    combo: 0,
    comboMax: 0,
    judges: { great: 0, good: 0, okay: 0 },
    timerStartedAt: 0,
    loadTimer: null,
    phase: 1,
    correct: 0,
    miss: 0,
    playing: false,
    locked: false,
    timerId: null,
    startedAt: 0,
    missedWords: [],
    missedThisWord: false,

    // STEP1: 英字直接入力
    enTarget: '',
    enPos: 0,

    // STEP2: かな（ローマ字入力）
    kanaTokens: [],
    wordR: null,
    pattern: [],
    idx1: 0,
    idx2: 0,
    temp: '',
    hintShown: false,

    // ---- 画面切替 ----
    showScreen: function (name) {
      ['menu', 'game', 'result', 'stats'].forEach(s => {
        const el = $('screen-' + s);
        if (el) el.hidden = (s !== name);
      });
    },

    toMenu: function () {
      this.playing = false;
      this.showScreen('menu');
    },

    quit: function () {
      this.playing = false;
      this.stopTimer();
      window.speechSynthesis && window.speechSynthesis.cancel();
      this.toMenu();
    },

    // ---- 音声合成 ----
    // 端末の既定voiceは機械的で聞き取りづらいものが当たることがあるため、
    // 自然な英語voiceを優先して選ぶ。voice一覧は非同期に埋まるので都度取り直す。
    voice: null,

    pickVoice: function () {
      if (!window.speechSynthesis) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;

      const preferred = [
        'Google US English', 'Samantha', 'Ava', 'Allison', 'Microsoft Aria',
        'Microsoft Jenny', 'Microsoft Zira', 'Karen', 'Moira', 'Daniel'
      ];
      for (const name of preferred) {
        const v = voices.find(x => x.name.indexOf(name) === 0 && /^en/i.test(x.lang));
        if (v) return v;
      }
      // 名前で見つからなければ en-US の非ローカル（クラウド合成＝高品質）を優先
      return voices.find(v => v.lang === 'en-US' && !v.localService)
          || voices.find(v => v.lang === 'en-US')
          || voices.find(v => /^en/i.test(v.lang))
          || null;
    },

    speak: function (text, rate) {
      if (!window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        if (!this.voice) this.voice = this.pickVoice();
        const u = new SpeechSynthesisUtterance(text);
        if (this.voice) u.voice = this.voice;
        u.lang = (this.voice && this.voice.lang) || 'en-US';
        u.rate = rate || 1.0;
        u.pitch = 1.05;
        u.volume = 1;
        window.speechSynthesis.speak(u);
      } catch (e) {
        // 音声非対応の環境では読み上げなしで続行する
      }
    },

    replay: function () {
      const w = this.words[this.index];
      if (!w) return;
      this.speak(this.phase === 1 ? w.en : w.ex);
    },

    // ---- 制限時間 ----
    // 答えが出ないまま固まらないよう、時間切れで答えを見せて次に進む。
    startTimer: function () {
      this.stopTimer();
      const bar = $('timer-bar');
      const started = Date.now();

      bar.className = 'timer-bar';
      bar.style.width = '100%';
      this.revealCount = 0;
      this.timerStartedAt = started;

      this.timerId = setInterval(() => {
        const elapsed = Date.now() - started;
        const left = Math.max(0, TIME_LIMIT - elapsed);
        const pct = (left / TIME_LIMIT) * 100;
        bar.style.width = pct + '%';
        bar.className = 'timer-bar' + (pct < 20 ? ' danger' : pct < 50 ? ' warn' : '');

        // 半分を過ぎたら答えを頭から少しずつ見せる。時間切れの時点で全部見えている。
        // 写経はもともと全部見えているので、頭出しはしない。
        const half = TIME_LIMIT / 2;
        const len = this.phase === 1 ? this.enTarget.length : this.kanaTokens.length;
        const want = (this.shakyo || elapsed <= half) ? 0
          : Math.min(len, Math.ceil(((elapsed - half) / half) * len));
        if (want !== this.revealCount) {
          this.revealCount = want;
          if (this.phase === 1) this.renderEn(); else this.renderKana();
        }

        this.renderGhost();

        if (left <= 0) {
          this.stopTimer();
          this.onTimeout();
        }
      }, 100);
    },

    stopTimer: function () {
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
    },

    onTimeout: function () {
      if (!this.playing || this.locked) return;
      const w = this.words[this.index];
      this.locked = true;
      this.countMiss(w);

      if (this.phase === 1) {
        $('answer-line').innerHTML = '<span class="reveal">' + escapeHtml(w.en) + '</span>';
        $('banner').textContent = '時間切れ — 答えは「' + w.en + '」';
        $('banner').className = 'banner ng';
        this.speak(w.en);
        setTimeout(() => {
          if (!this.playing) return;
          if (this.useExample) this.toPhase2(); else this.next();
        }, REVEAL_DELAY);
      } else {
        this.hintShown = true;
        this.renderKana();
        $('prompt').innerHTML = revealJa(w.exja);
        $('answer-line').innerHTML = '<span class="reveal">' + escapeHtml(w.kana) + '</span>';
        $('banner').textContent = '時間切れ';
        $('banner').className = 'banner ng';
        setTimeout(() => { if (this.playing) this.next(); }, REVEAL_DELAY);
      }
    },

    // ---- 収録範囲をメニューに表示 ----
    loadMeta: function () {
      google.script.run
        .withSuccessHandler(meta => {
          this.meta = meta;
          ['no-from', 'no-to'].forEach(id => {
            $(id).min = meta.minNo;
            $(id).max = meta.maxNo;
          });
          $('range-hint').textContent =
            '収録: 単語' + meta.words + ' ＋ 熟語' + meta.idioms +
            '（見出し語番号 ' + meta.minNo + '〜' + meta.maxNo +
            '）　空欄なら全範囲から出題します';
        })
        .withFailureHandler(() => {
          $('range-hint').textContent = '収録範囲を取得できませんでした';
        })
        .getJukenMeta();
    },

    // 同じ設定どうしでだけ競走できるよう、設定から鍵を作る
    signature: function (opts) {
      return ['eigo', this.shakyo ? 'shakyo' : 'quiz', opts.kind,
              opts.from || '', opts.to || '', opts.limit,
              this.useExample ? 'ex' : 'noex', opts.source].join('|');
    },

    // ---- 開始 ----
    start: function () {
      const opts = {
        from: $('no-from').value,
        to: $('no-to').value,
        limit: $('round-size').value,
        shuffle: $('order-mode').value === 'shuffle',
        kind: $('kind-mode').value,
        source: $('source-mode') ? $('source-mode').value : 'all'
      };
      // 写経は答えが見えている勝負なので、例文ステップは付けない
      this.shakyo = !!($('shakyo-mode') && $('shakyo-mode').checked);
      this.useExample = !this.shakyo && $('example-mode').value === 'on';
      opts.subject = 'eigo';
      opts.ghost = !!($('ghost-mode') && $('ghost-mode').checked);
      opts.sig = this.signature(opts);
      this.sig = opts.sig;

      this.showScreen('game');
      this.stopTimer();
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('prompt').textContent = '読み込み中…';
      $('sub-prompt').textContent = '';
      $('answer-line').textContent = '';
      $('guide').textContent = '';
      $('judge').textContent = '';
      $('timer-bar').style.width = '100%';
      ['speak-btn', 'hint-btn', 'retry-btn'].forEach(id => { $(id).hidden = true; });
      $('hud-ghost-box').hidden = true;

      // 応答が返らないまま固まらないよう、待ちきれなくなったら再試行を促す
      if (this.loadTimer) clearTimeout(this.loadTimer);
      this.loadTimer = setTimeout(() => {
        if (this.playing) return;
        $('prompt').textContent = '読み込みに時間がかかっています';
        $('sub-prompt').textContent = '通信状況を確認して、もう一度お試しください';
        $('retry-btn').hidden = false;
      }, 25000);

      const done = () => { if (this.loadTimer) { clearTimeout(this.loadTimer); this.loadTimer = null; } };

      google.script.run
        .withSuccessHandler(res => {
          done();
          if (!res || res.error || !res.words || !res.words.length) {
            $('prompt').textContent = '出題できる単語がありません';
            $('sub-prompt').textContent = res && res.error ? res.error
              : (opts.source === 'weak'
                  ? 'まだ苦手な単語 がありません。ふつうに解くと溜まります'
                  : '出題範囲を見直してください');
            $('retry-btn').hidden = false;
            return;
          }
          this.words = res.words;
          this.matched = res.matched;
          this.index = 0;
          this.correct = 0;
          this.miss = 0;
          this.score = 0;
          this.combo = 0;
          this.comboMax = 0;
          this.judges = { great: 0, good: 0, okay: 0 };
          this.missedWords = [];
          this.clearedWords = [];
          this.times = [];
          this.ghost = (res.ghost && res.ghost.times && res.ghost.times.length) ? res.ghost : null;
          $('hud-ghost-box').hidden = !this.ghost;
          this.startedAt = Date.now();
          this.playing = true;
          this.showQuestion();
          if (this.ghost) {
            $('banner').textContent = '自己ベスト（' + this.ghost.at + '・' +
              this.ghost.score.toLocaleString() + '点）と同じ問題で競走';
          }
        })
        .withFailureHandler(err => {
          done();
          $('prompt').textContent = 'サーバーとの通信に失敗しました';
          $('sub-prompt').textContent = err && err.message ? err.message : '';
          $('retry-btn').hidden = false;
        })
        .getJukenRound(opts);
    },

    // ---- STEP1: 日本語 → 英単語 ----
    showQuestion: function () {
      const w = this.words[this.index];
      this.phase = 1;
      this.locked = false;
      this.missedThisWord = false;
      this.enTarget = w.en.toLowerCase();
      this.enPos = 0;
      this.revealCount = 0;   // 前の問題の頭出しを持ち越さない

      const isIdiom = w.type === 'idiom';
      const what = isIdiom ? '熟語' : '英単語';
      $('phase-tag').textContent = this.shakyo
        ? '写経 ・ 見たまま打つ'
        : (this.useExample ? 'STEP 1 ・ ' : '') + what + 'をタイプ';
      $('prompt').textContent = w.ja;
      // 語感や使い方の一言は、データにあるときだけ小さく添える
      $('sub-prompt').innerHTML = escapeHtml(this.shakyo
          ? '見えている' + what + 'をそのまま打つ'
          : 'この意味の' + what + 'は？') +
        (w.nu ? '<span class="nuance">' + escapeHtml(w.nu) + '</span>' : '');
      $('guide').textContent = '';
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('speak-btn').hidden = true;
      $('hint-btn').hidden = true;
      $('retry-btn').hidden = true;
      $('judge').textContent = '';
      $('judge').className = 'judge';

      this.renderEn();
      this.renderHud();
      this.startTimer();
    },

    renderEn: function () {
      const t = this.enTarget;
      const peekEnd = Math.max(this.enPos, this.revealCount);
      const done = t.slice(0, this.enPos);
      const peek = t.slice(this.enPos, peekEnd);
      const tail = t.slice(peekEnd);
      // 写経は伏せない
      const rest = this.shakyo ? tail : tail.replace(/[a-z0-9']/g, '_');
      $('answer-line').innerHTML =
        '<span class="done">' + escapeHtml(done) + '</span>' +
        '<span class="peek">' + escapeHtml(peek) + '</span>' +
        '<span class="rest">' + escapeHtml(rest) + '</span>';
    },

    onPhase1Clear: function () {
      const w = this.words[this.index];
      this.locked = true;
      this.stopTimer();
      this.speak(w.en);
      $('answer-line').innerHTML = '<span class="done">' + escapeHtml(w.en) + '</span>';
      $('banner').textContent = '正解！';
      $('banner').className = 'banner ok';

      if (!this.useExample) {
        this.correct++;
        this.award();
      }

      setTimeout(() => {
        if (!this.playing) return;
        if (this.useExample) this.toPhase2(); else this.next();
      }, PHASE1_DELAY);
    },

    // ---- STEP2: 例文の空欄 → 意味をタイプ ----
    toPhase2: function () {
      const w = this.words[this.index];
      this.phase = 2;
      this.locked = false;
      this.hintShown = false;

      const conv = kanaToRoman(w.kana);
      this.wordR = conv[0];
      this.kanaTokens = conv[1];
      this.pattern = new Array(this.wordR.length).fill(0);
      this.idx1 = 0;
      this.idx2 = 0;
      this.temp = '';
      this.revealCount = 0;   // STEP1 の頭出しを持ち越さない

      $('phase-tag').textContent = 'STEP 2 ・ 意味をタイプ';
      $('prompt').innerHTML = blankJa(w.exja);
      $('sub-prompt').innerHTML =
        '<span class="context-en">' + escapeHtml(w.ex) + '</span>空欄に入る日本語は？';
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('guide').textContent = '';
      $('speak-btn').hidden = false;
      $('hint-btn').hidden = false;

      this.speak(w.ex, 0.95);
      this.renderKana();
      this.startTimer();
    },

    renderKana: function () {
      let html = '';
      for (let i = 0; i < this.kanaTokens.length; i++) {
        const tok = this.kanaTokens[i];
        if (i < this.idx1) {
          html += '<span class="done">' + escapeHtml(tok) + '</span>';
        } else if (this.hintShown || i < this.revealCount) {
          html += '<span class="peek">' + escapeHtml(tok) + '</span>';
        } else {
          html += '<span class="rest">' + '○'.repeat(tok.length) + '</span>';
        }
      }
      $('answer-line').innerHTML = html;

      if (this.hintShown) {
        let full = '', typed = 0;
        for (let i = 0; i < this.wordR.length; i++) full += this.wordR[i][this.pattern[i]];
        for (let i = 0; i < this.idx1; i++) typed += this.wordR[i][this.pattern[i]].length;
        typed += this.idx2;
        $('guide').innerHTML =
          '<span class="done">' + escapeHtml(full.slice(0, typed)) + '</span>' +
          escapeHtml(full.slice(typed));
      }
    },

    showHint: function () {
      if (this.phase !== 2) return;
      this.hintShown = true;
      this.renderKana();
    },

    onPhase2Clear: function () {
      const w = this.words[this.index];
      this.locked = true;
      this.stopTimer();
      this.correct++;
      this.award();
      $('prompt').innerHTML = revealJa(w.exja);
      $('banner').textContent = '正解！';
      $('banner').className = 'banner ok';
      $('guide').textContent = '';
      this.renderHud();

      setTimeout(() => {
        if (!this.playing) return;
        this.next();
      }, PHASE2_DELAY);
    },

    next: function () {
      const w = this.words[this.index];
      if (w && !this.missedThisWord) this.clearedWords.push(w.en);
      this.times.push(Date.now() - this.startedAt);
      this.index++;
      if (this.index >= this.words.length) {
        this.finish();
        return;
      }
      this.showQuestion();
    },

    // ---- ミス ----
    // ---- 得点 ----
    // 残り時間で判定を決め、チェイン（連続正解）で倍率を伸ばす。
    // ミスした問題は判定を上げない。
    award: function () {
      const left = Math.max(0, TIME_LIMIT - (Date.now() - this.timerStartedAt));
      const ratio = left / TIME_LIMIT;
      const clean = !this.missedThisWord;

      let judge, mult;
      if (clean && ratio >= 2 / 3)      { judge = 'GREAT!'; mult = 2.0; this.judges.great++; }
      else if (clean && ratio >= 1 / 3) { judge = 'GOOD!';  mult = 1.5; this.judges.good++;  }
      else                              { judge = 'OK';     mult = 1.0; this.judges.okay++;  }

      this.combo++;
      if (this.combo > this.comboMax) this.comboMax = this.combo;
      const comboMult = 1 + Math.min(this.combo, COMBO_CAP) * COMBO_STEP;

      const gained = Math.round(BASE_POINTS * mult * comboMult);
      this.score += gained;

      const el = $('judge');
      el.className = 'judge ' + (mult === 2 ? 'great' : mult === 1.5 ? 'good' : 'okay');
      el.innerHTML = judge +
        '<span class="gain">+' + gained +
        (this.combo > 1 ? '　×' + comboMult.toFixed(2) : '') + '</span>';

      this.renderHud();
    },

    breakCombo: function () {
      this.combo = 0;
      this.renderHud();
    },

    countMiss: function (w) {
      this.miss++;
      this.breakCombo();
      if (!this.missedThisWord) {
        this.missedThisWord = true;
        if (!this.missedWords.some(x => x.en === w.en)) this.missedWords.push(w);
      }
      this.renderHud();
    },

    onMiss: function () {
      this.countMiss(this.words[this.index]);
      $('banner').textContent = '？';
      $('banner').className = 'banner ng';
    },

    // ゴーストの現在地と、こちらとの差
    renderGhost: function () {
      if (!this.ghost) return;
      const now = Date.now() - this.startedAt;
      const t = this.ghost.times;
      let gi = 0;
      while (gi < t.length && t[gi] <= now) gi++;
      $('hud-ghost').textContent = gi + ' / ' + t.length;

      const box = $('hud-ghost-box');
      // 同じ問題数までにかかった時間で比べる
      const done = this.times.length;
      if (!done || done > t.length) { box.className = 'hud-item ghost'; return; }
      const diff = t[done - 1] - this.times[done - 1];
      $('hud-ghost-gap').textContent =
        (diff >= 0 ? '+' : '−') + (Math.abs(diff) / 1000).toFixed(1);
      box.className = 'hud-item ghost ' + (diff >= 0 ? 'lead' : 'behind');
    },

    renderHud: function () {
      $('hud-progress').textContent = (this.index + 1) + ' / ' + this.words.length;
      $('hud-score').textContent = this.score.toLocaleString();
      $('hud-miss').textContent = this.miss;
      $('hud-chain').textContent = this.combo;
      $('hud-chain-box').hidden = this.combo < 2;
    },

    // ---- 結果 ----
    finish: function () {
      this.playing = false;
      this.stopTimer();
      const sec = Math.round((Date.now() - this.startedAt) / 1000);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');

      $('result-subtitle').innerHTML = this.ghostVerdict() || (this.words.length + ' 問おわり');
      $('result-stats').innerHTML =
        '<div class="result-row total"><span>スコア</span><span>' + this.score.toLocaleString() + '</span></div>' +
        '<div class="result-row"><span>最大チェイン</span><span>' + this.comboMax + '</span></div>' +
        '<div class="result-row"><span>判定</span><span>GREAT ' + this.judges.great +
          '　GOOD ' + this.judges.good + '　OK ' + this.judges.okay + '</span></div>' +
        '<div class="result-row"><span>正解</span><span>' + this.correct + ' / ' + this.words.length + '</span></div>' +
        '<div class="result-row"><span>ミスタイプ</span><span>' + this.miss + '</span></div>' +
        '<div class="result-row"><span>かかった時間</span><span>' + mm + ':' + ss + '</span></div>';

      const review = $('review');
      if (this.missedWords.length) {
        // 単語をタップすると発音する
        $('review-list').innerHTML = this.missedWords
          .map(w => '<li class="say" data-say="' + escapeHtml(w.en) + '">' +
                    '<b>' + escapeHtml(w.en) + '</b>' +
                    '<span>' + escapeHtml(w.ja) + '</span>' +
                    '<i class="say-icon">🔊</i></li>')
          .join('');
        review.hidden = false;
      } else {
        review.hidden = true;
      }

      this.saveResult(sec);
      this.saveGhost(sec);
      this.showScreen('result');
    },

    // ゴーストとの決着。最後まで解いた回どうしで比べる。
    ghostVerdict: function () {
      const g = this.ghost;
      const done = this.times.length;
      if (!g || !done) return '';
      const n = Math.min(done, g.times.length);
      const diff = g.times[n - 1] - this.times[n - 1];
      const sec = (Math.abs(diff) / 1000).toFixed(1);
      const beat = this.score > g.score;
      const lead = diff >= 0
        ? '<b class="win">ゴーストに ' + sec + ' 秒勝ち</b>'
        : '<b class="lose">ゴーストに ' + sec + ' 秒負け</b>';
      return lead + '　（自己ベスト ' + g.score.toLocaleString() + ' 点 → 今回 ' +
        this.score.toLocaleString() + ' 点' + (beat ? '・更新' : '') + '）';
    },

    // 今回の走りをゴーストとして預ける。前より良いときだけ残る。
    saveGhost: function (sec) {
      if (!this.sig || this.times.length !== this.words.length || !this.words.length) return;
      try {
        google.script.run
          .withFailureHandler(() => {})
          .saveJukenGhost({
            sig: this.sig,
            subject: 'eigo',
            score: this.score,
            seconds: sec,
            keys: this.words.map(w => w.en),
            times: this.times
          });
      } catch (e) { /* 残せなくても続行 */ }
    },

    // 記録（履歴・苦手な語）をサーバーに預ける。失敗しても遊びは止めない。
    saveResult: function (sec) {
      try {
        google.script.run
          .withFailureHandler(() => {})
          .saveJukenResult({
            subject: 'eigo',
            mode: this.shakyo ? 'shakyo' : 'quiz',
            score: this.score,
            questions: this.words.length,
            correct: this.correct,
            miss: this.miss,
            combo: this.comboMax,
            seconds: sec,
            from: $('no-from').value,
            to: $('no-to').value,
            missed: this.missedWords.map(w => ({ key: w.en, no: w.no, ja: w.ja })),
            cleared: this.clearedWords
          });
      } catch (e) { /* 記録は付けられなくても続行 */ }
    },

    // ---- 記録（履歴・苦手な語）----
    showStats: function () {
      this.showScreen('stats');
      $('stats-body').innerHTML = '<p class="loading">読み込み中…</p>';
      google.script.run
        .withSuccessHandler(res => this.renderStats(res))
        .withFailureHandler(() => {
          $('stats-body').innerHTML = '<p class="loading">記録を読み込めませんでした</p>';
        })
        .getJukenStats('eigo');
    },

    renderStats: function (res) {
      if (!res || !res.ok) {
        $('stats-body').innerHTML = '<p class="loading">記録を読み込めませんでした</p>';
        return;
      }
      if (!res.plays) {
        $('stats-body').innerHTML = '<p class="loading">まだ記録がありません</p>';
        return;
      }
      const modeName = m => m === 'shakyo' ? '写経' : '通常';
      const row = (a, b) => '<div class="result-row"><span>' + a + '</span><span>' + b + '</span></div>';

      let html = '<h3 class="stats-head">ベスト5</h3>';
      html += res.best.map((r, i) =>
        '<div class="result-row' + (i === 0 ? ' total' : '') + '">' +
        '<span>' + (i + 1) + '位　' + escapeHtml(r.at) + '　' + modeName(r.mode) + '</span>' +
        '<span>' + r.score.toLocaleString() + '</span></div>').join('');

      html += '<h3 class="stats-head">最近の記録</h3>';
      html += res.recent.map(r =>
        row(escapeHtml(r.at) + '　' + modeName(r.mode) + '　' + r.correct + '/' + r.questions + '問',
            r.score.toLocaleString() + '点')).join('');

      html += '<h3 class="stats-head">苦手な単語　' + res.weakCount + '語</h3>';
      html += res.weak.length
        ? '<ul class="review-list-plain">' + res.weak.map(w =>
            '<li class="say" data-say="' + escapeHtml(w.key) + '">' +
            '<b>' + escapeHtml(w.key) + '</b><span>' + escapeHtml(w.ja) + '</span>' +
            '<i class="say-icon">🔊</i><em class="miss-count">×' + w.miss + '</em></li>').join('') + '</ul>'
        : '<p class="loading">いまのところありません</p>';

      $('stats-body').innerHTML = html;
    },

    // ---- 入力 ----
    handleKey: function (key) {
      if (this.phase === 1) {
        if (!/^[a-z' -]$/.test(key)) return;
        if (key === this.enTarget[this.enPos]) {
          this.enPos++;
          this.renderEn();
          if (this.enPos >= this.enTarget.length) this.onPhase1Clear();
        } else {
          this.onMiss();
        }
        return;
      }

      if (!/^[a-z0-9\-,.\s]$/.test(key)) return;
      if (!this.wordR || this.idx1 >= this.wordR.length) return;

      this.temp += key;
      let ok = false;

      if (key === this.wordR[this.idx1][this.pattern[this.idx1]][this.idx2]) {
        ok = true;
      } else {
        // 別のローマ字表記（si / shi など）に切り替えられるか探す
        const re = new RegExp('^' + escapeRe(this.temp));
        for (let i = 0; i < this.wordR[this.idx1].length; i++) {
          if (re.test(this.wordR[this.idx1][i])) {
            this.pattern[this.idx1] = i;
            if (key === this.wordR[this.idx1][i][this.idx2]) ok = true;
            break;
          }
        }
      }

      if (!ok) {
        this.temp = this.temp.slice(0, -1);
        this.onMiss();
        return;
      }

      this.idx2++;
      if (this.idx2 === this.wordR[this.idx1][this.pattern[this.idx1]].length) {
        this.idx1++;
        this.idx2 = 0;
        this.temp = '';
      }
      this.renderKana();

      if (this.idx1 >= this.wordR.length) this.onPhase2Clear();
    }
  };

  // ふりかえり・苦手な単語は、タップすると発音する
  document.addEventListener('click', event => {
    const li = event.target.closest('li.say');
    if (!li) return;
    juken.speak(li.dataset.say);
    li.classList.add('said');
    setTimeout(() => li.classList.remove('said'), 400);
  });

  window.addEventListener('keydown', event => {
    if (event.isComposing || event.key === 'Process') return;
    if (!juken.playing || juken.locked) return;
    if (event.key.length !== 1) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    event.preventDefault();
    juken.handleKey(event.key.toLowerCase());
  });

  window.juken = juken;
  window.addEventListener('load', () => {
    juken.loadMeta();
    // voice一覧は非同期に埋まるので、揃った時点で選び直す
    if (window.speechSynthesis) {
      juken.voice = juken.pickVoice();
      window.speechSynthesis.onvoiceschanged = () => { juken.voice = juken.pickVoice(); };
    }
  });
}(window, document));
</script>
