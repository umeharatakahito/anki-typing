<script>
(function (window, document) {
  'use strict';

  const NEXT_DELAY   = 1500;  // 正解 → 次の問題へ
  const REVEAL_DELAY = 2800;  // 時間切れで答えを見せる時間

  // 歴史の答えは「とぅーるぽわてぃえかんのたたかい」のように長いものがある。
  // 一律の制限時間だと長い語だけ理不尽になるので、打つ字数から決める。
  const TIME_BASE = 9000;
  const TIME_PER_KANA = 900;
  const TIME_MIN = 14000;
  const TIME_MAX = 32000;

  const BASE_POINTS = 100;
  const COMBO_STEP  = 0.02;
  const COMBO_CAP   = 50;

  const $ = id => document.getElementById(id);

  const escapeHtml = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // 答えの表示形。別解があれば添える
  function headword(w) {
    return w.a + (w.alt && w.alt.length ? '（' + w.alt.join('・') + '）' : '');
  }

  const rekishi = {
    meta: null,
    mode: 'quiz',      // quiz = 一問一答 / zu = 図表の穴埋め
    zu: null,          // 図表モードのときの図表データ
    words: [],
    matched: 0,
    index: 0,
    shakyo: false,     // 答えを最初から見せて、速さだけを競うモード
    ghost: null,       // 同じ設定の自己ベスト。あれば並走する
    times: [],         // 今回、各問を解き終えた時刻（開始からのミリ秒）
    revealCount: 0,
    limitMs: TIME_MIN,
    score: 0,
    combo: 0,
    comboMax: 0,
    judges: { great: 0, good: 0, okay: 0 },
    timerStartedAt: 0,
    loadTimer: null,
    correct: 0,
    miss: 0,
    playing: false,
    locked: false,
    timerId: null,
    startedAt: 0,
    missedWords: [],
    clearedWords: [],
    missedThisWord: false,

    // 打つ対象
    kanaTokens: [],
    wordR: null,
    pattern: [],
    idx1: 0,
    idx2: 0,
    temp: '',
    hintShown: false,

    // 画面キーボードの見出し
    kbLabel: function () { return 'ローマ字で答えを入力'; },

    // ---- 画面切替 ----
    showScreen: function (name) {
      ['menu', 'game', 'result', 'stats', 'zu'].forEach(s => {
        const el = $('screen-' + s);
        if (el) el.hidden = (s !== name);
      });
    },

    toMenu: function () {
      this.playing = false;
      this.stopTimer();
      this.showScreen('menu');
    },

    quit: function () {
      if (!this.playing) { this.toMenu(); return; }
      this.stopTimer();
      this.words = this.words.slice(0, this.index);
      this.finish();
    },

    again: function () {
      if (this.mode === 'zu' && this.zu) this.startZu(this.zu.id);
      else this.start();
    },

    // ---- 制限時間 ----
    startTimer: function () {
      this.stopTimer();
      const bar = $('timer-bar');
      const started = Date.now();
      const limit = this.limitMs;

      bar.className = 'timer-bar';
      bar.style.width = '100%';
      this.revealCount = 0;
      this.timerStartedAt = started;

      this.timerId = setInterval(() => {
        const elapsed = Date.now() - started;
        const left = Math.max(0, limit - elapsed);
        const pct = (left / limit) * 100;
        bar.style.width = pct + '%';
        bar.className = 'timer-bar' + (pct < 20 ? ' danger' : pct < 50 ? ' warn' : '');

        // 半分を過ぎたら答えを頭から少しずつ見せる。
        // 写経はもともと全部見えているので、頭出しはしない。
        const half = limit / 2;
        const len = this.kanaTokens.length;
        const want = (this.shakyo || elapsed <= half) ? 0
          : Math.min(len, Math.ceil(((elapsed - half) / half) * len));
        if (want !== this.revealCount) {
          this.revealCount = want;
          this.renderKana();
        }

        this.renderGhost();

        if (left <= 0) {
          this.stopTimer();
          this.onTimeout();
        }
      }, 100);
    },

    stopTimer: function () {
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
    },

    onTimeout: function () {
      if (!this.playing || this.locked) return;
      const w = this.words[this.index];
      this.locked = true;
      this.countMiss(w);
      this.hintShown = true;
      this.renderKana();

      $('answer-line').innerHTML = '<span class="reveal">' + escapeHtml(headword(w)) + '</span>';
      $('banner').textContent = '時間切れ — 答えは「' + w.a + '」';
      $('banner').className = 'banner ng';
      if (this.mode === 'zu') this.markZu(this.index, 'miss');

      setTimeout(() => { if (this.playing) this.next(); }, REVEAL_DELAY);
    },

    // ---- 収録範囲をメニューに表示 ----
    loadMeta: function () {
      google.script.run
        .withSuccessHandler(meta => {
          this.meta = meta;
          ['no-from', 'no-to'].forEach(id => {
            $(id).min = meta.minPr;
            $(id).max = meta.maxPr;
          });
          $('range-hint').textContent =
            '収録: ' + meta.total + '問（プリント No.' + meta.minPr + '〜No.' + meta.maxPr +
            '）　空欄なら全範囲から出題します';
        })
        .withFailureHandler(() => {
          $('range-hint').textContent = '収録範囲を取得できませんでした';
        })
        .getRekishiMeta();
    },

    // 同じ設定どうしでだけ競走できるよう、設定から鍵を作る
    signature: function (opts) {
      return ['rekishi', this.shakyo ? 'shakyo' : 'quiz', opts.fld,
              opts.from || '', opts.to || '', opts.limit, opts.source].join('|');
    },

    // 読み込み中の見た目をそろえる
    prepareStage: function (tag) {
      this.showScreen('game');
      this.stopTimer();
      this.playing = false;
      $('phase-tag').textContent = tag;
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('prompt').textContent = '読み込み中…';
      $('sub-prompt').textContent = '';
      $('answer-line').textContent = '';
      $('guide').textContent = '';
      $('judge').textContent = '';
      $('judge').className = 'judge';
      $('timer-bar').style.width = '100%';
      ['hint-btn', 'retry-btn'].forEach(id => { $(id).hidden = true; });
      $('hud-ghost-box').hidden = true;

      if (this.loadTimer) clearTimeout(this.loadTimer);
      this.loadTimer = setTimeout(() => {
        if (this.playing) return;
        $('prompt').textContent = '読み込みに時間がかかっています';
        $('sub-prompt').textContent = '通信状況を確認して、もう一度お試しください';
        $('retry-btn').hidden = false;
      }, 25000);
    },

    loadDone: function () {
      if (this.loadTimer) { clearTimeout(this.loadTimer); this.loadTimer = null; }
    },

    resetRound: function () {
      this.index = 0;
      this.correct = 0;
      this.miss = 0;
      this.score = 0;
      this.combo = 0;
      this.comboMax = 0;
      this.judges = { great: 0, good: 0, okay: 0 };
      this.missedWords = [];
      this.clearedWords = [];
      this.times = [];
      this.startedAt = Date.now();
      this.playing = true;
    },

    // ---- 一問一答をはじめる ----
    start: function () {
      const opts = {
        from: $('no-from').value,
        to: $('no-to').value,
        limit: $('round-size').value,
        shuffle: $('order-mode').value === 'shuffle',
        fld: $('fld-mode') ? $('fld-mode').value : 'all',
        source: $('source-mode') ? $('source-mode').value : 'all'
      };
      this.shakyo = !!($('shakyo-mode') && $('shakyo-mode').checked);
      this.mode = 'quiz';
      this.zu = null;
      opts.subject = 'rekishi';
      opts.ghost = !!($('ghost-mode') && $('ghost-mode').checked);
      opts.sig = this.signature(opts);
      this.sig = opts.sig;

      this.prepareStage('一問一答');
      $('zu-wrap').hidden = true;

      google.script.run
        .withSuccessHandler(res => {
          this.loadDone();
          if (!res || res.error || !res.words || !res.words.length) {
            $('prompt').textContent = '出題できる問題がありません';
            $('sub-prompt').textContent = res && res.error ? res.error
              : (opts.source === 'weak'
                  ? 'まだ苦手な語がありません。ふつうに解くと溜まります'
                  : '出題範囲を見直してください');
            $('retry-btn').hidden = false;
            return;
          }
          this.words = res.words;
          this.matched = res.matched;
          this.resetRound();
          this.ghost = (res.ghost && res.ghost.times && res.ghost.times.length) ? res.ghost : null;
          $('hud-ghost-box').hidden = !this.ghost;
          this.showQuestion();
          if (this.ghost) {
            $('banner').textContent = '自己ベスト（' + this.ghost.at + '・' +
              this.ghost.score.toLocaleString() + '点）と同じ問題で競走';
          }
        })
        .withFailureHandler(err => {
          this.loadDone();
          $('prompt').textContent = 'サーバーとの通信に失敗しました';
          $('sub-prompt').textContent = err && err.message ? err.message : '';
          $('retry-btn').hidden = false;
        })
        .getJukenRound(opts);
    },

    // ---- 図表えらび ----
    showZuPicker: function () {
      this.showScreen('zu');
      const box = $('zu-list');
      box.innerHTML = '<p class="loading">読み込み中…</p>';
      google.script.run
        .withSuccessHandler(list => {
          if (!list || !list.length) {
            box.innerHTML = '<p class="loading">使える図表がありません</p>';
            return;
          }
          box.innerHTML = '<ul class="menu-list">' + list.map(z =>
            '<li><button class="btn btn-main" data-zu="' + escapeHtml(z.id) + '">' +
            escapeHtml(z.title) +
            '<span class="soon">' + z.count + 'か所　' + escapeHtml(z.note) + '</span>' +
            '</button></li>').join('') + '</ul>';
          box.querySelectorAll('button[data-zu]').forEach(b => {
            b.addEventListener('click', () => this.startZu(b.dataset.zu));
          });
        })
        .withFailureHandler(() => {
          box.innerHTML = '<p class="loading">図表を読み込めませんでした</p>';
        })
        .getRekishiZuList();
    },

    // ---- 図表の穴埋めをはじめる ----
    startZu: function (id) {
      this.mode = 'zu';
      this.shakyo = false;
      this.ghost = null;
      this.sig = null;
      this.prepareStage('図表を埋める');
      $('zu-wrap').hidden = true;

      google.script.run
        .withSuccessHandler(res => {
          this.loadDone();
          if (!res || res.error || !res.areas || !res.areas.length) {
            $('prompt').textContent = '図表を読み込めませんでした';
            $('sub-prompt').textContent = (res && res.error) || '';
            $('retry-btn').hidden = true;
            return;
          }
          this.zu = res;
          // order は出す順番。words は order の並びで作る。
          this.words = res.order.map(i => {
            const a = res.areas[i];
            return { no: i + 1, a: a.a, kana: a.kana, nu: a.hint, area: i, pr: 0 };
          });
          this.matched = this.words.length;
          this.resetRound();
          this.renderZuBase();
          this.showQuestion();
        })
        .withFailureHandler(err => {
          this.loadDone();
          $('prompt').textContent = 'サーバーとの通信に失敗しました';
          $('sub-prompt').textContent = err && err.message ? err.message : '';
        })
        .getRekishiZu({ id: id, shuffle: !!($('zu-shuffle') && $('zu-shuffle').checked) });
    },

    // 図表の画像と、伏せておく場所を並べる
    renderZuBase: function () {
      const wrap = $('zu-wrap');
      const img = $('zu-img');
      img.src = this.zu.src;
      wrap.hidden = false;

      $('zu-layer').innerHTML = this.words.map((w, n) =>
        '<div class="zu-mask" id="zu-m' + n + '" style="' +
        'left:' + this.zu.areas[w.area].x + '%;' +
        'top:' + this.zu.areas[w.area].y + '%;' +
        'width:' + this.zu.areas[w.area].w + '%;' +
        'height:' + this.zu.areas[w.area].h + '%;">' + (n + 1) + '</div>').join('');
    },

    // 1か所ぶんの状態を変える。done は伏せをはずし、miss は赤枠にする。
    markZu: function (n, state) {
      const el = $('zu-m' + n);
      if (!el) return;
      el.className = 'zu-mask ' + state;
      if (state === 'done' || state === 'miss') el.textContent = '';
    },

    // ---- 打つ対象のかなをセットする ----
    setKanaTarget: function (kana) {
      const conv = kanaToRoman(kana);
      this.wordR = conv[0];
      this.kanaTokens = conv[1];
      this.pattern = new Array(this.wordR.length).fill(0);
      this.idx1 = 0;
      this.idx2 = 0;
      this.temp = '';
      this.hintShown = false;
      this.revealCount = 0;   // 前の問題の頭出しを持ち越さない
      this.limitMs = Math.max(TIME_MIN,
        Math.min(TIME_MAX, TIME_BASE + this.kanaTokens.length * TIME_PER_KANA));
    },

    // ---- 出題 ----
    showQuestion: function () {
      const w = this.words[this.index];
      this.locked = false;
      this.missedThisWord = false;
      this.setKanaTarget(w.kana);

      if (this.mode === 'zu') {
        $('phase-tag').textContent = '図表を埋める ・ ' + this.zu.title;
        $('prompt').textContent = (this.index + 1) + ' のところは？';
        $('sub-prompt').innerHTML = escapeHtml(this.zu.note) +
          (w.nu ? '<span class="nuance">' + escapeHtml(w.nu) + '</span>' : '');
        this.markZu(this.index, 'now');
      } else {
        $('phase-tag').textContent = this.shakyo ? '写経 ・ 見たまま打つ' : '一問一答';
        $('prompt').textContent = w.q;
        // 写経は答えを競う勝負ではないので、読みだけでなく表記も先に見せる
        $('sub-prompt').innerHTML =
          (this.shakyo ? '<span class="context-en">' + escapeHtml(headword(w)) + '</span>' : '') +
          escapeHtml(
            (this.shakyo ? '見えている語をそのまま打つ' : '答えは？') +
            '　プリント No.' + w.pr) +
          (w.nu ? '<span class="nuance">' + escapeHtml(w.nu) + '</span>' : '');
      }

      $('guide').textContent = '';
      $('banner').textContent = '';
      $('banner').className = 'banner';
      $('hint-btn').hidden = this.shakyo;
      $('retry-btn').hidden = true;
      $('judge').textContent = '';
      $('judge').className = 'judge';

      this.renderKana();
      this.renderHud();
      this.startTimer();
    },

    onClear: function () {
      const w = this.words[this.index];
      this.locked = true;
      this.stopTimer();
      this.correct++;
      this.award();
      $('answer-line').innerHTML = '<span class="done">' + escapeHtml(headword(w)) + '</span>';
      $('banner').textContent = '正解！';
      $('banner').className = 'banner ok';
      if (this.mode === 'zu') this.markZu(this.index, 'done');

      setTimeout(() => { if (this.playing) this.next(); }, NEXT_DELAY);
    },

    renderKana: function () {
      let html = '';
      for (let i = 0; i < this.kanaTokens.length; i++) {
        const tok = this.kanaTokens[i];
        if (i < this.idx1) {
          html += '<span class="done">' + escapeHtml(tok) + '</span>';
        } else if (this.shakyo) {
          // 写経は伏せない
          html += '<span class="show">' + escapeHtml(tok) + '</span>';
        } else if (this.hintShown || i < this.revealCount) {
          html += '<span class="peek">' + escapeHtml(tok) + '</span>';
        } else {
          html += '<span class="rest">' + '○'.repeat(tok.length) + '</span>';
        }
      }
      $('answer-line').innerHTML = html;

      if (this.hintShown || this.shakyo) {
        let full = '', typed = 0;
        for (let i = 0; i < this.wordR.length; i++) full += this.wordR[i][this.pattern[i]];
        for (let i = 0; i < this.idx1; i++) typed += this.wordR[i][this.pattern[i]].length;
        typed += this.idx2;
        $('guide').innerHTML =
          '<span class="done">' + escapeHtml(full.slice(0, typed)) + '</span>' +
          escapeHtml(full.slice(typed));
      } else {
        $('guide').textContent = '';
      }
    },

    showHint: function () {
      this.hintShown = true;
      this.renderKana();
    },

    next: function () {
      const w = this.words[this.index];
      if (w && !this.missedThisWord) this.clearedWords.push(w.a);
      this.times.push(Date.now() - this.startedAt);
      this.index++;
      if (this.index >= this.words.length) {
        this.finish();
        return;
      }
      this.showQuestion();
    },

    // ---- 得点 ----
    award: function () {
      const left = Math.max(0, this.limitMs - (Date.now() - this.timerStartedAt));
      const ratio = left / this.limitMs;
      const clean = !this.missedThisWord;

      let judge, mult;
      if (clean && ratio >= 2 / 3)      { judge = 'GREAT!'; mult = 2.0; this.judges.great++; }
      else if (clean && ratio >= 1 / 3) { judge = 'GOOD!';  mult = 1.5; this.judges.good++;  }
      else                              { judge = 'OK';     mult = 1.0; this.judges.okay++;  }

      this.combo++;
      if (this.combo > this.comboMax) this.comboMax = this.combo;
      const comboMult = 1 + Math.min(this.combo, COMBO_CAP) * COMBO_STEP;

      const gained = Math.round(BASE_POINTS * mult * comboMult);
      this.score += gained;

      const el = $('judge');
      el.className = 'judge ' + (mult === 2 ? 'great' : mult === 1.5 ? 'good' : 'okay');
      el.innerHTML = judge +
        '<span class="gain">+' + gained +
        (this.combo > 1 ? '　×' + comboMult.toFixed(2) : '') + '</span>';

      this.renderHud();
    },

    breakCombo: function () {
      this.combo = 0;
      this.renderHud();
    },

    countMiss: function (w) {
      this.miss++;
      this.breakCombo();
      if (!this.missedThisWord) {
        this.missedThisWord = true;
        if (!this.missedWords.some(x => x.a === w.a)) this.missedWords.push(w);
      }
      this.renderHud();
    },

    onMiss: function () {
      this.countMiss(this.words[this.index]);
      $('banner').textContent = '？';
      $('banner').className = 'banner ng';
    },

    // ゴーストの現在地と、こちらとの差
    renderGhost: function () {
      if (!this.ghost) return;
      const now = Date.now() - this.startedAt;
      const t = this.ghost.times;
      let gi = 0;
      while (gi < t.length && t[gi] <= now) gi++;
      $('hud-ghost').textContent = gi + ' / ' + t.length;

      const box = $('hud-ghost-box');
      const done = this.times.length;
      if (!done || done > t.length) { box.className = 'hud-item ghost'; return; }
      const diff = t[done - 1] - this.times[done - 1];
      $('hud-ghost-gap').textContent =
        (diff >= 0 ? '+' : '−') + (Math.abs(diff) / 1000).toFixed(1);
      box.className = 'hud-item ghost ' + (diff >= 0 ? 'lead' : 'behind');
    },

    renderHud: function () {
      $('hud-progress').textContent = (this.index + 1) + ' / ' + this.words.length;
      $('hud-score').textContent = this.score.toLocaleString();
      $('hud-miss').textContent = this.miss;
      $('hud-chain').textContent = this.combo;
      $('hud-chain-box').hidden = this.combo < 2;
    },

    // ---- 結果 ----
    finish: function () {
      this.playing = false;
      this.stopTimer();
      const sec = Math.round((Date.now() - this.startedAt) / 1000);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');

      $('result-subtitle').innerHTML = this.ghostVerdict() ||
        ((this.mode === 'zu' ? this.zu.title + ' ' : '') + this.words.length + ' 問おわり');
      $('result-stats').innerHTML =
        '<div class="result-row total"><span>スコア</span><span>' + this.score.toLocaleString() + '</span></div>' +
        '<div class="result-row"><span>最大チェイン</span><span>' + this.comboMax + '</span></div>' +
        '<div class="result-row"><span>判定</span><span>GREAT ' + this.judges.great +
          '　GOOD ' + this.judges.good + '　OK ' + this.judges.okay + '</span></div>' +
        '<div class="result-row"><span>正解</span><span>' + this.correct + ' / ' + this.words.length + '</span></div>' +
        '<div class="result-row"><span>ミスタイプ</span><span>' + this.miss + '</span></div>' +
        '<div class="result-row"><span>かかった時間</span><span>' + mm + ':' + ss + '</span></div>';

      const review = $('review');
      if (this.missedWords.length) {
        $('review-list').innerHTML = this.missedWords
          .map(w => '<li><b>' + escapeHtml(w.a) +
                    '</b><span>' + escapeHtml(w.q || w.nu || '') + '</span></li>')
          .join('');
        review.hidden = false;
      } else {
        review.hidden = true;
      }

      this.saveResult(sec);
      this.saveGhost(sec);
      this.showScreen('result');
    },

    // ゴーストとの決着。最後まで解いた回どうしで比べる。
    ghostVerdict: function () {
      const g = this.ghost;
      const done = this.times.length;
      if (!g || !done) return '';
      const n = Math.min(done, g.times.length);
      const diff = g.times[n - 1] - this.times[n - 1];
      const sec = (Math.abs(diff) / 1000).toFixed(1);
      const beat = this.score > g.score;
      const lead = diff >= 0
        ? '<b class="win">ゴーストに ' + sec + ' 秒勝ち</b>'
        : '<b class="lose">ゴーストに ' + sec + ' 秒負け</b>';
      return lead + '　（自己ベスト ' + g.score.toLocaleString() + ' 点 → 今回 ' +
        this.score.toLocaleString() + ' 点' + (beat ? '・更新' : '') + '）';
    },

    // 今回の走りをゴーストとして預ける。前より良いときだけ残る。
    saveGhost: function (sec) {
      if (this.mode === 'zu') return;
      if (!this.sig || this.times.length !== this.words.length || !this.words.length) return;
      try {
        google.script.run
          .withFailureHandler(() => {})
          .saveJukenGhost({
            sig: this.sig,
            subject: 'rekishi',
            score: this.score,
            seconds: sec,
            keys: this.words.map(w => w.a),
            times: this.times
          });
      } catch (e) { /* 残せなくても続行 */ }
    },

    // 記録（履歴・苦手な語）をサーバーに預ける。失敗しても遊びは止めない。
    saveResult: function (sec) {
      try {
        google.script.run
          .withFailureHandler(() => {})
          .saveJukenResult({
            subject: 'rekishi',
            mode: this.mode === 'zu' ? 'zu' : (this.shakyo ? 'shakyo' : 'quiz'),
            score: this.score,
            questions: this.words.length,
            correct: this.correct,
            miss: this.miss,
            combo: this.comboMax,
            seconds: sec,
            from: $('no-from').value,
            to: $('no-to').value,
            missed: this.missedWords.map(w => ({ key: w.a, no: w.no, ja: w.q || w.nu || '' })),
            cleared: this.clearedWords
          });
      } catch (e) { /* 記録は付けられなくても続行 */ }
    },

    // ---- 記録（履歴・苦手な語）----
    showStats: function () {
      this.showScreen('stats');
      $('stats-body').innerHTML = '<p class="loading">読み込み中…</p>';
      google.script.run
        .withSuccessHandler(res => this.renderStats(res))
        .withFailureHandler(() => {
          $('stats-body').innerHTML = '<p class="loading">記録を読み込めませんでした</p>';
        })
        .getJukenStats('rekishi');
    },

    renderStats: function (res) {
      if (!res || !res.ok) {
        $('stats-body').innerHTML = '<p class="loading">記録を読み込めませんでした</p>';
        return;
      }
      if (!res.plays) {
        $('stats-body').innerHTML = '<p class="loading">まだ記録がありません</p>';
        return;
      }
      const modeName = m => m === 'shakyo' ? '写経' : m === 'zu' ? '図表' : '一問一答';
      const row = (a, b) => '<div class="result-row"><span>' + a + '</span><span>' + b + '</span></div>';

      let html = '<h3 class="stats-head">ベスト5</h3>';
      html += res.best.map((r, i) =>
        '<div class="result-row' + (i === 0 ? ' total' : '') + '">' +
        '<span>' + (i + 1) + '位　' + escapeHtml(r.at) + '　' + modeName(r.mode) + '</span>' +
        '<span>' + r.score.toLocaleString() + '</span></div>').join('');

      html += '<h3 class="stats-head">最近の記録</h3>';
      html += res.recent.map(r =>
        row(escapeHtml(r.at) + '　' + modeName(r.mode) + '　' + r.correct + '/' + r.questions + '問',
            r.score.toLocaleString() + '点')).join('');

      html += '<h3 class="stats-head">苦手な語　' + res.weakCount + '語</h3>';
      html += res.weak.length
        ? '<ul class="review-list-plain">' + res.weak.map(w =>
            '<li><b>' + escapeHtml(w.key) + '</b><span>' + escapeHtml(w.ja) + '</span>' +
            '<em class="miss-count">×' + w.miss + '</em></li>').join('') + '</ul>'
        : '<p class="loading">いまのところありません</p>';

      $('stats-body').innerHTML = html;
    },

    // ---- 入力（ローマ字→かな）----
    handleKey: function (key) {
      // ' も通す。「ん」＋母音／や行は n' と nn のどちらでも打てる
      if (!/^[a-z0-9\-,.'\s]$/.test(key)) return;
      if (!this.wordR || this.idx1 >= this.wordR.length) return;

      this.temp += key;
      let ok = false;

      if (key === this.wordR[this.idx1][this.pattern[this.idx1]][this.idx2]) {
        ok = true;
      } else {
        // 別のローマ字表記（si / shi など）に切り替えられるか探す
        const re = new RegExp('^' + escapeRe(this.temp));
        for (let i = 0; i < this.wordR[this.idx1].length; i++) {
          if (re.test(this.wordR[this.idx1][i])) {
            this.pattern[this.idx1] = i;
            if (key === this.wordR[this.idx1][i][this.idx2]) ok = true;
            break;
          }
        }
      }

      if (!ok) {
        this.temp = this.temp.slice(0, -1);
        this.onMiss();
        return;
      }

      this.idx2++;
      if (this.idx2 === this.wordR[this.idx1][this.pattern[this.idx1]].length) {
        this.idx1++;
        this.idx2 = 0;
        this.temp = '';
      }
      this.renderKana();

      if (this.idx1 >= this.wordR.length) this.onClear();
    }
  };

  window.addEventListener('keydown', event => {
    if (event.isComposing || event.key === 'Process') return;
    if (!rekishi.playing || rekishi.locked) return;
    if (event.key.length !== 1) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    event.preventDefault();
    rekishi.handleKey(event.key.toLowerCase());
  });

  window.rekishi = rekishi;
  window.addEventListener('load', () => { rekishi.loadMeta(); });
}(window, document));
</script>
