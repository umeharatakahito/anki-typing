<style>
  /* モードごとの枠。中に「個人」と「対戦」を並べる */
  #mode-list{ list-style:none; padding:0; margin:0 auto; max-width:560px; }
  #mode-list li.mode-box{ display:block; margin:0 0 14px; padding:14px 16px 16px; border:1px solid var(--line);
    border-radius:12px; background:var(--card); }
  #mode-list .mode-name{ font-size:1.15rem; font-weight:700; text-align:center; margin:0 0 10px; }
  #mode-list .mode-btns .button{ background:var(--field); }
  #mode-list .mode-btns .button:hover{ background:var(--card); }
  #mode-list .mode-btns{ display:flex; gap:10px; }
  #mode-list .mode-btns .button{ flex:1 1 0; width:auto; margin:0; }
  #menu-vs .vs-actions{ display:flex; flex-direction:column; gap:10px; align-items:center; }
  #menu-vs .vs-join{ display:flex; gap:8px; justify-content:center; }
  #menu-vs .vs-join input{ width:8em; min-height:48px; padding:8px 10px; font-family:inherit; font-size:18px; text-align:center; letter-spacing:.2em;
    color:var(--text); background:var(--field); border:1px solid var(--line); border-radius:8px; }
  #menu-vs .vs-join .button{ width:auto; margin:0; min-height:48px; }
  #menu-vs .vs-join input:focus, #menu-vs .vs-target select:focus{ outline:none; border-color:var(--accent); }
  #menu-vs .vs-target{ display:flex; gap:8px; align-items:center; justify-content:center; font-size:15px; }
  #menu-vs .vs-actions > .button{ margin:0; }
  #menu-vs .vs-target select{ min-height:44px; padding:8px 12px; font-family:inherit; font-size:16px;
    color:var(--text); background:var(--field); border:1px solid var(--line); border-radius:8px; }
  #menu-vs .vs-rule{ margin:12px auto 0; max-width:34em; color:var(--muted); font-size:.85rem; line-height:1.7; }
  #vs-status{ min-height:1.6em; margin:14px 0 0; text-align:center; font-size:15px; }
  /* 部屋番号で入るだけのとき（問題集・モードを選ぶ前）は、作る・自動マッチ・本数を出さない */
  #menu-vs.join-only #vs-match, #menu-vs.join-only #vs-create, #menu-vs.join-only .vs-target{ display:none; }
  #vs-status .vs-code{ display:block; font-size:40px; font-weight:bold; letter-spacing:.25em; margin:6px 0; }
  #menu-vs [hidden]{ display:none !important; }
  #vs-status .vs-invite{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:6px 0 10px; }
  #vs-status .vs-invite input{ flex:1 1 100%; max-width:460px; padding:8px; font-size:13px; text-align:center; border-radius:8px;
    border:1px solid var(--line); background:var(--field); color:var(--text); }
  #vs-status .vs-invite .button{ width:auto; padding:8px 14px; margin:0; }

  /* ---- 対戦中 ---- */
  #vs-bar{ display:none; max-width:900px; margin:4px auto 0; text-align:center; }
  body.vs-on #vs-bar{ display:block; }
  body.vs-on #pause-btn, body.vs-on #hamachi-life, body.vs-on #last-note{ display:none !important; }
  .vs-score{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px 16px; font-weight:bold; }
  .vs-score .vs-one{ display:inline-flex; align-items:baseline; gap:6px; }
  .vs-score .vs-who{ max-width:10em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 自分は赤、相手は席の順に 青・緑・橙 */
  .vs-me{ color:#e5484d; } .vs-you, .vs-c1{ color:#2f7fe0; } .vs-c2{ color:#16a34a; } .vs-c3{ color:#ea8a00; }
  .vs-score .vs-pts{ font-size:28px; font-variant-numeric:tabular-nums; }
  .vs-score .vs-dash{ opacity:.5; }
  .vs-sub{ font-size:12px; color:var(--muted); }

  /* 入力欄を左右（自分・相手）に分ける */
  #vs-split{ display:none; }
  body.vs-on #vs-split{ display:grid; grid-template-columns:repeat(var(--vs-n, 2), minmax(0, 1fr)); gap:12px; width:100%; }
  body.vs-on #input-zone{ max-width:900px; }
  .vs-panel{ border:2px solid transparent; border-radius:12px; padding:8px 10px; min-width:0;
    background:var(--card); }
  .vs-panel.me{ border-color:#f8a1a4; } .vs-panel.vs-c1{ border-color:#9cc3f5; }
  .vs-panel.vs-c2{ border-color:#86d3a4; } .vs-panel.vs-c3{ border-color:#f6c27a; }
  .vs-panel.you{ color:inherit; }
  .vs-panel.out{ opacity:.55; }
  .vs-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:4px; }
  .vs-head b{ max-width:9em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vs-kana{ font-size:22px; font-weight:bold; letter-spacing:.04em; word-break:break-all; min-height:1.4em; }
  .vs-kana .d{ color:#e5484d; } .vs-panel.vs-c1 .d{ color:#2f7fe0; } .vs-panel.vs-c2 .d{ color:#16a34a; } .vs-panel.vs-c3 .d{ color:#ea8a00; }
  .vs-kana .r{ opacity:.35; }
  .vs-typed{ font-size:18px; font-family:ui-monospace, Menlo, monospace; min-height:1.4em; word-break:break-all; }
  .vs-panel.vs-c1 .vs-typed{ color:#2f7fe0; } .vs-panel.vs-c2 .vs-typed{ color:#16a34a; } .vs-panel.vs-c3 .vs-typed{ color:#ea8a00; }
  /* 4 人のときは PC でも詰める */
  body.vs-on #vs-split.n4 .vs-kana{ font-size:17px; } body.vs-on #vs-split.n4 .vs-typed{ font-size:15px; }
  /* 待合（参加者の一覧と開始ボタン） */
  #vs-lobby{ margin:12px auto 0; text-align:center; }
  #vs-lobby ul{ list-style:none; padding:0; margin:6px 0 10px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  #vs-lobby li{ padding:4px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:14px; }
  #vs-lobby li.host::after{ content:' ★'; }
  #vs-lobby .vs-lobby-note{ font-size:13px; color:var(--muted); }
  .vs-panel #game-input{ height:auto; min-height:44px; margin:0; }
  .vs-miss.warn{ color:#e5484d; font-weight:bold; }
  .vs-state{ font-size:13px; font-weight:bold; color:#e5484d; min-height:1.2em; }
  /* スマホ：相手は小さく、打った文字だけ */
  @media (max-width:799px){
    body.vs-on #vs-split{ grid-template-columns:1fr; gap:6px; }
    .vs-panel.you{ order:-1; padding:4px 8px; }
    .vs-panel.you .vs-kana{ display:none; }
    .vs-panel.you .vs-typed{ font-size:13px; min-height:1.1em; }
    .vs-panel.you .vs-head{ margin:0; font-size:12px; }
    .vs-panel.me .vs-kana{ display:none; }   /* 自分のかなは問題カードに出ている */
  }

  /* 1 本ごとの結果 */
  #vs-point{ display:none; position:fixed; inset:0; z-index:9000; align-items:center; justify-content:center;
    background:rgba(0,0,0,.45); }
  #vs-point.show{ display:flex; }
  .vs-point-card{ width:min(92vw, 520px); border-radius:14px; padding:20px 22px; text-align:center;
    background:var(--card); color:var(--text); border:1px solid var(--line); box-shadow:0 16px 48px rgba(0,0,0,.3); }
  .vs-point-big{ font-size:30px; font-weight:bold; margin:0 0 8px; }
  .vs-point-ans{ font-size:22px; font-weight:bold; margin:6px 0; }
  .vs-point-note{ font-size:14px; line-height:1.6; white-space:pre-wrap; text-align:center; opacity:.85; margin:8px 0; }
  .vs-point-score{ font-size:26px; font-weight:bold; margin-top:8px; font-variant-numeric:tabular-nums; }
  .vs-point-next{ font-size:12px; opacity:.7; margin-top:6px; }

  .vs-rules{ display:flex; gap:10px; flex-wrap:wrap; }
  .vs-rules .vs-target{ flex:1 1 200px; display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); font-weight:700; }
  .vs-rules select{ width:100%; }
  .vs-lives{ letter-spacing:1px; font-size:18px; }
  .vs-one.dead{ opacity:.45; text-decoration:line-through; }
  /* タイムアタック：打つ画面は 1 人用のまま。上に点数の並びだけ出す */
  body.vs-ta #vs-split{ display:none !important; }
  body.vs-ta #hamachi-life{ display:flex !important; }
  /* だれが何点かのメーター。先取は本数のマス、サバイバルはライフ、タイムアタックはいちばん点の多い人を満タンに */
  .vs-meters{ display:grid; gap:6px; max-width:560px; margin:0 auto; text-align:left; }
  .vs-meter{ display:grid; grid-template-columns:minmax(4.5em, 9em) 1fr auto; align-items:center; gap:10px; font-weight:700; }
  .vs-meter .vs-who{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .vs-track{ position:relative; height:16px; border-radius:999px; background:var(--track, #e5edf3); overflow:hidden; }
  .vs-fill{ position:absolute; inset:0 auto 0 0; border-radius:999px; background:currentColor; transition:width .45s cubic-bezier(.2,.8,.2,1); }
  .vs-track.seg::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(to right, transparent 0 calc(var(--seg) - 2px), var(--card, #fff) calc(var(--seg) - 2px) var(--seg)); }
  .vs-meter .vs-val{ min-width:3.2em; text-align:right; font-variant-numeric:tabular-nums; font-size:18px; }
  .vs-meter.lead .vs-who::after{ content:' 👑'; }
  .vs-meter.dead{ opacity:.45; }
  .vs-meter.dead .vs-who{ text-decoration:line-through; }
  #vs-bar .vs-meters{ margin-bottom:2px; }
  .vs-point-card .vs-meters, .vs-result .vs-meters{ margin:10px auto; }
  .vs-result .vs-meter .vs-val{ font-size:22px; }
  .vs-next{ margin:14px auto 0; padding:12px; border:1px dashed var(--line); border-radius:12px; max-width:420px; }
  .vs-next p{ margin:0 0 8px; font-size:13px; color:var(--muted); }
  .vs-next .vs-join{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:stretch; }
  .vs-next .vs-join input{ width:8em; min-height:48px; padding:8px 10px; font:inherit; font-size:18px; text-align:center; letter-spacing:.2em;
    border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--text); }
  .vs-next .vs-join input:focus{ outline:none; border-color:var(--accent); }
  .vs-next .vs-join .button.menu-opt{ display:inline-flex; width:auto; min-height:48px; margin:0; padding:8px 18px; font-size:1rem; }
  .vs-result{ text-align:center; }
  .vs-result .vs-big{ font-size:34px; font-weight:bold; margin:4px 0 10px; }
  .vs-result .vs-final{ font-size:30px; font-weight:bold; margin:0 0 10px; font-variant-numeric:tabular-nums; }
  body.vs-on #save-score, body.vs-on #game-end .form-row{ display:none; }
  body.vs-on #game-end .menu-footer .vs-hide{ display:none; }
</style>

<div id="menu-vs" class="menu" style="display:none;">
  <div class="menu-title" id="vs-title">対戦</div>
  <div class="menu-content">
    <div class="vs-actions" id="vs-actions">
      <div class="vs-rules">
        <label class="vs-target"><span>ルール</span>
          <select id="vs-rule" class="menu-opt">
            <option value="first">先取</option>
            <option value="survival">サバイバル</option>
            <option value="time">タイムアタック</option>
          </select>
        </label>
        <label class="vs-target"><span id="vs-target-label">本数</span>
          <select id="vs-target" class="menu-opt"></select>
        </label>
      </div>
      <button class="button menu-opt" id="vs-match">だれかと対戦（自動マッチ）</button>
      <button class="button menu-opt" id="vs-create">部屋を作る（友達と対戦）</button>
      <div class="vs-join">
        <input id="vs-code" class="menu-opt" inputmode="numeric" maxlength="5" placeholder="部屋番号" autocomplete="off">
        <button class="button menu-opt" id="vs-join">入る</button>

      <p class="vs-rule" id="vs-rule-text"></p>

<script>
// ===============================================================
// StudyVersus.html
// タイピングの対戦。サーバー（cloudflare/src/typing-versus.js）と WebSocket でつなぐ。
//   ・2〜4 人で同じ問題を同時に打ち、いちばん先に打ち終えた人が 1 本
//   ・1 問 10 ミス（極みモードは 5 ミス）でその問題は打てなくなる
//   ・1 本ごとに結果を見せてから次の問題（次へ進む合図はサーバーが出す）
//   ・先に target 本取った人の勝ち
// 打つ画面・判定は 1 人用（HAMACHI-TYPE）のまま。ここでは
//   ・出題を決まった問題にする（vsNextCard）
//   ・打った様子・ミス・打ち終わりを送る（onType / onMiss / afterCard）
//   ・入力欄の横に相手の入力を出す
// だけを差し替える。
// ===============================================================
(function (window, document) {
  // 1 問で打てなくなるミスの数。極みモードは厳しく 5 回
  const missLimit = () => (mode === '極みモード' ? 5 : 10);
  const h = window.hamachi;
  const $ = id => document.getElementById(id);
  // ルールごとの選べる数と説明（サーバーの RULES と合わせる）
  const RULES = {
    first:    { name: '先取', unit: v => v + '本先取', label: '本数', targets: [3, 5, 7, 10], def: 5,
                text: '2〜4 人で同じ問題を同時に打ちます。いちばん先に打ち終えた人が 1 本。1 問で 10 回（極みは 5 回）ミスすると、その問題はもう打てません。先に決めた本数を取った人の勝ち。' },
    survival: { name: 'サバイバル', unit: v => 'ライフ' + v, label: 'ライフ', targets: [1, 3, 5], def: 3,
                text: '1 問ごとに、先に打ち終えた人以外はライフが 1 減ります（だれも取れなければ全員 −1）。ライフが 0 になったら脱落。最後まで残った人の勝ち。' },
    time:     { name: 'タイムアタック', unit: v => v + '秒タイムアタック', label: '持ち時間', targets: [60, 90, 120], def: 90,
                text: '全員が同じ問題を同じ順に、1 人用と同じタイム制で打ちます（正解で +秒・ミスで −秒）。ほかの人の点数はその場で見えます。時間が終わったとき点数の多い人の勝ち。' },
  };
  const ruleName = () => RULES[rule].unit(target);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let ws = null, mode = '', seat = 0, target = 5, names = {}, rule = 'first', lives = {}, taScores = {}, taFin = {};
  let questions = [], r = 0, scores = {}, cardMiss = 0, out = false, progTimer = null, lastProgAt = 0, opp = {};
  let vsLog = [];   // ふりかえり用：{ r, card, who }
  let host = 0, auto = false, playersNow = [], startInTimer = null;

  // ---- メニュー --------------------------------------------------------
  function status(html) { $('vs-status').innerHTML = html; }
  function showActions(on) {
    $('vs-actions').style.display = on ? '' : 'none';
    if (on) { $('vs-lobby').hidden = true; if (startInTimer) { clearInterval(startInTimer); startInTimer = null; } }
  }

  // m が無いときは「部屋番号で入る」だけ（問題集とモードは部屋を作った人に合わせる）
  function openVersus(m) {
    mode = m || '';
    $('vs-title').textContent = m ? '対戦（' + (h.levelLabel ? h.levelLabel(m) : m.replace('モード', '')) + '）' : '部屋番号で対戦に入る';
    ['menu-main', 'menu-mode', 'menu-about'].forEach(id => { const el = $(id); if (el) el.style.display = 'none'; });
    $('menu-vs').style.display = 'block';
    $('menu-vs').classList.toggle('join-only', !m);
    showActions(true);
    status('');
    if (h.enableMenuNav) h.enableMenuNav($('menu-vs'));
    if (!m) $('vs-code').focus();
  }
  h.openVersusJoin = () => openVersus(null);
  h.openVersus = m => openVersus(m);   // プレイ設定（PlaySetup.html）の「⚔ 対戦」から

  function backToModes() {
    closeWs();
    $('menu-vs').style.display = 'none';
    h.showMenu(mode ? 'mode' : 'main', null);
  }

  // モードごとに枠を作り、「個人」（元のボタン）と「対戦」を並べる
  document.querySelectorAll('#mode-list .hamachi-mode-opt').forEach(btn => {
    const m = (btn.getAttribute('onclick') || '').match(/startGame\('([^']+)'\)/);
    if (!m) return;
    const li = btn.parentNode;
    li.className = 'mode-box';
    const name = document.createElement('div');
    name.className = 'mode-name';
    name.textContent = btn.textContent.trim();
    const row = document.createElement('div');
    row.className = 'mode-btns';
    btn.textContent = '個人';
    const vs = document.createElement('button');
    vs.className = 'button menu-opt vs-open';
    vs.textContent = '⚔ 対戦';
    vs.onclick = () => openVersus(m[1]);
    row.append(btn, vs);
    li.append(name, row);
  });

  function fillTargets() {
    const R = RULES[$('vs-rule').value] || RULES.first;
    $('vs-target-label').textContent = R.label;
    $('vs-target').innerHTML = R.targets.map(v => `<option value="${v}"${v === R.def ? ' selected' : ''}>${R.unit(v)}</option>`).join('');
    $('vs-rule-text').textContent = R.text + ' 部屋に入る人の問題集・モード・ルールは、部屋を作った人に合わせます。';
  }
  $('vs-rule').addEventListener('change', fillTargets);
  fillTargets();

  // ---- 対戦中の画面 ----------------------------------------------------
  // 本数（ゲーム画面の上）
  const bar = document.createElement('div');
  bar.id = 'vs-bar';
  const game = $('game');
  if (game) game.insertBefore(bar, game.firstChild);

  // 自分以外の席（席番号の順）と、その色
  const others = () => Object.keys(names).map(Number).filter(s => s !== seat).sort((a, b) => a - b);
  const colorOf = s => s === seat ? 'vs-me' : 'vs-c' + (others().indexOf(s) + 1);
  const nameOf = s => s === seat ? 'あなた' : (names[s] || '相手');

  // サバイバルはライフ（♥）、タイムアタックは点数、先取は本数
  const hearts = n => '♥'.repeat(Math.max(0, n)) + '♡'.repeat(Math.max(0, target - n));
  function scoreLine(sc, lv) {
    return [seat, ...others()].map(s => {
      const dead = rule === 'survival' && lv && !lv[s];
      const val = rule === 'survival' && lv ? `<span class="vs-lives">${hearts(lv[s] || 0)}</span>`
        : `<span class="vs-pts">${(sc[s] || 0).toLocaleString()}</span>`;
      return `<span class="vs-one ${colorOf(s)}${dead ? ' dead' : ''}"><span class="vs-who">${esc(nameOf(s))}</span>${val}</span>`;
    }).join('');
  }

  // メーター：先取は target 本、サバイバルはライフ、タイムアタックはいちばん多い点を 100% にする
  function scoreMeters(sc, lv) {
    const seats = [seat, ...others()];
    const val = s => rule === 'survival' && lv ? (lv[s] || 0) : (sc[s] || 0);
    const max = rule === 'time' ? Math.max(1, ...seats.map(val)) : target;
    const best = Math.max(...seats.map(val));
    const seg = rule === 'time' ? '' : ` seg" style="--seg:${100 / target}%`;
    return `<div class="vs-meters">${seats.map(s => {
      const v = val(s), dead = rule === 'survival' && lv && !lv[s];
      const shown = rule === 'survival' ? hearts(v) : rule === 'time' ? v.toLocaleString() : v + '/' + target;
      return `<div class="vs-meter ${colorOf(s)}${dead ? ' dead' : ''}${v === best && v > 0 && seats.length > 1 ? ' lead' : ''}">
        <span class="vs-who">${esc(nameOf(s))}</span>
        <span class="vs-track${seg}"><span class="vs-fill" style="width:${Math.min(100, v / max * 100)}%"></span></span>
        <span class="vs-val">${shown}</span></div>`;
    }).join('')}</div>`;
  }

  function renderBar() {
    if (rule === 'time') {
      bar.innerHTML = `${scoreMeters(Object.assign({}, taScores, { [seat]: h.stats ? h.stats.score : 0 }))}
        <div class="vs-sub">${ruleName()}${Object.keys(taFin).length ? ' ・ 打ち終えた人 ' + Object.keys(taFin).length : ''}</div>`;
      return;
    }
    bar.innerHTML = `${scoreMeters(scores, lives)}
      <div class="vs-sub">${ruleName()} ・ ${r + 1}問目${questions[r] && questions[r].level ? ' ・ Lv' + questions[r].level : ''}</div>`;
  }
  const iAmOut = () => rule === 'survival' && lives && lives[seat] === 0;

  // 入力欄を左右に分ける：左が自分（今の入力欄をそのまま入れる）、右が相手
  const split = document.createElement('div');
  split.id = 'vs-split';
  split.innerHTML = `
    <div class="vs-panel me" id="vs-me">
      <div class="vs-head"><b>あなた</b><span class="vs-miss" id="vs-me-miss"></span></div>
      <div class="vs-kana" id="vs-me-kana"></div>
      <div id="vs-me-input"></div>
      <div class="vs-state" id="vs-me-state"></div>
    </div>
    `;
  const inputZone = $('input-zone'), gameInput = $('game-input');
  if (inputZone && gameInput) inputZone.insertBefore(split, gameInput);

  // 相手の数だけ入力の様子を出す枠を作る（試合の始まりに作り直す）
  function buildOppPanels() {
    split.querySelectorAll('.vs-panel.you').forEach(el => el.remove());
    others().forEach(s => {
      const el = document.createElement('div');
      el.className = 'vs-panel you ' + colorOf(s);
      el.dataset.seat = s;
      el.innerHTML = `<div class="vs-head"><b>${esc(nameOf(s))}</b><span class="vs-miss"></span></div>
        <div class="vs-kana"></div><div class="vs-typed"></div><div class="vs-state"></div>`;
      split.appendChild(el);
    });
    const n = others().length + 1;
    split.style.setProperty('--vs-n', n);
    split.classList.toggle('n4', n >= 4);
  }

  function placeInput(inSplit) {
    if (!gameInput) return;
    if (inSplit) $('vs-me-input').appendChild(gameInput);
    else inputZone.insertBefore(gameInput, split.nextSibling);
  }

  // まだ打っていないところは「・」にする（写経モードは答えを見て打つので、そのまま出す）
  function kanaHtml(chunks, done) {
    if (mode !== '写経モード') return chunks.map((c, i) => i < done ? `<span class="d">${esc(c)}</span>` : '<span class="r">・</span>').join('');
    return chunks.map((c, i) => `<span class="${i < done ? 'd' : 'r'}">${esc(c)}</span>`).join('');
  }

  function renderMe() {
    const t = h.typedSoFar ? h.typedSoFar() : { done: 0 };
    const q = questions[r];
    $('vs-me-kana').innerHTML = q ? kanaHtml(h.chunksOf(q.ans), t.done) : '';
    const mm = $('vs-me-miss');
    const lim = missLimit();
    mm.textContent = `ミス ${cardMiss}/${lim}`;
    mm.className = 'vs-miss' + (cardMiss >= lim - 2 ? ' warn' : '');
    $('vs-me').classList.toggle('out', out);
    $('vs-me-state').textContent = iAmOut() ? '脱落しました（最後まで見られます）' : out
      ? (cardMiss >= lim ? lim + 'ミス：この問題はもう打てません' : '時間切れ') + '（相手を待っています）' : '';
  }

  function renderYou(s) {
    const el = split.querySelector(`.vs-panel.you[data-seat="${s}"]`);
    if (!el) return;
    const m = opp[s], q = questions[r];
    el.querySelector('.vs-kana').innerHTML = q ? kanaHtml(h.chunksOf(q.ans), m ? (m.done || 0) : 0) : '';
    el.querySelector('.vs-typed').textContent = m && m.typed ? m.typed : '';
    const miss = m ? (m.miss || 0) : 0;
    const ym = el.querySelector('.vs-miss');
    ym.textContent = `ミス ${miss}/${missLimit()}`;
    ym.className = 'vs-miss' + (miss >= missLimit() - 2 ? ' warn' : '');
    const o = !!(m && m.out);
    el.classList.toggle('out', o);
    el.querySelector('.vs-state').textContent = o ? 'この問題はもう打てません' : (names[s] ? '' : '抜けました');
  }
  const renderOpps = () => others().forEach(renderYou);

  // 1 本ごとの結果
  function showPoint(m) {
    const q = questions[m.r] || {};
    const cls = m.seat == null ? '' : colorOf(m.seat);
    const title = m.seat == null ? 'だれも取れず'
      : m.seat === seat ? 'あなたが 1 本！' : esc(nameOf(m.seat)) + ' が 1 本';
    const outNow = rule === 'survival' && m.lives ? Object.keys(m.lives).map(Number).filter(s => !m.lives[s] && lives[s]) : [];
    $('vs-point-card').innerHTML = `
      <div class="vs-point-big ${cls}">${title}</div>
      <div class="vs-point-ans">${esc(q.kan)}</div>
      ${q.note ? `<div class="vs-point-note">${esc(q.note)}</div>` : ''}
      ${outNow.length ? `<div class="vs-point-note">${outNow.map(s => esc(nameOf(s))).join('・')} が脱落</div>` : ''}
      <div class="vs-point-score">${scoreMeters(m.scores, m.lives)}</div>
      <div class="vs-point-next">${m.final ? '決着！' : '次の問題へ…'}</div>`;
    $('vs-point').classList.add('show');
  }
  function hidePoint() { $('vs-point').classList.remove('show'); }

  // ---- 通信 ------------------------------------------------------------
  function closeWs() {
    if (ws) { const w = ws; ws = null; try { w.close(); } catch (e) {} }
  }

  function connect(params) {
    closeWs();
    const sock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host +
      '/vs/ws?' + new URLSearchParams(params).toString());
    ws = sock;
    sock.onmessage = ev => {
      if (ws !== sock) return;
      const m = JSON.parse(ev.data);
      if (m.t === 'error') sock.gotError = true;
      onMessage(m, params);
    };
    sock.onclose = () => {
      if (ws !== sock) return;
      ws = null;
      // サーバーが理由を伝えてから閉じたときは、その理由を残す
      if (!sock.gotError) status('通信が切れました。もう一度お試しください');
      showActions(true);
    };
  }

  const send = msg => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); };

  function sendProg() {
    progTimer = null; lastProgAt = Date.now();
    const t = h.typedSoFar();
    send({ t: 'prog', r, done: t.done, total: t.total, typed: t.typed, miss: cardMiss });
  }
  // 打つたびに送る（速く打っても送りすぎないよう、60ms にまとめる）
  function queueProg() {
    if (progTimer) return;
    progTimer = setTimeout(sendProg, Math.max(0, 60 - (Date.now() - lastProgAt)));
  }

  function onMessage(m, params) {
    if (m.t === 'error') {
      if (m.message === 'busy') { connect(Object.assign({}, params)); return; }   // 番号がかぶったら作り直す
      status(esc(m.message)); showActions(true); return;
    }
    if (m.t === 'matched') {
      status('相手が見つかりました！');
      // 見つかった全員が同じ番号の部屋に入る（自動マッチの部屋は、少し待ってほかの人も入れる）
      connect({ code: m.code, kbn: m.kbn, mode: m.mode, rule: m.rule, target: m.target, auto: 1 });
      return;
    }
    if (m.t === 'room') {
      // 問題集・モード・本数は部屋に合わせる（番号で入った人も同じ条件で遊ぶ）
      seat = m.seat; target = m.target; mode = m.mode; h.kubun = m.kbn; rule = RULES[m.rule] ? m.rule : 'first';
      $('vs-title').textContent = '対戦（' + (h.catLabel ? h.catLabel(m.kbn) : m.kbn) + '・' + (h.levelLabel ? h.levelLabel(m.mode) : m.mode.replace('モード', '')) + '・' + RULES[rule].name + '）';
      if (params.auto || String(m.code).length > 4) status('相手が見つかりました');
      else {
        // 招待リンク：開くとそのまま待合室に入る（ログインしていなくても入れる）
        const link = location.origin + location.pathname + '?p=' + encodeURIComponent(new URLSearchParams(location.search).get('p') || 'it') + '&join=' + m.code;
        status(`部屋番号<span class="vs-code">${esc(m.code)}</span>
          <span class="vs-invite"><input id="vs-link" readonly value="${esc(link)}" aria-label="招待リンク">
          <button type="button" class="button menu-opt" id="vs-copy">🔗 招待リンクをコピー</button>
          ${navigator.share ? '<button type="button" class="button menu-opt" id="vs-share">📤 送る（LINE など）</button>' : ''}</span>
          このリンクを友達に送ると、開くだけでこの部屋の待合室に入れます。番号を「入る」から入れても OK です（${ruleName()}・4人まで）`);
        const copy = $('vs-copy'), share = $('vs-share');
        copy.onclick = () => {
          const done = () => { copy.textContent = '✓ コピーしました'; setTimeout(() => { copy.textContent = '🔗 招待リンクをコピー'; }, 2000); };
          if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => { $('vs-link').select(); document.execCommand('copy'); done(); });
          else { $('vs-link').select(); document.execCommand('copy'); done(); }
        };
        if (share) share.onclick = () => navigator.share({ title: 'Study Type で対戦しよう', text: `Study Type の対戦に招待します（部屋番号 ${m.code}）`, url: link }).catch(() => {});
        if (h.enableMenuNav) h.enableMenuNav($('menu-vs'));
      }
      return;
    }
    if (m.t === 'players') {
      playersNow = m.players; host = m.host; auto = m.auto;
      // 試合中に抜けた人は names から消して「抜けました」を出す
      names = Object.fromEntries(m.players.map(p => [p.seat, p.name]));
      if (h.versusMode || h.vsTA) { renderOpps(); renderBar(); }
      else renderLobby(m);
      if (m.left && !h.versusMode && !h.vsTA) status(esc(m.left) + ' さんが抜けました');
      const again = $('vs-again');
      if (again) {
        const ready = m.players.filter(p => p.again).length;
        if (!again.disabled) again.textContent = `もう一度（準備OK ${ready}/${m.players.length}）`;
        else again.textContent = `ほかの人を待っています…（準備OK ${ready}/${m.players.length}）`;
      }
      return;
    }
    if (m.t === 'start') { startMatch(m); return; }
    if (m.t === 'more') { questions.push(...m.questions); return; }
    // 相手の様子は、届いた分だけ前の様子に重ねる（「打てない」の知らせには進み具合が入っていない）
    if (m.t === 'opp') { if (m.r === r) { opp[m.seat] = Object.assign({}, opp[m.seat], m); renderYou(m.seat); } return; }
    if (m.t === 'point') { onPoint(m); return; }
    if (m.t === 'tas') { taScores[m.seat] = m.score; if (m.fin) taFin[m.seat] = true; renderBar(); return; }
    if (m.t === 'round') { nextRound(m.r); return; }
    if (m.t === 'end') { endMatch(m); return; }
  }

  // 待合：参加者の一覧と「この人数で始める」
  function renderLobby(m) {
    const box = $('vs-lobby');
    box.hidden = false;
    $('vs-lobby-count').textContent = `参加者 ${m.players.length}/${m.max || 4} 人`;
    $('vs-lobby-list').innerHTML = m.players.map(p =>
      `<li class="${p.seat === m.host && !m.auto ? 'host' : ''}">${p.seat === seat ? 'あなた' : esc(p.name)}</li>`).join('');
    const canBegin = m.players.length >= 2 && (m.auto || m.host === seat);
    $('vs-begin').hidden = !canBegin;
    if (startInTimer) { clearInterval(startInTimer); startInTimer = null; }
    const note = $('vs-lobby-note');
    if (m.auto && m.startIn) {
      const until = Date.now() + m.startIn;
      const tick = () => { note.textContent = `ほかの人を待っています。あと ${Math.max(0, Math.ceil((until - Date.now()) / 1000))} 秒で始まります`; };
      tick(); startInTimer = setInterval(tick, 1000);
    } else if (!m.auto) {
      note.textContent = m.players.length < 2 ? '友達が入るのを待っています'
        : m.host === seat ? '4人そろうか「この人数で始める」を押すと始まります' : '部屋を作った人が始めるのを待っています';
    } else note.textContent = '';
    if (canBegin && h.enableMenuNav) h.enableMenuNav($('menu-vs'));
  }

  // ---- 試合の流れ --------------------------------------------------------
  function resetCard() {
    cardMiss = 0; out = iAmOut(); opp = {};
    renderMe(); renderOpps(); renderBar();
  }

  function startMatch(m) {
    questions = m.questions.slice(); r = 0; target = m.target; rule = RULES[m.rule] ? m.rule : rule;
    scores = {}; vsLog = []; lives = m.lives || {}; taScores = {}; taFin = {};
    if (rule === 'time') return startTimeAttack(m);
    if (startInTimer) { clearInterval(startInTimer); startInTimer = null; }
    $('vs-lobby').hidden = true;
    buildOppPanels();
    h.versusMode = true;
    h.levelMode = false;
    document.body.classList.add('vs-on');
    placeInput(true);
    hidePoint();
    $('menu-vs').style.display = 'none';
    $('game-end').style.display = 'none';
    resetCard();
    // 画面のカウントダウン（約 3 秒）が終わるころにサーバーも受付を始める
    setTimeout(() => {
      h.startGame(mode);
      // 対戦では答えを全部見せるヒントは出さない（全員に同時に見えて勝負にならない）。最初の 1 文字のヒントは残す
      if (mode !== '写経モード' && h.cfg) h.cfg = Object.assign({}, h.cfg, { hint2At: -1 });
    }, Math.max(0, (m.in || 3500) - 3200));
  }

  function stopTyping() {
    if (h.timerInterval) { clearInterval(h.timerInterval); h.timerInterval = null; }
    h.awaitingNext = true;
  }

  function onPoint(m) {
    stopTyping();
    if (progTimer) { clearTimeout(progTimer); progTimer = null; }
    scores = m.scores;
    showPoint(m);   // 脱落を出すため、ライフを書き換える前に
    if (m.lives) lives = m.lives;
    // ふりかえり用：だれが取ったか（seat が null ならだれも取らず）
    if (questions[m.r] && !vsLog.some(x => x.r === m.r)) vsLog.push({ r: m.r, card: questions[m.r], who: m.seat });
    renderBar();
    $('vs-point-card').querySelector('.vs-point-score').innerHTML = scoreMeters(m.scores, m.lives);
  }

  function nextRound(n) {
    hidePoint();
    r = n;
    resetCard();
    h.awaitingNext = false;
    h.nextCard();
    if (iAmOut()) stopTyping();   // 脱落した人は見るだけ
    renderMe();
  }

  function endMatch(m) {
    stopTyping();
    hidePoint();
    h.playing = false;
    scores = m.scores;
    if (m.lives) lives = m.lives;
    const win = m.winner === seat;
    // 順位（サバイバルは残ったライフ、ほかは本数・点数の多い順）
    const key = s => rule === 'survival' ? (lives[s] || 0) * 1000 + (scores[s] || 0) : (scores[s] || 0);
    const order = Object.keys(scores).map(Number).sort((a, b) => key(b) - key(a));
    const place = 1 + order.filter(s => key(s) > key(seat)).length;
    const taWasOn = !!h.vsTA;
    if (taWasOn) { h.vsTA = null; document.body.classList.remove('vs-ta', 'ps-on', 'ps-low'); }
    document.body.classList.add('vs-on');
    const marker = $('screen-game');
    if (marker) marker.hidden = true;
    $('game').style.display = 'none';
    $('game-end').style.display = '';
    $('game-win').style.display = win ? 'block' : 'none';
    $('game-over').style.display = win ? 'none' : 'block';
    $('game-win').textContent = 'あなたの勝ち！';
    $('game-over').textContent = m.winner == null ? '引き分け' : '負け…';
    $('game-end-stats').innerHTML = `<div class="vs-result">
      <div class="vs-big">${win ? '勝ち！' : m.winner == null ? '引き分け' : order.length > 2 ? place + '位' : '負け'}</div>
      ${m.left && order.length < 2 ? '<p>ほかの人が抜けました</p>' : ''}
      ${scoreMeters(scores, lives)}
      <p class="vs-sub">${ruleName()}</p>
      ${order.length >= 2 ? '<p><button class="button menu-opt" id="vs-again">もう一度（同じメンバー）</button></p>' : ''}
      <div class="vs-next">
        <p>ほかの部屋で続ける：友達から届いた部屋番号を入れるか、この問題集で新しい部屋を作れます</p>
        <div class="vs-join"><input id="vs-next-code" inputmode="numeric" maxlength="5" placeholder="部屋番号" autocomplete="off" aria-label="部屋番号">
          <button type="button" class="button menu-opt" id="vs-next-join">入る</button>
          <button type="button" class="button menu-opt" id="vs-next-create">新しい部屋を作る</button></div>
      </div>
    </div>`;
    const again = $('vs-again');
    if (again) again.onclick = () => { send({ t: 'again' }); again.textContent = 'ほかの人を待っています…'; again.disabled = true; };
    // 結果の画面から、そのままほかの部屋に入る・新しい部屋を作る（トップまで戻らなくていいように）
    const leaveTo = then => { const m0 = mode; h.resetGame(); then(m0); };
    $('vs-next-join').onclick = () => {
      const code = $('vs-next-code').value.replace(/\D/g, '');
      if (code.length < 4) { $('vs-next-code').focus(); return; }
      leaveTo(() => { openVersus(null); $('vs-code').value = code; $('vs-join').click(); });
    };
    $('vs-next-code').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('vs-next-join').click(); } });
    $('vs-next-create').onclick = () => leaveTo(m0 => openVersus(m0));
    document.querySelectorAll('#game-end .menu-footer button').forEach(b => {
      if (/Retry|もう一度（同じ設定/.test(b.textContent)) b.classList.add('vs-hide');
    });
    // ふりかえり：1 本ずつ、自分が取った ○ / 相手が取った × / だれも取らず △
    if (window.stReview && h.reviewItems && !taWasOn) {   // タイムアタックは 1 人用のふりかえりをそのまま残す
      let box = document.getElementById('st-review-box');
      const content = document.querySelector('#game-end .menu-content');
      if (!box && content) { box = document.createElement('div'); box.id = 'st-review-box'; content.appendChild(box); }
      const items = h.reviewItems(vsLog.map(x => ({ card: x.card, mark: x.who === seat ? 'ok' : x.who == null ? 'mid' : 'ng' })));
      items.forEach((it, i) => {
        const who = vsLog[i].who;
        it.sub = (who === seat ? 'あなたが取った' : who == null ? 'だれも取らず' : nameOf(who) + ' さんが取った') + (it.sub ? '　' + it.sub : '');
      });
      window.stReview.render(box, items, { kind: 'typing', count: false });   // 対戦は数えない（マークだけ）
    }
    // キーボードでも「もう一度」「メニューに戻る」を選べるように
    if (h.enableMenuNav) h.enableMenuNav($('game-end'));
  }

  // ---- タイムアタック -----------------------------------------------------
  // 打つ画面は 1 人用（PlaySetup.html のタイム制）そのまま。問題だけ部屋の問題に差し替え、点数を送り合う
  function startTimeAttack(m) {
    if (startInTimer) { clearInterval(startInTimer); startInTimer = null; }
    $('vs-lobby').hidden = true;
    h.versusMode = false;
    h.levelMode = false;
    h.vsTA = { seconds: target };
    h.mode['m' + h.kubun] = questions;
    document.body.classList.add('vs-on', 'vs-ta');
    placeInput(false);
    hidePoint();
    $('menu-vs').style.display = 'none';
    $('game-end').style.display = 'none';
    renderBar();
    setTimeout(() => h.startGame(mode), Math.max(0, (m.in || 3500) - 3200));
  }
  let taLast = 0;
  h.onTAScore = (score, correct, fin) => {
    if (!h.vsTA) return;
    renderBar();
    // 打つたびに送りすぎないよう 300ms にまとめる（終わりは必ず送る）
    if (!fin && Date.now() - taLast < 300) return;
    taLast = Date.now();
    send({ t: 'ta', score, correct, fin: !!fin });
    if (fin) {
      taFin[seat] = true;
      const st = $('game-end-stats');
      if (st && ws) st.insertAdjacentHTML('afterbegin', '<p class="vs-sub" id="vs-ta-wait">ほかの人が終わるのを待っています…</p>');
    }
  };

  // ---- 1 人用の画面への差し込み ------------------------------------------
  Object.assign(h, {
    versusMode: false,
    vsPrepare() { renderBar(); },
    vsNextCard() { return questions[r] || null; },
    vsLocalDone() {},
    onType() { if (this.versusMode && !out) { renderMe(); queueProg(); } },
    onMiss() {
      if (out) return;
      cardMiss++;
      renderMe();
      queueProg();
      if (cardMiss >= missLimit()) {
        out = true;
        stopTyping();
        renderMe();
        send({ t: 'out', r, miss: cardMiss });
      }
    }
  });

  // 1 問終わったとき：打ち終えたら 1 本を取りに行く、時間切れならこの問題は打てない
  const baseAfterCard = h.afterCard;
  h.afterCard = function (ok, jm) {
    if (!this.versusMode) { if (baseAfterCard) baseAfterCard.call(this, ok, jm); return; }
    if (progTimer) { clearTimeout(progTimer); progTimer = null; }
    if (ok) { sendProg(); send({ t: 'win', r }); }
    else if (!out) { out = true; renderMe(); send({ t: 'out', r, miss: cardMiss }); }
  };

  // メニューに戻るときは対戦をやめる
  const baseReset = h.resetGame;
  h.resetGame = function () {
    if (this.vsTA) { this.vsTA = null; document.body.classList.remove('vs-on', 'vs-ta'); closeWs(); }
    if (this.versusMode) {
      this.versusMode = false;
      document.body.classList.remove('vs-on');
      placeInput(false);
      hidePoint();
      closeWs();
      $('game-win').textContent = 'クリア！';
      $('game-over').textContent = 'ゲームオーバー';
    }
    return baseReset.apply(this, arguments);
  };

  // ---- ボタン ------------------------------------------------------------
  const tgt = () => $('vs-target').value;
  const rl = () => $('vs-rule').value;
  $('vs-back').onclick = backToModes;
  $('vs-match').onclick = () => {
    showActions(false);
    status(`相手を探しています…（同じ問題集・同じモード・${RULES[rl()].unit(tgt())}を選んだ人と組みます。2人そろうと、最大1分ほかの人を待ちます）`);
    connect({ match: 1, kbn: h.kubun, mode, rule: rl(), target: tgt() });
  };
  $('vs-create').onclick = () => {
    showActions(false);
    status('部屋を作っています…');
    connect({ create: 1, kbn: h.kubun, mode, rule: rl(), target: tgt() });
  };
  // 部屋番号の欄で Enter を押したら入る。欄の上下キーでボタンへ移れるように
  $('vs-code').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('vs-join').click(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); $('vs-join').focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); (mode ? $('vs-create') : $('vs-back')).focus(); }
  });
  $('vs-target').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && !e.altKey) { e.preventDefault(); $('vs-match').focus(); }
  });

  $('vs-begin').onclick = () => { send({ t: 'begin' }); $('vs-begin').hidden = true; };

  // メインメニューに「部屋番号で対戦に入る」を足す
  const mainContent = document.querySelector('#menu-main .menu-content');
  const about = mainContent && mainContent.querySelector('[onclick*="about"]');
  if (about) {
    const jb = document.createElement('button');
    jb.className = 'button menu-opt';
    jb.textContent = '⚔ 部屋番号で対戦に入る';
    jb.onclick = () => openVersus(null);
    about.parentNode.insertBefore(jb, about);
  }

  // トップページなどから ?join=1234 で来たら、そのまま入る
  const joinCode = new URLSearchParams(location.search).get('join');
  if (joinCode && /^\d{4,5}$/.test(joinCode)) {
    window.addEventListener('load', () => {
      openVersus(null);
      $('vs-code').value = joinCode;
      $('vs-join').click();
    });
  }

  $('vs-join').onclick = () => {
    const code = $('vs-code').value.replace(/\D/g, '');
    if (code.length < 4) { status('4 桁の部屋番号を入れてください'); return; }
    showActions(false);
    status('入っています…');
    connect({ code });
  };
}(window, document));
</script>
