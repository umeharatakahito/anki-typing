<style>
  /* 問題の図（英単語・古文・歴史の 1 人用画面） */
  .q-fig{ display:flex; justify-content:center; margin:6px 0 4px; }
  .q-fig[hidden]{ display:none; }
  .q-fig img{ max-width:min(100%, 420px); max-height:220px; object-fit:contain; border-radius:8px;
    background:#fff; border:1px solid var(--line); padding:4px; }
  @media (max-width:600px){ .q-fig img{ max-height:140px; } }
  body.kb-open .q-fig img{ max-height:120px; }
</style>
<script>
// ===============================================================
// JukenFigure.html
// 大学受験モードの 1 人用画面（英単語・古文・歴史）で、出題中の語に図があれば問題文の上に出す。
// 図はサーバーが語に付けて送ってくる（w.img。Cloudflare 版の worker.js / data/figures-juken*.json）。
// 各画面の出題処理には手を入れず、問題文（#prompt）が書き換わるのを見て、今の語の図に差し替える。
// ===============================================================
(function (document) {
  const prompt = document.getElementById('prompt');
  if (!prompt) return;
  const box = document.createElement('div');
  box.className = 'q-fig';
  box.hidden = true;
  const img = document.createElement('img');
  img.alt = '問題の図';
  box.appendChild(img);
  prompt.parentNode.insertBefore(box, prompt);

  const game = () => window.juken || window.kobun || window.rekishi || null;
  function sync() {
    const g = game();
    const w = g && g.words && g.words[g.index];
    const src = w && w.img;
    if (!src) { box.hidden = true; img.removeAttribute('src'); return; }
    if (img.getAttribute('src') !== src) img.src = src;
    box.hidden = false;
  }
  new MutationObserver(sync).observe(prompt, { childList: true, characterData: true, subtree: true });

  // 「⚑ この問題を報告」：窓を開いている間は入力とタイマーを止める
  const rb = document.createElement('button');
  rb.type = 'button';
  rb.className = 'st-report-btn';
  rb.textContent = '⚑ この問題を報告';
  rb.style.margin = '10px auto 0';
  rb.style.display = 'flex';
  const stage = prompt.closest('.stage') || prompt.parentNode;
  stage.appendChild(rb);
  rb.onclick = () => {
    const g = game();
    const w = g && g.words && g.words[g.index];
    if (!w || !window.stReport) return;
    const subject = window.juken ? 'eigo' : window.kobun ? 'kobun' : 'rekishi';
    const info = subject === 'eigo'
      ? { kind: 'juken', kbn: 'eigo', qid: w.en, que: w.ja + (w.ex ? '\n' + w.ex : ''), kan: w.en, ans: w.kana || '' }
      : subject === 'kobun'
        ? { kind: 'juken', kbn: 'kobun', qid: String(w.no) + ' ' + w.ko, que: w.ja + (w.ex ? '\n' + w.ex : ''), kan: w.ko, ans: w.kana || w.ko }
        : { kind: 'juken', kbn: 'rekishi', qid: String(w.no), que: w.q, kan: w.a, ans: w.kana || '' };
    const wasLocked = g.locked;
    g.locked = true;
    if (!wasLocked && g.stopTimer) g.stopTimer();
    window.stReport(info, () => {
      g.locked = wasLocked;
      if (!wasLocked && g.playing && g.startTimer) g.startTimer();
    });
  };

  // Esc：遊んでいる途中なら「やめる」（メニューへ）。窓が開いているときは窓を閉じるだけ
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || document.querySelector('dialog[open]')) return;
    const g = game();
    if (g && g.playing && g.quit) { e.preventDefault(); g.quit(); }
  });
}(document));
</script>
