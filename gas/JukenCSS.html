<style>
  :root {
    --bg: #0f1724;
    --card: #182236;
    --line: #2a3651;
    --text: #e8eef7;
    --muted: #93a3bd;
    --accent: #3bc9db;
    --ok: #34d399;
    --ng: #f87171;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    min-height: 100%;
  }

  #app {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  .screen[hidden] { display: none; }

  .title {
    margin: 32px 0 4px;
    font-size: 2rem;
    letter-spacing: .08em;
    text-align: center;
  }
  .subtitle {
    margin: 0 0 32px;
    text-align: center;
    color: var(--muted);
    font-size: .95rem;
    letter-spacing: .12em;
  }

  /* ---- ボタン ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 24px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
    min-height: 48px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .15s, transform .08s;
  }
  .btn[hidden] { display: none; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }

  .btn-main {
    width: 100%;
    padding: 20px 24px;
    font-size: 1.25rem;
  }
  .btn .num {
    display: inline-grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #06202a;
    font-size: .95rem;
    font-weight: 700;
  }

  .menu-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 12px;
  }

  /* 別ページへ飛ぶ項目はリンクだが、見た目はボタンに揃える */
  .btn-versus,
  .btn-link { text-decoration: none; }

  /* まだ用意できていない科目につける印 */
  .btn .soon {
    margin-left: auto;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(147, 163, 189, .16);
    color: var(--muted);
    font-size: .72rem;
    letter-spacing: .08em;
  }

  /* 画面の左上に置く戻り導線 */
  .back-link {
    display: inline-block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: .85rem;
    text-decoration: none;
  }
  .back-link:hover { color: var(--accent); }

  .note {
    margin-top: 24px;
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
  }

  /* ---- 出題設定 ---- */
  .settings {
    margin-top: 22px;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    display: grid;
    gap: 14px;
  }
  .setting-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .setting-row label {
    color: var(--muted);
    font-size: .85rem;
    letter-spacing: .06em;
  }
  .setting-row label.ml { margin-left: auto; }
  .setting-row .tilde { color: var(--muted); }

  .settings input,
  .settings select {
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #101a2b;
    color: var(--text);
    font-family: inherit;
    /* iOS はフォント 16px 未満の入力欄にフォーカスすると画面を拡大するため下げない */
    font-size: 16px;
    min-height: 44px;
  }
  .settings input { width: 6.5em; }
  .settings input:focus,
  .settings select:focus { outline: none; border-color: var(--accent); }

  .setting-row .check {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    font-size: .9rem;
    cursor: pointer;
  }
  .setting-row .check input {
    width: 20px;
    height: 20px;
    min-height: 0;
    margin: 0;
    accent-color: var(--accent);
  }

  .hint {
    margin: 0;
    color: var(--muted);
    font-size: .8rem;
  }

  /* ---- ゲーム HUD ---- */
  .hud {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 4px 20px;
    border-bottom: 1px solid var(--line);
  }
  .hud-item { display: flex; align-items: baseline; gap: 8px; }
  .hud-label { color: var(--muted); font-size: .75rem; letter-spacing: .1em; }
  .hud-item span:last-child { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .btn-quit { margin-left: auto; padding: 8px 16px; font-size: .85rem; }

  .hud-item.score span:last-child { font-size: 1.35rem; color: var(--accent); }

  .hud-item.chain {
    gap: 4px;
    padding: 3px 12px;
    border-radius: 999px;
    background: rgba(251, 191, 36, .14);
    color: #fbbf24;
  }
  .hud-item.chain[hidden] { display: none; }
  .hud-item.chain #hud-chain { font-size: 1.15rem; font-weight: 700; }
  .chain-label { font-size: .7rem; letter-spacing: .08em; }

  /* 正解時に出る判定と獲得点 */
  .judge {
    margin-top: 10px;
    min-height: 2em;
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: .06em;
  }
  .judge .gain { margin-left: 12px; font-size: 1.05rem; font-weight: 400; color: var(--muted); }
  .judge.great { color: #fbbf24; }
  .judge.good  { color: var(--ok); }
  .judge.okay  { color: var(--accent); }

  /* ---- 残り時間バー ---- */
  .timer {
    height: 6px;
    margin-top: 14px;
    border-radius: 3px;
    background: #1d2942;
    overflow: hidden;
  }
  .timer-bar {
    height: 100%;
    width: 100%;
    background: var(--accent);
    transition: width .1s linear, background-color .3s;
  }
  .timer-bar.warn { background: #fbbf24; }
  .timer-bar.danger { background: var(--ng); }

  /* ---- 出題エリア ---- */
  .stage {
    padding: 40px 0 24px;
    text-align: center;
  }

  .phase-tag {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 999px;
    background: rgba(59, 201, 219, .12);
    color: var(--accent);
    font-size: .78rem;
    letter-spacing: .12em;
  }

  .prompt {
    margin: 28px 0 8px;
    font-size: 1.9rem;
    line-height: 1.5;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .prompt .blank {
    color: var(--accent);
    border-bottom: 3px solid var(--accent);
    padding: 0 .4em;
  }
  .prompt .filled {
    color: var(--ok);
    border-bottom: 3px solid var(--ok);
    padding: 0 .2em;
  }

  /* 第2問で文脈として添える英文・古文 */
  .context-en {
    display: block;
    margin-bottom: 6px;
    color: #7f8fab;
    font-size: 1rem;
  }
  /* 古文の例文中、出題語にあたる部分 */
  .context-en .target {
    color: var(--accent);
    border-bottom: 1px solid var(--accent);
  }

  .sub-prompt {
    color: var(--muted);
    font-size: .95rem;
    min-height: 1.4em;
  }

  .answer-line {
    margin: 32px 0 10px;
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 2.1rem;
    letter-spacing: .12em;
    word-break: break-all;
  }
  .answer-line .done { color: var(--ok); }
  .answer-line .rest { color: #46536e; }
  /* 写経やヒントで「読ませる」文字。伏せ字用の .rest と違い、本文と同じ明るさにする */
  .answer-line .show { color: var(--text); }
  .answer-line .reveal { color: var(--ng); }
  /* 残り時間が半分を切ってから頭出しされた部分 */
  .answer-line .peek { color: #fbbf24; opacity: .85; }

  .guide {
    color: var(--muted);
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 1.05rem;
    letter-spacing: .08em;
    min-height: 1.5em;
    word-break: break-all;
  }
  .guide .done { color: var(--accent); }

  .stage-actions {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .stage-actions .btn { padding: 10px 18px; font-size: .9rem; }

  /* ---- バナー ---- */
  .banner {
    margin-top: 18px;
    text-align: center;
    font-size: 1.15rem;
    min-height: 2.4em;
    line-height: 1.5;
  }
  .banner.ok { color: var(--ok); }
  .banner.ng { color: var(--ng); }

  /* ---- 結果 ---- */
  .result-stats {
    display: grid;
    gap: 10px;
    max-width: 380px;
    margin: 0 auto 32px;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .result-row span:last-child { font-variant-numeric: tabular-nums; }
  .result-row.total {
    border-color: var(--accent);
    background: rgba(59, 201, 219, .1);
  }
  .result-row.total span:last-child { font-size: 1.6rem; color: var(--accent); }

  .review {
    max-width: 560px;
    margin: 0 auto 32px;
    text-align: left;
  }
  .review h3 {
    font-size: .9rem;
    color: var(--muted);
    letter-spacing: .1em;
    margin: 0 0 10px;
  }
  .review ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .review li {
    display: flex;
    gap: 14px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: .95rem;
  }
  .review li b { color: var(--accent); font-weight: 600; min-width: 9em; }
  .review li span { overflow-wrap: anywhere; }

  .result-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .loading { text-align: center; color: var(--muted); padding: 60px 0; }

  @media (max-width: 700px) {
    #app { padding: 12px 14px 32px; }

    .title { margin: 14px 0 4px; font-size: 1.5rem; }
    .subtitle { margin: 0 0 20px; font-size: .8rem; }
    .btn-main { padding: 18px 20px; font-size: 1.1rem; }
    .note { margin-top: 18px; }

    .settings { padding: 14px; gap: 12px; }
    .setting-row { gap: 8px; }
    .setting-row label.ml { margin-left: 0; }
    .settings input { flex: 1 1 5em; width: auto; min-width: 0; }
    .settings select { flex: 1 1 auto; min-width: 0; }

    /* HUD は折り返さず1行に収め、ラベルを値の上に重ねて幅を節約する */
    .hud { gap: 12px; padding: 8px 0 12px; }
    .hud-item { flex-direction: column; align-items: flex-start; gap: 0; }
    /* 縦積みにすると数字同士が続いて読みにくいので区切り線を入れる */
    .hud-item + .hud-item { padding-left: 12px; border-left: 1px solid var(--line); }
    .hud-label { font-size: .62rem; letter-spacing: .06em; }
    .hud-item span:last-child { font-size: 1rem; }
    .btn-quit { padding: 7px 12px; min-height: 40px; font-size: .8rem; }

    .timer { margin-top: 10px; }

    .stage { padding: 20px 0 10px; }
    .prompt { margin: 16px 0 6px; font-size: 1.35rem; }
    .sub-prompt { font-size: .85rem; }
    .answer-line { margin: 18px 0 8px; font-size: 1.5rem; letter-spacing: .08em; }
    .guide { font-size: .95rem; }
    .stage-actions { margin-top: 18px; }
    .stage-actions .btn { flex: 1 1 0; min-height: 44px; padding: 10px 8px; }
    .banner { margin-top: 12px; font-size: 1rem; min-height: 3em; }

    .result-stats { margin-bottom: 22px; }
    .review li { flex-wrap: wrap; gap: 4px 14px; }
    .review li b { min-width: 0; }
    .result-actions { flex-direction: column; }
    .result-actions .btn { width: 100%; max-width: none; }
  }

  @media (max-width: 380px) {
    #app { padding: 10px 10px 28px; }
    .prompt { font-size: 1.2rem; }
    .answer-line { font-size: 1.3rem; }
    .hud { gap: 8px; }
  }

  /* 訳だけでは伝わらない語感・使い方の一言 */
  .nuance {
    display: block;
    margin-top: 6px;
    color: #8aa6c8;
    font-size: .85rem;
    line-height: 1.5;
  }
  .nuance::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 8px;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: middle;
    opacity: .7;
  }

  /* ---- 記録（履歴・苦手な語）---- */
  .stats-head {
    margin: 26px 0 10px;
    color: var(--muted);
    font-size: .85rem;
    letter-spacing: .1em;
  }
  .stats-head:first-child { margin-top: 0; }
  #stats-body { max-width: 560px; margin: 0 auto; }
  #stats-body .result-row { margin-bottom: 8px; }
  #stats-body .result-row span:first-child { font-size: .9rem; }

  .review-list-plain {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 6px;
  }
  .review-list-plain li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: .95rem;
  }
  .review-list-plain li b { color: var(--accent); font-weight: 600; min-width: 8em; }
  .review-list-plain li span { flex: 1; overflow-wrap: anywhere; }
  .miss-count { color: var(--ng); font-style: normal; font-size: .85rem; }

  /* タップで発音できる行 */
  li.say { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  li.say:hover { border-color: var(--accent); }
  li.say.said { border-color: var(--accent); background: rgba(59, 201, 219, .12); }
  .say-icon { margin-left: auto; font-style: normal; opacity: .55; font-size: .95rem; }
  li.say:hover .say-icon { opacity: 1; }

  @media (max-width: 700px) {
    .review-list-plain li { flex-wrap: wrap; gap: 4px 12px; }
    .review-list-plain li b { min-width: 0; }
  }

  /* ---- ゴースト（自己ベストとの並走）---- */
  .hud-item[hidden] { display: none; }
  .hud-item.ghost {
    gap: 6px;
    padding: 3px 12px;
    border-radius: 999px;
    background: rgba(147, 163, 189, .14);
    color: var(--muted);
  }
  .hud-item.ghost .gap { font-variant-numeric: tabular-nums; font-weight: 700; }
  .hud-item.ghost.lead   { background: rgba(52, 211, 153, .16); color: var(--ok); }
  .hud-item.ghost.behind { background: rgba(248, 113, 113, .16); color: var(--ng); }
  .hud-item.ghost.lead .hud-label,
  .hud-item.ghost.behind .hud-label { color: inherit; opacity: .75; }

  #result-subtitle .win  { color: var(--ok); }
  #result-subtitle .lose { color: var(--ng); }

  @media (max-width: 700px) {
    .hud-item.ghost { padding: 3px 8px; }
    .hud-item.ghost + .hud-item { border-left: none; }
  }

  /* 見出し語の答えのあとに出す、同じ番号の関連語 */
  .guide .related {
    display: inline-block;
    margin-top: 4px;
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(147, 163, 189, .1);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    font-size: .92rem;
    letter-spacing: 0;
    line-height: 1.6;
  }
  .guide .related b { color: var(--accent); font-weight: 600; }
  .guide .related i { font-style: normal; color: var(--muted); margin: 0 8px; }
  .related-label {
    margin-right: 10px;
    color: var(--muted);
    font-size: .75rem;
    letter-spacing: .1em;
  }

  /* 関連語は1語1行。語・訳・見出し語との違い */
  .guide .related { text-align: left; }
  .guide .related .related-label { display: block; margin-bottom: 2px; }
  .rel-row { display: block; }
  .rel-row b { margin-right: 10px; }
  .rel-ja { color: var(--text); }
  .rel-df { display: block; margin: 0 0 4px 1em; color: #8aa6c8; font-size: .82rem; }
  .rel-df::before { content: '└ '; color: var(--muted); }
  .nuance.rel-hint { color: #fbbf24; }
  .nuance.rel-hint::before { background: #fbbf24; }

  /* ---- 図表の穴埋め（歴史）---- */
  /* プリントの図表をそのまま出して、答えの語だけを紙色の札で伏せる。
     正解すると札が消えて、手書きの字がそのまま現れる。 */
  .zu-wrap {
    position: relative;
    width: 100%;
    max-width: 960px;
    margin: 0 auto 18px;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
  }
  .zu-wrap[hidden] { display: none; }
  .zu-wrap img { display: block; width: 100%; height: auto; }
  .zu-layer { position: absolute; inset: 0; }

  .zu-mask {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    border-radius: 4px;
    background: #dfe6f2;
    border: 1px solid #9aa8bf;
    color: #55627a;
    font-size: .8rem;
    font-weight: 700;
    line-height: 1;
    transition: opacity .18s ease;
  }
  .zu-mask.now {
    background: rgba(59, 201, 219, .92);
    border-color: var(--accent);
    color: #04232a;
    box-shadow: 0 0 0 3px rgba(59, 201, 219, .35);
  }
  .zu-mask.done { background: none; border-color: transparent; box-shadow: none; }
  .zu-mask.miss {
    background: none;
    border: 2px solid var(--ng);
    box-shadow: none;
  }

  /* 図表を選ぶ画面のボタンは、説明を2行目に置く */
  #zu-list .btn-main { flex-direction: column; align-items: flex-start; gap: 4px; }
  #zu-list .btn-main .soon { margin: 0; }

  @media (max-width: 700px) {
    .zu-wrap { margin-bottom: 12px; }
    .zu-mask { font-size: .6rem; border-radius: 3px; }
  }
</style>
