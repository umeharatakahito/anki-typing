<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="sans-serif">
<rect width="600" height="330" fill="#fff"/>
<rect x="30" y="20" width="540" height="290" rx="6" fill="#fffaf0" stroke="#8d6e63" stroke-width="2" />
<circle cx="58" cy="50" r="15" fill="#f57c00" stroke="#fff" stroke-width="2" />
<text x="58" y="51" font-size="19.95" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
<text x="84" y="50" font-size="15" text-anchor="start" dominant-baseline="middle" fill="#555" >（一部・わかりやすく書き直したもの）</text>
<text x="60" y="96" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#222" >一に曰く、和をもって貴しとなし、</text>
<text x="60" y="130" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#222" >　　さからうことなきを宗とせよ。</text>
<text x="60" y="164" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#222" >二に曰く、あつく三宝を敬え。</text>
<text x="60" y="198" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#222" >　　三宝とは仏・法（教え）・僧なり。</text>
<text x="60" y="232" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#222" >三に曰く、詔（天皇の命令）を</text>
<text x="60" y="266" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#222" >　　うけたまわりては必ずつつしめ。</text>
<text x="550" y="292" font-size="14" text-anchor="end" dominant-baseline="middle" fill="#555" >役人の心構えを示す</text>
</svg>
