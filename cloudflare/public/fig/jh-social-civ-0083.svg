<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" font-family="sans-serif">
<rect width="600" height="280" fill="#fff"/>
<text x="300" y="30" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#555" >衆議院が解散されている間</text>
<rect x="30" y="70" width="540" height="12" rx="0" fill="#e0e0e0" stroke="none" stroke-width="0" />
<rect x="30" y="70" width="540" height="12" rx="0" fill="none" stroke="#9e9e9e" stroke-width="1" />
<text x="30" y="100" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >解散</text>
<text x="570" y="100" font-size="14" text-anchor="end" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >総選挙→特別会</text>
<rect x="60" y="140" width="200" height="80" rx="8" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.5" />
<text x="160" y="170" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#9e9e9e" font-weight="bold" >衆議院</text>
<text x="160" y="198" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#9e9e9e" >（議員がいない）</text>
<rect x="340" y="140" width="200" height="80" rx="8" fill="#ffcc80" stroke="#f57c00" stroke-width="3" />
<text x="440" y="168" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >もう一方の議院</text>
<circle cx="440" cy="198" r="15" fill="#f57c00" stroke="#fff" stroke-width="2" />
<text x="440" y="199" font-size="19.95" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
<text x="440" y="250" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#555" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >内閣の求めで、緊急の必要があるとき</text>
<line x1="440" y1="82" x2="440" y2="138" stroke="#f57c00" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
