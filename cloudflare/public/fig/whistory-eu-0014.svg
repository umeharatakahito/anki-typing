<text x="120.0" y="132.8" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222">（農民が賦役で耕す）</text>
<rect x="220" y="70" width="340" height="110" rx="6" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
