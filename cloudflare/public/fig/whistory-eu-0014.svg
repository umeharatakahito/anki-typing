<line x1="390.0" y1="70" x2="390.0" y2="180" stroke="#a5d6a7" stroke-width="1"/>
<line x1="432.5" y1="70" x2="432.5" y2="180" stroke="#a5d6a7" stroke-width="1"/>
<line x1="475.0" y1="70" x2="475.0" y2="180" stroke="#a5d6a7" stroke-width="1"/>
<line x1="517.5" y1="70" x2="517.5" y2="180" stroke="#a5d6a7" stroke-width="1"/>
<text x="390" y="125.0" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">農民保有地（細長い地条）</text>
<rect x="40" y="200" width="140" height="70" rx="6" fill="#efebe9" stroke="#6d4c41" stroke-width="1.5"/>
