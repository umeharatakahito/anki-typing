<text x="160.0" y="310.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222">牧草地・森（共同で使う）</text>
<rect x="300" y="285" width="260" height="50" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="430.0" y="310.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222">農民：賦役と貢納・移動の自由なし</text>
<text x="300" y="375.0" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#555">この土地の単位を何という？</text>
<circle cx="575" cy="22" r="15" fill="#f57c00" stroke="#fff" stroke-width="2"/><text x="575" y="23" font-size="19.95" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
