<text x="360" y="240" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#f57c00" font-weight="bold" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >いくら増やしても直列部分より速くならない</text>
<circle cx="100" cy="270" r="15" fill="#f57c00" stroke="#fff" stroke-width="2" />
