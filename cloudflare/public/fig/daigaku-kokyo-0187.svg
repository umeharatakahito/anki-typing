<text x="150.0" y="160.0" font-size="13" text-anchor="start" dominant-baseline="middle" fill="#333" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">例）45,000票 ÷ 50,000票 × 100 ＝ 90%</text>
<text x="300.0" y="200.0" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#555" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">比例名簿で同じ順位の重複立候補者の当落を決める</text>
