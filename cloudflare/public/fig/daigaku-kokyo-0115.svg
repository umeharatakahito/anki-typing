<rect x="250.0" y="50.0" width="190.0" height="70.0" rx="6" fill="#fff" stroke="#b0bec5" stroke-width="2"/><text x="345.0" y="77.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222">累進課税で税収が増え</text>
<text x="345.0" y="92.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222">失業給付などは減る</text>
