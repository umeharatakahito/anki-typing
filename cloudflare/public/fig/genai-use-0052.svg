<text x="335" y="178" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >順番3</text>
<line x1="270" y1="66" x2="465" y2="120" stroke="#37474f" stroke-width="1.5"/>
