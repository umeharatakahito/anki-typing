<text x="465" y="140" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >出欠を集める</text>
<text x="465" y="178" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >順番4</text>
<circle cx="520" cy="110" r="15" fill="#f57c00" stroke="#fff" stroke-width="2" />
<text x="520" y="111" font-size="19.95" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
<text x="270" y="230" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >大きな目標を小さな作業に分け、取り組む順番を決める</text>
