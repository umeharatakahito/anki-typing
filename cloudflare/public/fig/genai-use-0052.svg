<text x="205" y="178" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >順番2</text>
<line x1="270" y1="66" x2="335" y2="120" stroke="#37474f" stroke-width="1.5"/>
<rect x="280" y="120" width="110" height="40" rx="6" fill="#ffcc80" stroke="#f57c00" stroke-width="2" />
