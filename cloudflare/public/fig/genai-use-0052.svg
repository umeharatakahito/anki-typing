<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="540" height="260" font-family="sans-serif">
<rect width="540" height="260" fill="#fff"/>
<rect x="170" y="20" width="200" height="44" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" />
<text x="270" y="42" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#222" >社内イベントを開く</text>
<line x1="270" y1="66" x2="75" y2="120" stroke="#37474f" stroke-width="1.5"/>
<rect x="20" y="120" width="110" height="40" rx="6" fill="#ffcc80" stroke="#f57c00" stroke-width="2" />
<text x="75" y="140" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >日程を決める</text>
<text x="75" y="178" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >順番1</text>
<line x1="270" y1="66" x2="205" y2="120" stroke="#37474f" stroke-width="1.5"/>
