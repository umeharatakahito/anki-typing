<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="sans-serif">
<rect width="600" height="260" fill="#fff"/>
<text x="300" y="22" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#555" >国会が開かれる時期（例）</text>
<rect x="60" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="80" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >1月</text>
<rect x="100" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="120" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >2月</text>
<rect x="140" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="160" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >3月</text>
<rect x="180" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="200" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >4月</text>
<rect x="220" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="240" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >5月</text>
<rect x="260" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="280" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >6月</text>
<rect x="300" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="320" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >7月</text>
<rect x="340" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="360" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >8月</text>
<rect x="380" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="400" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >9月</text>
<rect x="420" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="440" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >10月</text>
<rect x="460" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="480" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >11月</text>
<rect x="500" y="40" width="40" height="24" rx="0" fill="#eceff1" stroke="#b0bec5" stroke-width="1" />
<text x="520" y="52" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" >12月</text>
<rect x="60" y="90" width="200" height="44" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" />
<text x="160" y="112" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >常会</text>
<text x="160" y="154" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#37474f" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >毎年1回・150日間</text>
<text x="160" y="172" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#37474f" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >予算の審議</text>
<rect x="400" y="90" width="80" height="44" rx="6" fill="#ffcc80" stroke="#f57c00" stroke-width="2.5" />
<circle cx="440" cy="112" r="16" fill="#f57c00" stroke="#fff" stroke-width="2" />
<text x="440" y="113" font-size="21.28" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
<text x="440" y="154" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#37474f" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >必要に応じて</text>
<text x="300" y="225" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#555" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >内閣が必要と認めたとき、または</text>
<text x="300" y="245" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#555" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >いずれかの議院の総議員の4分の1以上の要求</text>
</svg>
