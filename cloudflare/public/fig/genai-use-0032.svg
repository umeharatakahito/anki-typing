<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" font-family="sans-serif">
<rect width="540" height="250" fill="#fff"/>
<rect x="40" y="50" width="460" height="90" rx="8" fill="#fff" stroke="#37474f" stroke-width="2" />
<text x="56" y="80" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#222" >日本の四季について説明します。春は桜が咲き、夏は暑く</text>
<text x="56" y="108" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#222" >、秋は紅葉が美しく、冬は</text>
<line x1="266" y1="94" x2="266" y2="122" stroke="#d32f2f" stroke-width="3"/>
<rect x="160" y="160" width="220" height="40" rx="6" fill="#ffcc80" stroke="#f57c00" stroke-width="3" />
<text x="270" y="180" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >? ＝ 200</text>
<circle cx="380" cy="160" r="15" fill="#f57c00" stroke="#fff" stroke-width="2" />
<text x="380" y="161" font-size="19.95" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
<text x="270" y="225" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >1回の応答で出力できる長さの上限</text>
<text x="490" y="150" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#d32f2f" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >ここで止まる</text>
</svg>
