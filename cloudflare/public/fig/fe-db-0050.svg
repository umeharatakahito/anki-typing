<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" font-family="sans-serif">
<rect width="560" height="240" fill="#fff"/>
<rect x="20" y="30" width="390" height="124" rx="8" fill="#263238" stroke="#263238" stroke-width="1" />
<text x="34" y="58" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#fff" >SELECT 氏名 FROM 顧客 C</text>
<rect x="34" y="75" width="90" height="26" rx="4" fill="#ffcc80" stroke="#f57c00" stroke-width="2" />
<text x="79" y="88" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >WHERE ?</text>
<circle cx="124" cy="76" r="15" fill="#f57c00" stroke="#fff" stroke-width="2" />
<text x="124" y="77" font-size="19.95" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
<text x="148" y="88" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#fff" >(SELECT * FROM 注文 O</text>
<text x="60" y="118" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#fff" >WHERE O.顧客番号 = C.顧客番号)</text>
<text x="270" y="190" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >副問合せの結果が1行でもあれば真、なければ偽</text>
<text x="270" y="212" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#f57c00" font-weight="bold" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >→ 注文したことのある顧客だけ</text>
<text x="480" y="60" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >値は見ない</text>
<text x="480" y="78" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >行の有無だけ</text>
</svg>
