<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="540" height="260" font-family="sans-serif">
<rect width="540" height="260" fill="#fff"/>
<line x1="140" y1="50" x2="80" y2="130" stroke="#37474f" stroke-width="2"/>
<line x1="140" y1="50" x2="200" y2="130" stroke="#37474f" stroke-width="2"/>
<line x1="80" y1="130" x2="40" y2="210" stroke="#37474f" stroke-width="2"/>
<line x1="80" y1="130" x2="120" y2="210" stroke="#37474f" stroke-width="2"/>
<circle cx="140" cy="50" r="20" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" />
<text x="140" y="50" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >×</text>
<circle cx="80" cy="130" r="20" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" />
<text x="80" y="130" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >+</text>
<circle cx="200" cy="130" r="20" fill="#fff" stroke="#37474f" stroke-width="2" />
<text x="200" y="130" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >2</text>
<circle cx="40" cy="210" r="20" fill="#fff" stroke="#37474f" stroke-width="2" />
<text x="40" y="210" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >3</text>
<circle cx="120" cy="210" r="20" fill="#fff" stroke="#37474f" stroke-width="2" />
<text x="120" y="210" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >4</text>
<text x="380" y="60" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >(3 + 4) × 2 を</text>
<rect x="290" y="90" width="200" height="50" rx="6" fill="#ffcc80" stroke="#f57c00" stroke-width="3" />
<text x="390" y="115" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >3 4 + 2 ×</text>
<circle cx="490" cy="90" r="15" fill="#f57c00" stroke="#fff" stroke-width="2" />
<text x="490" y="91" font-size="19.95" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
<text x="390" y="170" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >演算子を値の後ろに書く</text>
<text x="390" y="192" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >（かっこが不要）</text>
</svg>
