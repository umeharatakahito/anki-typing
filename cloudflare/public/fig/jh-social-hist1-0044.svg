<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="sans-serif">
<rect width="600" height="330" fill="#fff"/>
<rect x="20" y="20" width="560" height="40" rx="0" fill="#cfd8dc" stroke="#37474f" stroke-width="2" />
<text x="65" y="40" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >負担</text>
<text x="305" y="40" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >内容</text>
<text x="540" y="40" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >納め先</text>
<rect x="20" y="60" width="560" height="48" rx="0" fill="#fff" stroke="#37474f" stroke-width="1.5" />
<text x="65" y="84" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >租</text>
<text x="122" y="84" font-size="17" text-anchor="start" dominant-baseline="middle" fill="#222" >稲（収穫の約3%）</text>
<text x="540" y="84" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222" >国府</text>
<rect x="20" y="108" width="560" height="48" rx="0" fill="#fff" stroke="#37474f" stroke-width="1.5" />
<text x="65" y="132" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >庸</text>
<text x="122" y="132" font-size="17" text-anchor="start" dominant-baseline="middle" fill="#222" >労役のかわりに布</text>
<text x="540" y="132" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222" >都</text>
<rect x="20" y="156" width="560" height="48" rx="0" fill="#fff8e1" stroke="#37474f" stroke-width="1.5" />
<rect x="38" y="163" width="54" height="34" rx="6" fill="#ffcc80" stroke="#f57c00" stroke-width="2.5" />
<text x="65" y="181" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#f57c00" font-weight="bold" >?</text>
<text x="122" y="180" font-size="17" text-anchor="start" dominant-baseline="middle" fill="#222" >地方の特産物（絹・塩・海産物など）</text>
<text x="540" y="180" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222" >都</text>
<rect x="20" y="204" width="560" height="48" rx="0" fill="#fff" stroke="#37474f" stroke-width="1.5" />
<text x="65" y="228" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >雑徭</text>
<text x="122" y="228" font-size="17" text-anchor="start" dominant-baseline="middle" fill="#222" >地方での労役（年60日以内）</text>
<text x="540" y="228" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222" >―</text>
<rect x="20" y="252" width="560" height="48" rx="0" fill="#fff" stroke="#37474f" stroke-width="1.5" />
<text x="65" y="276" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >兵役</text>
<text x="122" y="276" font-size="17" text-anchor="start" dominant-baseline="middle" fill="#222" >衛士・防人など</text>
<text x="540" y="276" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222" >―</text>
<line x1="110" y1="20" x2="110" y2="300" stroke="#37474f" stroke-width="1.2"/>
<line x1="500" y1="20" x2="500" y2="300" stroke="#37474f" stroke-width="1.2"/>
<text x="300" y="318" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#555" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >律令国家の人々の負担</text>
</svg>
