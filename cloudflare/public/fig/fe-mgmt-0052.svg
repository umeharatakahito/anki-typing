<text x="250" y="230" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222" >作業ごとの見積り</text>
<rect x="170" y="130" width="160" height="60" rx="0" fill="#ffcc80" stroke="#f57c00" stroke-width="3" />
