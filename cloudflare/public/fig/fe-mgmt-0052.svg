<text x="250" y="174" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#222" >特定済みリスクへの備え</text>
<circle cx="330" cy="130" r="15" fill="#f57c00" stroke="#fff" stroke-width="2" />
<text x="330" y="131" font-size="19.95" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
<rect x="170" y="80" width="160" height="50" rx="0" fill="#eceff1" stroke="#90a4ae" stroke-width="2" stroke-dasharray="5 4"/>
