<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="sans-serif">
<rect width="600" height="300" fill="#fff"/>
<text x="300" y="20.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold">田畑のうち小作地の割合</text>
<text x="90" y="95.0" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#222">1941年</text>
<rect x="140" y="70" width="216.0" height="50" rx="0" fill="#c5e1a5" stroke="#558b2f" stroke-width="1.5"/>
<text x="248.0" y="95.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222">自作地 54%</text>
<rect x="356.0" y="70" width="184.0" height="50" rx="0" fill="#ffcc80" stroke="#ef6c00" stroke-width="1.5"/>
<text x="448.0" y="95.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222">小作地 46%</text>
<text x="90" y="195.0" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#222">1950年</text>
<rect x="140" y="170" width="360.0" height="50" rx="0" fill="#c5e1a5" stroke="#558b2f" stroke-width="1.5"/>
<text x="320.0" y="195.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222">自作地 90%</text>
<rect x="500.0" y="170" width="40.0" height="50" rx="0" fill="#ffcc80" stroke="#ef6c00" stroke-width="1.5"/>
<text x="520.0" y="195.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222">小作地 10%</text>
<text x="300" y="262.0" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#555">地主の土地を国が買い上げ、小作人に安く売った</text>
<circle cx="575" cy="22" r="15" fill="#f57c00" stroke="#fff" stroke-width="2"/><text x="575" y="23" font-size="19.95" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
</svg>
