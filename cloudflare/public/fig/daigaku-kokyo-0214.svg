<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="sans-serif">
<rect width="600" height="300" fill="#fff"/>
<rect x="0" y="0" width="80" height="300" fill="#d7ccc8"/><text x="40.0" y="150.0" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold">陸地</text>
<rect x="80" y="40" width="70" height="190" fill="#90caf9" stroke="#90caf9" stroke-width="1"/>
<text x="115.0" y="135.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#0d47a1" font-weight="bold" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">領海</text>
<text x="150.0" y="250.0" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">12海里</text>
<line x1="150" y1="232" x2="150" y2="240" stroke="#333"/>
<rect x="150" y="40" width="80" height="190" fill="#bbdefb" stroke="#90caf9" stroke-width="1"/>
<text x="190.0" y="135.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#0d47a1" font-weight="bold" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">接続水域</text>
<text x="230.0" y="250.0" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">24海里</text>
<line x1="230" y1="232" x2="230" y2="240" stroke="#333"/>
<rect x="230" y="40" width="290" height="190" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
<text x="375.0" y="126.9" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#0d47a1" font-weight="bold" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">排他的</text>
<text x="375.0" y="143.1" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#0d47a1" font-weight="bold" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">経済水域</text>
<text x="520.0" y="250.0" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">200海里</text>
<line x1="520" y1="232" x2="520" y2="240" stroke="#333"/>
<rect x="520" y="40" width="80" height="190" fill="#f5f5f5" stroke="#90caf9" stroke-width="1"/>
<text x="560.0" y="135.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#0d47a1" font-weight="bold" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">公海</text>
<text x="80.0" y="250.0" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">基線</text>
<text x="300.0" y="280.0" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#555" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">（1海里＝1852m）</text>
<text x="300.0" y="20.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#333" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">これらの水域を定めた国際的なルールは？</text>
<circle cx="520.0" cy="20.0" r="15" fill="#f57c00" stroke="#fff" stroke-width="2"/><text x="520.0" y="21.0" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
</svg>