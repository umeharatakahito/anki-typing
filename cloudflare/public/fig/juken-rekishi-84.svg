<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360" font-family="sans-serif">
<rect width="540" height="360" fill="#fff"/>
<text x="270" y="24.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#f57c00" font-weight="bold">ムスリムの義務（？）</text>
<rect x="20" y="50" width="240" height="270" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<rect x="280" y="50" width="240" height="270" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="140" y="75.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#0d47a1" font-weight="bold">6つの信仰の対象</text>
<text x="400" y="75.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#1b5e20" font-weight="bold">5つの行為</text>
<text x="140" y="110.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">神（アッラー）</text>
<text x="140" y="144.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">天使</text>
<text x="140" y="178.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">啓典</text>
<text x="140" y="212.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">預言者</text>
<text x="140" y="246.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">来世</text>
<text x="140" y="280.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">天命（定命）</text>
<text x="400" y="110.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">信仰告白</text>
<text x="400" y="148.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">礼拝（1日5回）</text>
<text x="400" y="186.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">断食（ラマダーン月）</text>
<text x="400" y="224.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">喜捨</text>
<text x="400" y="262.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222">巡礼（メッカ）</text>
<text x="270" y="342.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#555">6つの信仰と5つの行為をまとめて何という？</text>
</svg>
