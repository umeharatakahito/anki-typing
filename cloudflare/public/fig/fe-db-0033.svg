<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="540" height="260" font-family="sans-serif">
<rect width="540" height="260" fill="#fff"/>
<rect x="60" y="30" width="420" height="42" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" />
<text x="120" y="51" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >原子性</text>
<text x="310" y="51" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222" >全部やるか、全くやらないか</text>
<rect x="60" y="80" width="420" height="42" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" />
<text x="120" y="101" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >一貫性</text>
<text x="310" y="101" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222" >前後で制約を満たし矛盾がない</text>
<rect x="60" y="130" width="420" height="42" rx="6" fill="#ffcc80" stroke="#f57c00" stroke-width="3" />
<text x="120" y="151" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#f57c00" font-weight="bold" >?</text>
<text x="310" y="151" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >同時に動いても互いに影響しない</text>
<circle cx="480" cy="130" r="15" fill="#f57c00" stroke="#fff" stroke-width="2" />
<text x="480" y="131" font-size="19.95" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
<rect x="60" y="180" width="420" height="42" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" />
<text x="120" y="201" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222" font-weight="bold" >耐久性</text>
<text x="310" y="201" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222" >確定した結果は障害でも消えない</text>
<text x="270" y="240" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >トランザクションに求められる4つの性質</text>
</svg>
