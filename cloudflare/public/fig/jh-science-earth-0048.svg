<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="sans-serif">
<rect width="600" height="340" fill="#fff"/>
<text x="300" y="30" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >気温20℃の空気1m³</text>
<rect x="150" y="60" width="380" height="60" rx="0" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" />
<text x="40" y="90" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >ふくむことが</text>
<text x="40" y="108" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >できる最大量</text>
<text x="340" y="90" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222" >17.3 g</text>
<rect x="150" y="150" width="200" height="60" rx="0" fill="#90caf9" stroke="#1976d2" stroke-width="2" />
<text x="40" y="180" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >実際の水蒸気量</text>
<text x="250" y="180" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222" >8.7 g</text>
<line x1="350" y1="145" x2="350" y2="215" stroke="#f57c00" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="530" y1="145" x2="530" y2="215" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="300" y="265" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >8.7 ÷ 17.3 × 100 ≒ 50</text>
<circle cx="470" cy="265" r="17" fill="#f57c00" stroke="#fff" stroke-width="2" />
<text x="470" y="266" font-size="22.61" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="bold">?</text>
<text x="510" y="267" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >%</text>
<text x="300" y="315" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" >（空気のしめりぐあい）</text>
</svg>
